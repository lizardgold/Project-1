x-idempotency:
  header: Idempotency-Key
  requiredFor:
    - createCertificateRevocation
  ttlHours: 24
  scope: |
    Ключ уникален в пределах инициатора и операции. Отпечаток запроса
    включает метод, путь, параметры и тело.
  replayHeader: Idempotent-Replayed
  behavior: |
    Повтор с тем же ключом и тем же отпечатком возвращает сохранённый ответ
    с заголовком Idempotent-Replayed: true. Сохранённый ответ отражает
    состояние на момент первого запроса; актуальное состояние операции
    нужно получать через GET. Повтор с другим отпечатком —
    409 IDEMPOTENCY_KEY_REUSED. Параллельный запрос с тем же ключом —
    409 IDEMPOTENCY_KEY_IN_PROGRESS (допустим повтор после задержки).
  businessUniqueness: |
    Независимо от ключа для сертификата допускается не более одной
    незавершённой операции отзыва. Повторный POST с новым ключом при
    активной операции возвращает 409 REVOCATION_ALREADY_IN_PROGRESS и
    Location существующей операции. При результате UNKNOWN возвращается
    409 REVOCATION_RESULT_UNKNOWN; новая операция блокируется до завершения
    сверки с УЦ.
  conflictCodes:
    - IDEMPOTENCY_KEY_REQUIRED
    - IDEMPOTENCY_KEY_REUSED
    - IDEMPOTENCY_KEY_IN_PROGRESS
    - REVOCATION_ALREADY_IN_PROGRESS
    - REVOCATION_RESULT_UNKNOWN
x-state-machine:
  certificateRevocation:
    initial: ACCEPTED
    terminal:
      - REVOKED
      - REJECTED
      - FAILED
    states:
      ACCEPTED: Запрос принят, проверки пройдены, операция в очереди
      SUBMITTED: Запрос передан в УЦ, подтверждение не получено
      REVOKED: УЦ подтвердил отзыв
      REJECTED: Отзыв отклонён по бизнес-причине
      FAILED: Операция не выполнена, внешний эффект подтверждённо отсутствует
      UNKNOWN: Результат не установлен, выполняется сверка
    transitions:
      - from: ACCEPTED
        to: SUBMITTED
        trigger: Запрос передан в УЦ
      - from: ACCEPTED
        to: REJECTED
        trigger: Проверка после создания операции выявила бизнес-основание для отказа
      - from: ACCEPTED
        to: FAILED
        trigger: Техническая ошибка до передачи запроса в УЦ
      - from: SUBMITTED
        to: REVOKED
        trigger: УЦ подтвердил отзыв
      - from: SUBMITTED
        to: REJECTED
        trigger: УЦ отказал в отзыве или сертификат не найден в УЦ
      - from: SUBMITTED
        to: UNKNOWN
        trigger: Тайм-аут, недоступность УЦ или неоднозначный ответ
      - from: UNKNOWN
        to: REVOKED
        trigger: Сверка подтвердила отзыв
      - from: UNKNOWN
        to: REJECTED
        trigger: Сверка подтвердила отказ или отсутствие сертификата в УЦ
      - from: UNKNOWN
        to: FAILED
        trigger: Сверка подтвердила, что запрос не был выполнен
  certificate:
    initial: ACTIVE
    terminal:
      - REVOKED
    states:
      ACTIVE: Сертификат не отозван; срок действия проверяется отдельно
      REVOCATION_PENDING: Есть незавершённая операция отзыва
      REVOKED: УЦ подтвердил отзыв
      UNKNOWN: Состояние не подтверждено УЦ
    transitions:
      - from: ACTIVE
        to: UNKNOWN
        trigger: Не удалось подтвердить состояние сертификата при периодической проверке
      - from: ACTIVE
        to: REVOCATION_PENDING
        trigger: Создана операция отзыва
      - from: REVOCATION_PENDING
        to: REVOKED
        trigger: Операция завершилась состоянием REVOKED
      - from: REVOCATION_PENDING
        to: ACTIVE
        trigger: Операция завершилась REJECTED или FAILED, УЦ подтвердил действие сертификата
      - from: REVOCATION_PENDING
        to: UNKNOWN
        trigger: Состояние сертификата не удалось подтвердить
      - from: UNKNOWN
        to: ACTIVE
        trigger: Сверка подтвердила, что сертификат действует и активной операции нет
      - from: UNKNOWN
        to: REVOKED
        trigger: Сверка подтвердила отзыв
      - from: UNKNOWN
        to: REVOCATION_PENDING
        trigger: Сверка подтвердила наличие активной операции
    invariants:
      - Статус REVOCATION_PENDING означает наличие activeRevocationId.
      - Статус REVOKED устанавливается только после подтверждения УЦ.
      - Срок действия отражается отдельно в validityStatus и не меняет статус отзыва.
x-authorization:
  initiatorTypes:
    CLIENT:
      token: clientOAuth
      checks:
        - subject токена совпадает с clientId сертификата
        - токен выпущен после повторной идентификации при недоступности потерянного устройства
        - scope certificate-revocations:write для создания операции
    PARTNER_EMPLOYEE:
      token: partnerEmployeeOAuth
      checks:
        - сертификат принадлежит клиенту партнёра, определяемого по client_id токена
        - токен содержит роль и разрешение на отзыв сертификатов
        - при необходимости выполняется дополнительное подтверждение сотрудника
    PARTNER_SYSTEM:
      token: partnerOAuth
      checks:
        - сертификат принадлежит клиенту партнёра, определяемого по client_id токена
        - токен содержит scope certificate-revocations:write
        - вызов выполняется в рамках разрешённого сценария партнёра
  commonChecks:
    - Токен не истёк, подпись, iss, aud и scope корректны
    - Инициатор имеет право на операцию с конкретным сертификатом
    - Знание certificateId или revocationId не предоставляет прав
    - Чужой сертификат или операция неотличимы от отсутствующих и дают 404
    - Перед созданием операции повторно проверяются статус и срок действия сертификата
  stepUp:
    requiredFor:
      - createCertificateRevocation
    maxAuthenticationAgeSeconds: 900
    requirement: |
      Для клиентского токена требуется аутентификация после начала инцидента,
      а не сессия, восстановленная на потерянном устройстве. Конкретные
      значения acr/amr, допустимый возраст аутентификации и перечень
      допустимых каналов повторной идентификации определяются OQ-01.
  notFoundPolicy: |
    Сервис не раскрывает существование чужих сертификатов и операций.
    При недостаточном scope или роли возвращается 403, при отсутствии
    отношения инициатора к объекту — 404. Чужой объект неотличим от
    отсутствующего.
x-uc-integration:
  status: preliminary
  note: |
    Описан логический контракт взаимодействия с УЦ. Конкретные методы, коды
    ответов, формат идентификаторов и способ подтверждения определяются
    договором с УЦ (OQ-02). Спецификация не предполагает единого API УЦ для
    всех функций.
  operations:
    submitRevocation:
      purpose: Передать в УЦ запрос на отзыв конкретного сертификата
      identifiers:
        - serialNumber
        - issuer
        - fingerprintSha256
      requestIdempotency: |
        Сервис передаёт собственный ucRequestId и не повторяет запрос без
        проверки результата предыдущей попытки, если УЦ не гарантирует
        идемпотентность.
    getRevocationStatus:
      purpose: Получить подтверждённое состояние сертификата после отзыва
      usage: |
        Используется для устранения неопределённого результата и для
        периодической сверки. Ответ УЦ имеет приоритет над локальным
        состоянием операции.
  timeoutSeconds: 10
  retryPolicy:
    maxAttempts: 4
    maxAttemptsNote: Четыре попытки передачи запроса, включая первоначальную; три повтора после неё.
    backoffSeconds:
      - 1
      - 2
      - 4
    retryOn:
      - timeout
      - 429
      - 500
      - 502
      - 503
      - 504
    doNotRetryOn:
      - 400
      - 401
      - 403
      - 404
      - 409
      - 422
    respectRetryAfter: true
  reconciliation:
    intervalSeconds: 60
    maxWindowHours: 24
    afterWindow: manual_review
    note: |
      До истечения окна сервис автоматически сверяет состояние. После
      исчерпания окна операция остаётся в UNKNOWN и передаётся на ручной
      разбор; конкретный регламент — OQ-10.
  reasonMapping:
    status: preliminary
    note: |
      Сопоставление бизнес-причин с кодами причин УЦ (RFC 5280) требует
      подтверждения (OQ-09). УЦ может использовать собственный справочник.
    mapping:
      PHONE_LOST: keyCompromise
      PHONE_STOLEN: keyCompromise
      DEVICE_COMPROMISED: keyCompromise
      CERTIFICATE_COMPROMISED: keyCompromise
      OTHER: unspecified
  resultMapping:
    UC_REVOKED: REVOKED
    UC_ALREADY_REVOKED: REVOKED
    UC_REFUSED: REJECTED
    UC_CERTIFICATE_NOT_FOUND: REJECTED
    UC_TIMEOUT: UNKNOWN
    UC_UNAVAILABLE: UNKNOWN
    UC_INVALID_RESPONSE: UNKNOWN
  unknownResultPolicy: |
    Если запрос мог быть получен УЦ, но подтверждение не получено, операция
    переходит в UNKNOWN. Повторная отправка запроса на отзыв блокируется до
    завершения сверки. Если сверка подтвердила, что запрос не выполнялся,
    операция переходит в FAILED и новая операция допускается.
x-rate-limits:
  revocationCreate:
    requestsPerMinute: 10
    scope: Инициатор (subject клиентского токена или client_id партнёра)
  certificateRead:
    requestsPerMinute: 120
    scope: Инициатор
  revocationRead:
    requestsPerMinute: 240
    scope: Инициатор
  note: |
    Значения предварительные и требуют подтверждения по нагрузке и
    требованиям безопасности. При превышении возвращается 429 с Retry-After.
x-open-questions:
  - id: OQ-01
    question: |
      Какой механизм повторной идентификации клиента применяется при потере
      телефона: вход в приложение партнёра на новом устройстве, обращение в
      поддержку, ЕСИА или комбинация? Какие значения acr/amr и какой
      максимальный возраст аутентификации считать достаточными для
      юридически значимого отзыва?
    impact: |
      Влияет на clientOAuth, требования к step-up, состав initiator,
      доказательную базу и возможность инициировать отзыв без доступа к
      потерянному устройству.
    status: OPEN
    owner: Владелец продукта, архитектор безопасности
  - id: OQ-02
    question: |
      Каков фактический контракт УЦ: синхронный ответ, асинхронный статус,
      callback, идемпотентность, коды причин и ошибок, сроки подтверждения?
      Поддерживает ли УЦ поиск сертификата по отпечатку и серийному номеру?
    impact: |
      Влияет на x-uc-integration, тайм-ауты, retryPolicy, состояния
      SUBMITTED/UNKNOWN/REJECTED и требования к сверке.
    status: OPEN
    owner: Владелец интеграции с УЦ
  - id: OQ-03
    question: |
      Допускается ли отзыв сертификата с истёкшим или ещё не вступившим в
      силу сроком действия? Требуется ли отзыв для сертификатов, срок
      действия которых уже завершён?
    impact: |
      Влияет на проверку CERTIFICATE_NOT_ACTIVE и поведение POST. В текущей
      версии такие сертификаты не допускаются к отзыву.
    status: OPEN
    owner: Владелец продукта, юридическая служба, УЦ
  - id: OQ-04
    question: |
      Как должно API сообщать об уже отозванном сертификате: 409 с отдельным
      кодом, 200 с результатом существующей операции или 303 на ресурс
      операции? Текущая версия возвращает 409 CERTIFICATE_ALREADY_REVOKED.
    impact: |
      Влияет на клиентскую обработку, UX и совместимость с партнёрскими
      интеграциями.
    status: OPEN
    owner: Владелец продукта, архитектор
  - id: OQ-05
    question: |
      Нужен ли массовый отзыв нескольких сертификатов клиента (например,
      при компрометации всех устройств) одной операцией? Текущая версия
      поддерживает только один сертификат на операцию.
    impact: |
      Влияет на модель операции, идемпотентность, частичный успех и
      контракт POST.
    status: OPEN
    owner: Владелец продукта
  - id: OQ-06
    question: |
      Каковы сроки хранения операций отзыва, журналов аудита и персональных
      данных инициатора? Требуется ли удаление или обезличивание по
      истечении срока?
    impact: |
      Влияет на retention, состав CertificateRevocation, lastRevocationId и
      требования к аудиту.
    status: OPEN
    owner: Юридическая служба, служба эксплуатации
  - id: OQ-07
    question: |
      Нужны ли асинхронные уведомления партнёра о результате отзыва
      (webhook, SMS, push), или достаточно опроса статуса? Текущая версия
      поддерживает только опрос.
    impact: |
      Влияет на необходимость webhook-контракта, события и инфраструктуру
      доставки.
    status: OPEN
    owner: Владелец продукта, владельцы интеграций
  - id: OQ-08
    question: |
      Должен ли сотрудник поддержки иметь отдельный канал и полномочия для
      инициирования отзыва? Как подтверждается его право действовать от
      имени клиента и как это фиксируется в аудите?
    impact: |
      Влияет на состав RevocationInitiatorType, securitySchemes и
      требования к аудиту. В текущей версии поддержка не выделена как
      отдельный тип инициатора.
    status: OPEN
    owner: Владелец продукта, служба поддержки, архитектор безопасности
  - id: OQ-09
    question: |
      Какие коды причин отзыва требует УЦ и как бизнес-причины PHONE_LOST,
      PHONE_STOLEN, DEVICE_COMPROMISED, CERTIFICATE_COMPROMISED и OTHER
      отображаются на них? Достаточно ли кода keyCompromise для потери
      телефона или допустим cessationOfOperation, если компрометация
      приватного ключа не подтверждена?
    impact: |
      Влияет на reasonMapping, юридическую значимость причины и данные,
      передаваемые в УЦ.
    status: OPEN
    owner: Владелец интеграции с УЦ, юридическая служба
  - id: OQ-10
    question: |
      Каков предельный срок пребывания операции в UNKNOWN и регламент
      ручного разбора после исчерпания окна автоматической сверки? Кто
      принимает решение и как результат фиксируется?
    impact: |
      Влияет на reconciliation.maxWindowHours, nextRetryAt, статус UNKNOWN
      и нагрузку на поддержку.
    status: OPEN
    owner: Служба эксплуатации, служба поддержки, архитектор
  - id: OQ-11
    question: |
      Какой корпоративный IdP партнёра используется и какие claims
      подтверждают сотрудника, партнёра, роль и право на отзыв? Требуется ли
      MFA для всех отзывов или только для отдельных категорий?
    impact: |
      Влияет на partnerEmployeeOAuth, проверку полномочий, аудит и
      возможность разграничить действия сотрудника и системы партнёра.
    status: OPEN
    owner: Архитектор безопасности, владелец интеграции с партнёром
x-assumptions:
  - id: A-01
    statement: |
      Одна операция отзыва относится к одному сертификату; массовый отзыв
      в первой версии не поддерживается.
    rationale: Упрощает модель состояния, идемпотентность и обработку частичного успеха.
    affected: CreateCertificateRevocationRequest, CertificateRevocation
  - id: A-02
    statement: |
      Клиентский токен для отзыва выпускается после повторной идентификации;
      максимальный возраст аутентификации — 15 минут. Конкретные acr/amr и
      каналы идентификации требуют согласования.
    rationale: Потеря телефона исключает использование сессии на потерянном устройстве.
    affected: clientOAuth, x-authorization.stepUp
  - id: A-03
    statement: |
      Для сертификата допускается не более одной незавершённой операции
      отзыва; уникальность обеспечивается сервисом, а не только
      Idempotency-Key.
    rationale: Соответствует бизнес-правилу 3.2 о повторных запросах, относящихся к одному намерению.
    affected: createCertificateRevocation, x-idempotency.businessUniqueness
  - id: A-04
    statement: |
      Взаимодействие с УЦ асинхронное: POST создаёт операцию, а результат
      подтверждается отдельно. Ошибки УЦ не возвращаются в POST.
    rationale: Принятие запроса не равно фактическому отзыву (бизнес-правило 3.3).
    affected: createCertificateRevocation, RevocationStatus
  - id: A-05
    statement: |
      FAILED означает подтверждённое отсутствие внешнего эффекта. Тайм-аут
      или недоступность УЦ переводят операцию в UNKNOWN, а не в FAILED.
    rationale: Соответствует правилу 4.4 о неопределённом результате.
    affected: RevocationStatus, RevocationError, x-uc-integration
  - id: A-06
    statement: |
      Срок хранения ключа идемпотентности — 24 часа; ключ уникален в
      пределах инициатора и операции.
    rationale: Согласуется с уже принятым решением для API подписания пакета.
    affected: Idempotency-Key, x-idempotency
  - id: A-07
    statement: |
      Статус сертификата отражает последнее подтверждённое состояние УЦ и
      может быть устаревшим; время проверки фиксируется в statusCheckedAt.
    rationale: Локальная база не является источником истины об отзыве.
    affected: Certificate.status, Certificate.statusCheckedAt
  - id: A-08
    statement: |
      Рекомендуемая стратегия опроса: первый запрос через 1 секунду, далее
      экспоненциально до 30 секунд, с учётом Retry-After.
    rationale: Снижает нагрузку при длительном подтверждении УЦ.
    affected: getCertificateRevocation, Retry-After
  - id: A-09
    statement: |
      Чужие сертификаты и операции возвращаются как 404, а не 403, чтобы не
      раскрывать их существование.
    rationale: Снижает риск утечки сведений о клиентах и сертификатах.
    affected: getCertificate, getCertificateRevocation, x-authorization
  - id: A-10
    statement: |
      В первой версии уведомления о результате отзыва не предусмотрены;
      используется опрос статуса.
    rationale: Сокращает объём контракта; необходимость уведомлений — OQ-07.
    affected: x-open-questions, CertificateRevocation
  - id: A-11
    statement: |
      reasonDetails обязателен при reason=OTHER; comment не должен содержать
      персональные данные, коды подтверждения и секреты.
    rationale: Обеспечивает достаточность основания и снижает риск утечки.
    affected: CreateCertificateRevocationRequest
  - id: A-12
    statement: |
      Сотрудник партнёра аутентифицируется через корпоративный IdP партнёра
      по Authorization Code; токен содержит идентификатор сотрудника и
      партнёра. Действия сотрудника отделяются от действий системы партнёра.
    rationale: Позволяет проверить полномочия конкретного сотрудника и сохранить аудит.
    affected: partnerEmployeeOAuth, RevocationInitiator
x-changelog:
  - version: '1.0.0'
    date: '2026-10-29'
    changes:
      - Первая версия спецификации по задаче SCRUM-2142
      - Определены операции поиска сертификата, чтения карточки, создания операции отзыва и получения её состояния
      - Определены схемы авторизации клиента, системы партнёра и сотрудника партнёра
      - Описаны состояния ACCEPTED, SUBMITTED, REVOKED, REJECTED, FAILED и UNKNOWN, а также отдельный статус срока действия сертификата
      - Зафиксированы идемпотентность, бизнес-уникальность операции, правила повторной отправки и обработка неопределённого результата
      - Описаны ошибки валидации, отсутствия сертификата, недоступности УЦ, тайм-аута и повторного запроса
      - Открытые вопросы и допущения вынесены в x-open-questions и x-assumptions
