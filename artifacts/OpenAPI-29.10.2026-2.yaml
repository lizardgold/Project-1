                        revokedAt: null
                        activeRevocationId: null
                        lastRevocationId: null
                        statusCheckedAt: '2026-10-29T18:20:00Z'
                      - certificateId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                        clientId: client-8f3a2c
                        serialNumber: 09F8E7D6C5B4A39281
                        subject: CN=Иванов Иван Иванович, O=ООО «Клиент»
                        issuer: CN=УЦ ПодписьОнлайн, O=АО «УЦ»
                        fingerprintSha256: 8d7c6b5a4938271605f4e3d2c1b0a99887766554433221100ffeeddccbbaa998
