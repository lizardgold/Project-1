          description: |
            Идентификатор сертификата, полученный через `GET /certificates`.
            Сертификат должен принадлежать инициатору или его партнёру.
          example: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
        reason:
          $ref: '#/components/schemas/RevocationReason'
        reasonDetails:
          type: string
          minLength: 1
          maxLength: 1000
          nullable: true
          description: |
            Уточнение причины. Обязательно при `reason=OTHER`. Не должно
            содержать персональные данные и секреты.
          example: Телефон утерян 29.10.2026; доступ восстановлен на новом устройстве
        incidentAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 35
          nullable: true
          description: |
            Время инцидента, если известно. Не должно быть в будущем; сервис
