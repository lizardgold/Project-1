          $ref: '#/components/responses/ServiceUnavailable'
  /certificate-revocations:
    post:
      tags:
        - certificate-revocations
      operationId: createCertificateRevocation
      summary: Инициировать отзыв сертификата
      description: |
        Создаёт отдельную операцию отзыва сертификата и асинхронно передаёт
        запрос в УЦ.

        `202 Accepted` означает только приём запроса. Сертификат не считается
        отозванным до подтверждения УЦ. Для получения результата используйте
        `GET /certificate-revocations/{revocationId}`.

        Порядок проверок:

        1. токен, scope и полномочия инициатора;
        2. принадлежность сертификата инициатору или его партнёру;
        3. статус отзыва: `REVOKED`, активная операция, `UNKNOWN`;
        4. срок действия: `validityStatus` должен быть `VALID`;
        5. корректность причины и обязательность `reasonDetails` для `OTHER`.

        Для сертификата допускается одна незавершённая операция. Повторный
        `POST` с новым `Idempotency-Key` при активной операции возвращает
        `409 REVOCATION_ALREADY_IN_PROGRESS` и `Location` существующей
        операции. При `UNKNOWN` возвращается `409 REVOCATION_RESULT_UNKNOWN`:
        повторная отправка без сверки запрещена.

        Ошибки УЦ не возвращаются в этом ответе: операция уже создана, а её
        состояние отражает результат взаимодействия с УЦ.
      security:
        - partnerOAuth:
            - certificate-revocations:write
        - partnerEmployeeOAuth:
            - certificate-revocations:write
        - clientOAuth:
            - certificate-revocations:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificateRevocationRequest'
            examples:
              phoneLost:
                summary: Отзыв сертификата при потере телефона
                value:
                  certificateId: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
                  reason: PHONE_LOST
                  reasonDetails: Телефон утерян 29.10.2026; доступ восстановлен на новом устройстве
                  incidentAt: '2026-10-29T18:20:00Z'
                  comment: Обращение клиента в поддержку партнёра
              deviceCompromised:
                summary: Отзыв при компрометации устройства
                value:
                  certificateId: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
                  reason: DEVICE_COMPROMISED
                  reasonDetails: Обнаружено вредоносное ПО и несанкционированный доступ к устройству
                  incidentAt: '2026-10-29T17:55:00Z'
      responses:
        '202':
          description: |
            Запрос принят. Создана операция отзыва; сертификат ещё не отозван.
            Состояние операции — `ACCEPTED` или `SUBMITTED`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRevocation'
              examples:
                accepted:
                  summary: Операция принята и поставлена в очередь
                  value:
                    revocationId: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70
                    certificate:
                      certificateId: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
                      serialNumber: 01A2B3C4D5E6F7089A
                      subject: CN=Иванов Иван Иванович, O=ООО «Клиент»
                      issuer: CN=УЦ ПодписьОнлайн, O=АО «УЦ»
                      fingerprintSha256: 3c9e1f2a4b5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7
                      status: REVOCATION_PENDING
                      validityStatus: VALID
                      statusCheckedAt: '2026-10-29T18:25:00Z'
                    status: ACCEPTED
                    reason: PHONE_LOST
                    reasonDetails: Телефон утерян 29.10.2026; доступ восстановлен на новом устройстве
                    incidentAt: '2026-10-29T18:20:00Z'
                    initiator:
