              description: Ответ содержит сведения о состоянии сертификата и не кэшируется
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
              examples:
                active:
                  summary: Действующий сертификат без операций отзыва
                  value:
                    certificateId: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
                    clientId: client-8f3a2c
                    serialNumber: 01A2B3C4D5E6F7089A
                    subject: CN=Иванов Иван Иванович, O=ООО «Клиент»
                    issuer: CN=УЦ ПодписьОнлайн, O=АО «УЦ»
                    fingerprintSha256: 3c9e1f2a4b5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7
                    status: ACTIVE
                    validityStatus: VALID
                    validFrom: '2026-01-15T00:00:00Z'
                    validTo: '2027-01-15T00:00:00Z'
                    issuedAt: '2026-01-15T10:30:00Z'
                    revokedAt: null
                    activeRevocationId: null
                    lastRevocationId: null
                    statusCheckedAt: '2026-10-29T18:20:00Z'
                revocationPending:
                  summary: Сертификат с незавершённой операцией отзыва
                  value:
                    certificateId: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
                    clientId: client-8f3a2c
                    serialNumber: 01A2B3C4D5E6F7089A
                    subject: CN=Иванов Иван Иванович, O=ООО «Клиент»
                    issuer: CN=УЦ ПодписьОнлайн, O=АО «УЦ»
                    fingerprintSha256: 3c9e1f2a4b5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7
                    status: REVOCATION_PENDING
                    validityStatus: VALID
                    validFrom: '2026-01-15T00:00:00Z'
                    validTo: '2027-01-15T00:00:00Z'
