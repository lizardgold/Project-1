openapi: 3.0.3
info:
  title: ПодписьОнлайн — API отзыва сертификата при потере телефона
  version: '1.0.0'
  description: |
    API сервиса «ПодписьОнлайн» для отзыва сертификата ключа проверки
    электронной подписи при потере или компрометации телефона клиента.

    Источник требований — Jira SCRUM-2142 (эпик SCRUM-2139).

    ## Назначение и границы

    API решает три задачи:

    1. идентифицировать сертификат, который требуется отозвать;
    2. инициировать отдельную операцию отзыва сертификата;
    3. получить текущее состояние и подтверждённый результат операции.

    В границы API не входят:

    - выпуск сертификата и проверка личности при выпуске;
    - подписание документов и проверка подписи;
    - аутентификация клиента в приложении партнёра;
    - восстановление доступа и выпуск нового сертификата;
    - административные операции удостоверяющего центра (УЦ).

    Операции чтения сертификата включены только для идентификации цели
    отзыва. Управление сертификатами, их выпуск, продление и проверка
    подписи в границы этой спецификации не входят.

    ## Участники

    | Участник | Роль в сценарии |
    |---|---|
    | Клиент | Инициирует отзыв своего сертификата после повторной идентификации, если потерянное устройство недоступно |
    | Сотрудник партнёра | Инициирует отзыв в пределах предоставленных полномочий |
    | Система партнёра | Вызывает API по машинной идентичности в рамках разрешённого сценария |
    | «ПодписьОнлайн» | Проверяет полномочия, создаёт операцию, ведёт состояние и взаимодействует с УЦ |
    | Удостоверяющий центр | Выполняет отзыв сертификата и подтверждает его результат |

    ## Основной сценарий

    1. Инициатор аутентифицируется. При потере телефона клиент проходит
       повторную идентификацию в приложении партнёра или через иной
       согласованный канал; обычная аутентификация на потерянном устройстве
       невозможна.
    2. Инициатор находит сертификат (`GET /certificates`) и проверяет его
       состояние (`GET /certificates/{certificateId}`).
    3. Инициатор создаёт операцию отзыва (`POST /certificate-revocations`)
       с обязательным `Idempotency-Key`.
    4. Сервис проверяет полномочия и состояние сертификата, создаёт операцию
       и возвращает `202 Accepted`. Принятие запроса не означает, что
       сертификат уже отозван.
    5. Сервис асинхронно передаёт запрос в УЦ. Операция переходит в
       `SUBMITTED`.
    6. УЦ подтверждает отзыв — операция и сертификат переходят в `REVOKED`.
       При отказе УЦ операция переходит в `REJECTED`, при неопределённом
       результате — в `UNKNOWN`.
    7. Инициатор опрашивает состояние операции
       (`GET /certificate-revocations/{revocationId}`) с учётом
       `Retry-After` и получает подтверждённый результат.

    Если сертификат уже отозван или по нему уже есть незавершённая операция,
    `POST` возвращает `409` с машиночитаемым кодом. Для активной операции
    в заголовке `Location` возвращается ссылка на неё.

    ## Ключевые принципы

    - `202 Accepted` подтверждает только приём запроса. Факт отзыва
      подтверждается исключительно результатом УЦ.
    - Одна операция относится к одному сертификату. Массовый отзыв
      нескольких сертификатов одной операцией не поддерживается.
    - Для сертификата допускается не более одной незавершённой операции
      отзыва.
    - Результат `UNKNOWN` не является ни успехом, ни окончательной ошибкой.
      Повторный запрос на отзыв блокируется до завершения сверки с УЦ.
    - Состояние сертификата `REVOKED` устанавливается только после
      подтверждения УЦ. Локальное принятие запроса не меняет сертификат на
      отозванный.
    - Идентификатор сертификата или операции не предоставляет прав на
      операцию. Полномочия проверяются по токену и принадлежности объекта.

    ## Состояния операции отзыва

    | Состояние | Значение | Терминальное |
    |---|---|---|
    | `ACCEPTED` | Запрос принят, проверки пройдены, операция в очереди; в УЦ ещё не передана | Нет |
    | `SUBMITTED` | Запрос передан в УЦ, подтверждение не получено | Нет |
    | `REVOKED` | УЦ подтвердил отзыв сертификата | Да, успех |
    | `REJECTED` | Отзыв отклонён по бизнес-причине; внешний эффект отсутствует | Да, ошибка |
    | `FAILED` | Операция не выполнена из-за технической ошибки; внешний эффект подтверждённо отсутствует | Да, ошибка |
    | `UNKNOWN` | Результат не установлен; запрос мог быть получен УЦ | Нет |

    Допустимые переходы описаны в `x-state-machine`. Переходы из терминальных
    состояний не выполняются: для новой попытки создаётся новая операция с
    новым `revocationId`.

    ## Состояние сертификата

    | Статус | Значение |
    |---|---|
    | `ACTIVE` | Сертификат не отозван; срок действия проверяется отдельно |
    | `REVOCATION_PENDING` | Есть незавершённая операция отзыва; сертификат ещё не отозван |
    | `REVOKED` | УЦ подтвердил отзыв |
    | `UNKNOWN` | Актуальное состояние не подтверждено УЦ |

    Срок действия сертификата отражается отдельно полем `validityStatus`
    (`VALID`, `NOT_YET_VALID`, `EXPIRED`) и не смешивается со статусом отзыва.
    Это позволяет отличить истёкший сертификат от отозванного.

    ## Авторизация

    - Система партнёра использует `partnerOAuth` (OAuth 2.0 Client
      Credentials). Партнёр определяется по `client_id` токена; передача
      `partnerId` в запросе не предусмотрена.
    - Сотрудник партнёра использует `partnerEmployeeOAuth` (Authorization
      Code через корпоративный IdP партнёра). Токен содержит идентификатор
      сотрудника, партнёра и разрешение на отзыв.
    - Клиент использует `clientOAuth` (Authorization Code с PKCE). `sub`
      токена должен совпадать с `clientId` сертификата.
    - Для отзыва клиентом токен должен быть выпущен после повторной
      идентификации. Максимальный возраст аутентификации и требования к
      `acr`/`amr` определяются отдельно (OQ-01).
    - Партнёрский токен действует только в пределах клиентов своего
      партнёра. Чужой сертификат неотличим от отсутствующего: возвращается
      `404`, а не `403`.
    - Недостаточный scope или отсутствие роли дают `403 ACCESS_DENIED`.

    ## Идентификация сертификата

    - Основной идентификатор — `certificateId` (UUID), полученный через
      `GET /certificates`.
    - Дополнительно сертификат описывается серийным номером, издателем,
      субъектом и отпечатком SHA-256. Отпечаток позволяет однозначно
      сопоставить сертификат с данными УЦ.
    - Клиент видит только свои сертификаты. Партнёр — только сертификаты
      клиентов своего партнёра. Фильтр `clientId` для партнёрского токена
      обязателен.
    - Перед созданием операции сервис повторно проверяет принадлежность
      сертификата инициатору, его состояние и срок действия.

    ## Идемпотентность и повторная отправка

    - `POST /certificate-revocations` требует `Idempotency-Key`.
    - Ключ и отпечаток запроса хранятся 24 часа. Повтор с тем же ключом и
      тем же телом возвращает сохранённый ответ с
      `Idempotent-Replayed: true`.
    - Повтор с тем же ключом и другим телом — `409 IDEMPOTENCY_KEY_REUSED`.
    - Параллельный запрос с тем же ключом — `409 IDEMPOTENCY_KEY_IN_PROGRESS`
      (допустим повтор после задержки).
    - Независимо от ключа действует бизнес-уникальность: одна незавершённая
      операция на сертификат. Повторный `POST` с новым ключом при активной
      операции возвращает `409 REVOCATION_ALREADY_IN_PROGRESS` и `Location`
      существующей операции.
    - При результате `UNKNOWN` повторный `POST` возвращает
      `409 REVOCATION_RESULT_UNKNOWN`: сначала выполняется сверка с УЦ.
    - После терминального `FAILED` или `REJECTED` новая операция допускается
      только после проверки актуального состояния сертификата.

    ## Ошибки и повторные попытки

    Все ошибки API возвращаются в модели `Problem`: машиночитаемый `code`,
    `traceId`, время, признак `retryable` и, для ошибок валидации, список
    `issues`.

    Бизнес-ошибки (сертификат уже отозван, недопустимое состояние, отказ УЦ)
    отличаются от технических (недоступность УЦ, тайм-аут, ошибка шлюза).
    Автоматический повтор HTTP-запроса допускается только при
    `retryable: true` и с учётом `Retry-After`.

    Ошибки взаимодействия с УЦ не возвращаются в ответе на `POST`: операция
    уже создана, а её результат отражается в состоянии. При тайм-ауте или
    недоступности УЦ операция переходит в `UNKNOWN`, а не в `FAILED`.

    ## Ограничения

    - Один сертификат на одну операцию отзыва.
    - Не более одной незавершённой операции на сертификат.
    - `reasonDetails` — до 1000 символов, `comment` — до 500 символов.
    - Страница списка сертификатов — до 100 элементов.
    - Сроки хранения операций и аудита, тайм-ауты и контракт УЦ требуют
      согласования (OQ-02, OQ-06).

    ## Соглашения

    - JSON в кодировке UTF-8; время — RFC 3339 в UTC.
    - Идентификаторы ресурсов — UUID, кроме внешних идентификаторов
      партнёра и УЦ.
    - Ошибки — RFC 7807-совместимая модель `Problem`.
    - Расширения `x-*` фиксируют правила, которые не выражаются средствами
      OpenAPI 3.0.
servers:
  - url: https://api.podpis-online.example/v1
    description: Продуктивный контур
  - url: https://staging-api.podpis-online.example/v1
    description: Тестовый контур
tags:
  - name: certificates
    description: Поиск и чтение сертификатов для идентификации цели отзыва
  - name: certificate-revocations
    description: Инициирование отзыва сертификата и получение результата
paths:
  /certificates:
    get:
      tags:
        - certificates
      operationId: listCertificates
      summary: Найти сертификаты клиента
      description: |
        Возвращает сертификаты, доступные инициатору, с фильтрацией по
        клиенту, статусу отзыва, сроку действия и серийному номеру.

        Клиентский токен возвращает только сертификаты субъекта токена.
        Партнёрский токен требует явного `clientId` и возвращает только
        сертификаты клиентов этого партнёра.

        Операция используется для идентификации цели отзыва, когда
        `certificateId` неизвестен, например при потере телефона. Пустой
        результат возвращается как `200` с пустым `items`, а не как `404`.

        Сортировка — по убыванию `validFrom`. Пагинация курсорная.
      security:
        - partnerOAuth:
            - certificates:read
        - partnerEmployeeOAuth:
            - certificates:read
        - clientOAuth:
            - certificates:read
      parameters:
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/CertificateStatusFilter'
        - $ref: '#/components/parameters/CertificateValidityStatusFilter'
        - $ref: '#/components/parameters/SerialNumberFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Страница сертификатов, доступных инициатору
          headers:
            Cache-Control:
              description: Ответ содержит сведения о состоянии сертификата и не кэшируется
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificatePage'
              examples:
                activeAndRevoked:
                  summary: Действующий и отозванный сертификаты клиента
                  value:
                    items:
                      - certificateId: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
                        clientId: client-8f3a2c
                        serialNumber: 01A2B3C4D5E6F7089A
                        subject: CN=Иванов Иван Иванович, O=ООО «Клиент»
                        issuer: CN=УЦ ПодписьОнлайн, O=АО «УЦ»
                        fingerprintSha256: 3c9e1f2a4b5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7
