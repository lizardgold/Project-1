  /certificate-revocations/{revocationId}:
    parameters:
      - $ref: '#/components/parameters/RevocationId'
    get:
      tags:
        - certificate-revocations
      operationId: getCertificateRevocation
      summary: Получить состояние и результат отзыва
      description: |
        Возвращает текущее состояние операции, подтверждённый результат,
        состояние сертификата и сведения о последней попытке взаимодействия
        с УЦ.

        Пока операция не завершена, в ответе может присутствовать
        `Retry-After`; инициатору рекомендуется опрашивать ресурс с учётом
        этого заголовка. Для терминальных состояний `REVOKED`, `REJECTED` и
        `FAILED` дальнейший опрос не требуется.

        `UNKNOWN` означает, что результат ещё не установлен. Это не успех и
        не окончательная ошибка; сервис продолжает сверку с УЦ.

        Операция другого инициатора неотличима от отсутствующей: возвращается
        `404 REVOCATION_NOT_FOUND`.
      security:
        - partnerOAuth:
            - certificate-revocations:read
        - partnerEmployeeOAuth:
            - certificate-revocations:read
        - clientOAuth:
            - certificate-revocations:read
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Текущее состояние операции отзыва
          headers:
            Cache-Control:
              description: Состояние операции не кэшируется
              schema:
                type: string
                example: no-store
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
