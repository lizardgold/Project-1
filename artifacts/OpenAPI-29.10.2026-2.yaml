components:
  securitySchemes:
    partnerOAuth:
      type: oauth2
      description: |
        Машинная авторизация системы партнёра по OAuth 2.0 Client
        Credentials. Партнёр определяется по `client_id` токена; передача
        `partnerId` в запросах не предусмотрена. Используется для
        серверных интеграций, а не для действий сотрудника.
      flows:
        clientCredentials:
          tokenUrl: https://auth.podpis-online.example/oauth2/token
          scopes:
            'certificates:read': Чтение сертификатов клиентов партнёра
            'certificate-revocations:read': Чтение операций отзыва
            'certificate-revocations:write': Инициирование отзыва
    partnerEmployeeOAuth:
      type: oauth2
      description: |
        Авторизация сотрудника партнёра через корпоративный IdP партнёра по
        Authorization Code. Токен содержит идентификатор сотрудника,
        партнёра, роль и разрешение на отзыв сертификатов. Для чувствительных
        операций требуется MFA. Конкретные claims и правила федерации
        требуют согласования (OQ-11).
      flows:
        authorizationCode:
          authorizationUrl: https://auth.podpis-online.example/oauth2/authorize
          tokenUrl: https://auth.podpis-online.example/oauth2/token
          scopes:
            'certificates:read': Чтение сертификатов клиентов партнёра
            'certificate-revocations:read': Чтение операций отзыва
            'certificate-revocations:write': Инициирование отзыва
    clientOAuth:
      type: oauth2
      description: |
        Токен клиента выпускается приложением партнёра по Authorization Code
        с PKCE после аутентификации клиента. `sub` токена должен совпадать с
        `clientId` сертификата.

        При потере телефона токен должен быть получен в сценарии повторной
        идентификации, а не путём восстановления сессии на потерянном
        устройстве. Максимальный возраст аутентификации и требования к
        `acr`/`amr` определяются отдельно (OQ-01).
      flows:
        authorizationCode:
          authorizationUrl: https://auth.podpis-online.example/oauth2/authorize
          tokenUrl: https://auth.podpis-online.example/oauth2/token
          scopes:
            'certificates:read': Просмотр собственных сертификатов
            'certificate-revocations:read': Просмотр собственных операций отзыва
            'certificate-revocations:write': Инициирование отзыва собственного сертификата
  parameters:
    CertificateId:
      name: certificateId
      in: path
      required: true
      description: Идентификатор сертификата, присвоенный сервисом
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        example: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
    RevocationId:
      name: revocationId
      in: path
      required: true
      description: Идентификатор операции отзыва сертификата
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        example: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Ключ идемпотентности изменяющей операции. Уникален в пределах
        инициатора. Повтор с тем же ключом и телом возвращает сохранённый
        ответ, повтор с другим телом — `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
        example: 3f6b1c2d-8e9a-4b7c-9d1e-2f3a4b5c6d7e
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Идентификатор запроса для сквозной трассировки. Если не передан,
        сервис формирует значение самостоятельно и возвращает его в `traceId`
        ответа об ошибке.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: req-20261029-001201
    ClientIdFilter:
      name: clientId
      in: query
      required: false
      description: |
        Идентификатор клиента. Для партнёрского токена обязателен. Для
        клиентского токена может не передаваться; если передан, должен
        совпадать с `sub` токена, иначе возвращается `403 ACCESS_DENIED`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
        example: client-8f3a2c
    CertificateStatusFilter:
      name: status
      in: query
      required: false
      description: Фильтр по статусу отзыва сертификата
      schema:
        $ref: '#/components/schemas/CertificateStatus'
    CertificateValidityStatusFilter:
      name: validityStatus
      in: query
      required: false
      description: Фильтр по сроку действия сертификата
      schema:
        $ref: '#/components/schemas/CertificateValidityStatus'
    SerialNumberFilter:
      name: serialNumber
      in: query
      required: false
      description: |
        Серийный номер сертификата для точного поиска. Сравнение
        регистронезависимое.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        example: 01A2B3C4D5E6F7089A
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Курсор следующей страницы, полученный в предыдущем ответе.
        Непрозрачная строка; при некорректном значении возвращается
        `400 INVALID_CURSOR`.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        example: eyJ2YWxpZEZyb20iOiIyMDI2LTAxLTE1VDAwOjAwOjAwWiJ9
    Limit:
      name: limit
      in: query
      required: false
      description: Максимальное число элементов страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
  headers:
    Location:
      description: |
        Ссылка на созданную или существующую операцию отзыва. При создании
        указывает на `/certificate-revocations/{revocationId}`; при конфликте
        активной операции — на уже существующую операцию.
      schema:
        type: string
        format: uri-reference
        minLength: 1
        maxLength: 2048
        example: /v1/certificate-revocations/d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70
    IdempotentReplayed:
      description: |
        `true`, если ответ повторно возвращён по ранее обработанному
        `Idempotency-Key`; тело ответа сохранено без изменений.
      schema:
        type: boolean
        example: true
    RetryAfter:
      description: |
        Рекомендуемая задержка перед следующим опросом состояния операции
        или повтором запроса, в секундах.
      schema:
        type: integer
        minimum: 1
        maximum: 86400
        example: 2
  responses:
    BadRequest:
      description: |
        Некорректный запрос: нарушен синтаксис, отсутствует обязательный
        заголовок, не пройдена валидация полей или бизнес-проверка входных
        данных. Повтор без изменения запроса не поможет.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Ошибка валидации полей
              value:
                type: https://api.podpis-online.example/problems/validation-error
                title: Ошибка валидации запроса
                status: 400
                code: VALIDATION_ERROR
                detail: Поле reasonDetails обязательно при reason=OTHER
                traceId: req-20261029-001201
                timestamp: '2026-10-29T18:25:00Z'
                retryable: false
                issues:
                  - field: reasonDetails
                    code: REQUIRED
                    message: Укажите описание причины отзыва
            missingIdempotencyKey:
              summary: Отсутствует ключ идемпотентности
              value:
                type: https://api.podpis-online.example/problems/idempotency-key-required
                title: Требуется ключ идемпотентности
                status: 400
                code: IDEMPOTENCY_KEY_REQUIRED
                detail: Заголовок Idempotency-Key обязателен для этой операции
                traceId: req-20261029-001202
                timestamp: '2026-10-29T18:25:05Z'
                retryable: false
    Unauthorized:
      description: |
        Токен отсутствует, истёк или не прошёл проверку подписи. Требуется
        получить новый токен; повтор с тем же токеном не поможет.
      headers:
        WWW-Authenticate:
          description: Схема и параметры авторизации
          schema:
            type: string
            example: Bearer realm="podpis-online", error="invalid_token"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/unauthorized
            title: Не пройдена аутентификация
            status: 401
            code: UNAUTHENTICATED
            detail: Срок действия токена истёк
            traceId: req-20261029-001203
            timestamp: '2026-10-29T18:25:10Z'
            retryable: false
    Forbidden:
      description: |
        Аутентификация пройдена, но у инициатора нет прав на операцию:
        недостаточный scope, отсутствует роль, клиент пытается действовать
        от имени другого клиента или партнёр не имеет отношения к клиенту.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingScope:
              summary: Недостаточный scope
              value:
                type: https://api.podpis-online.example/problems/access-denied
                title: Операция запрещена
                status: 403
                code: ACCESS_DENIED
