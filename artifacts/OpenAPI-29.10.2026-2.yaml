  schemas:
    CertificateStatus:
      type: string
      description: |
        Статус отзыва сертификата. Не заменяет срок действия: для проверки
        срока используйте `validityStatus` и даты `validFrom`/`validTo`.
      enum:
        - ACTIVE
        - REVOCATION_PENDING
        - REVOKED
        - UNKNOWN
      example: ACTIVE
    CertificateValidityStatus:
      type: string
      description: |
        Состояние срока действия сертификата на момент проверки.
      enum:
        - VALID
        - NOT_YET_VALID
        - EXPIRED
      example: VALID
    RevocationStatus:
      type: string
      description: |
        Состояние операции отзыва. `REVOKED`, `REJECTED` и `FAILED` —
        терминальные; `UNKNOWN` — промежуточное состояние неопределённого
        результата.
      enum:
        - ACCEPTED
        - SUBMITTED
        - REVOKED
        - REJECTED
        - FAILED
        - UNKNOWN
      example: REVOKED
    RevocationReason:
      type: string
      description: |
        Бизнес-причина отзыва. Отображение на коды причин УЦ приведено в
        `x-uc-integration.reasonMapping` и требует подтверждения (OQ-09).
      enum:
        - PHONE_LOST
        - PHONE_STOLEN
        - DEVICE_COMPROMISED
        - CERTIFICATE_COMPROMISED
        - OTHER
      example: PHONE_LOST
    RevocationInitiatorType:
      type: string
      description: |
        Тип инициатора. Определяется сервисом по токену; в теле запроса не
        передаётся.
      enum:
        - CLIENT
        - PARTNER_EMPLOYEE
        - PARTNER_SYSTEM
      example: CLIENT
    CertificateSummary:
      type: object
      description: |
        Краткие сведения о сертификате в составе операции отзыва.
      required:
        - certificateId
        - serialNumber
        - subject
        - issuer
        - fingerprintSha256
        - status
        - validityStatus
        - statusCheckedAt
      properties:
        certificateId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          description: Идентификатор сертификата, присвоенный сервисом
          example: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
        serialNumber:
          type: string
          minLength: 1
          maxLength: 128
          description: Серийный номер сертификата
          example: 01A2B3C4D5E6F7089A
        subject:
          type: string
          minLength: 1
          maxLength: 512
          description: Владелец сертификата в формате RFC 4514
          example: CN=Иванов Иван Иванович, O=ООО «Клиент»
        issuer:
          type: string
          minLength: 1
          maxLength: 512
          description: Издатель сертификата в формате RFC 4514
          example: CN=УЦ ПодписьОнлайн, O=АО «УЦ»
        fingerprintSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          minLength: 64
          maxLength: 64
          description: Отпечаток сертификата SHA-256 в нижнем шестнадцатеричном регистре
          example: 3c9e1f2a4b5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7
        status:
          $ref: '#/components/schemas/CertificateStatus'
        validityStatus:
          $ref: '#/components/schemas/CertificateValidityStatus'
        statusCheckedAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 35
          description: Время последней подтверждённой проверки состояния сертификата
          example: '2026-10-29T18:25:00Z'
    Certificate:
      type: object
      description: |
        Сертификат ключа проверки электронной подписи и его состояние.
        Не содержит закрытого ключа и полных персональных данных.
      required:
        - certificateId
        - clientId
        - serialNumber
        - subject
        - issuer
        - fingerprintSha256
        - status
        - validityStatus
        - validFrom
        - validTo
        - statusCheckedAt
      properties:
        certificateId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          description: Идентификатор сертификата, присвоенный сервисом
          example: 7b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
        clientId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
          description: Идентификатор клиента — владельца сертификата
          example: client-8f3a2c
        serialNumber:
          type: string
          minLength: 1
          maxLength: 128
          description: Серийный номер сертификата
          example: 01A2B3C4D5E6F7089A
        subject:
          type: string
          minLength: 1
          maxLength: 512
          description: Владелец сертификата в формате RFC 4514
          example: CN=Иванов Иван Иванович, O=ООО «Клиент»
        issuer:
          type: string
          minLength: 1
          maxLength: 512
          description: Издатель сертификата в формате RFC 4514
          example: CN=УЦ ПодписьОнлайн, O=АО «УЦ»
        fingerprintSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          minLength: 64
          maxLength: 64
          description: Отпечаток сертификата SHA-256 в нижнем шестнадцатеричном регистре
          example: 3c9e1f2a4b5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7
        status:
          $ref: '#/components/schemas/CertificateStatus'
        validityStatus:
          $ref: '#/components/schemas/CertificateValidityStatus'
        validFrom:
          type: string
          format: date-time
          minLength: 20
          maxLength: 35
          description: Начало срока действия сертификата
          example: '2026-01-15T00:00:00Z'
        validTo:
          type: string
          format: date-time
          minLength: 20
          maxLength: 35
          description: Окончание срока действия сертификата
          example: '2027-01-15T00:00:00Z'
        issuedAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 35
          nullable: true
          description: Время выпуска сертификата; может отсутствовать в источнике данных
          example: '2026-01-15T10:30:00Z'
        revokedAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 35
          nullable: true
          description: Время подтверждённого отзыва; null, если сертификат не отозван
          example: null
        revocationReason:
          allOf:
            - $ref: '#/components/schemas/RevocationReason'
          description: Причина отзыва; отсутствует, если сертификат не отозван
        activeRevocationId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          nullable: true
          description: |
            Идентификатор незавершённой операции отзыва; null, если активной
            операции нет.
          example: null
        lastRevocationId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          nullable: true
          description: |
            Идентификатор последней операции отзыва, если она известна и
            сохраняется сервисом.
          example: null
        statusCheckedAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 35
          description: Время последней подтверждённой проверки состояния сертификата
          example: '2026-10-29T18:20:00Z'
    CertificatePage:
      type: object
      description: Страница списка сертификатов
      required:
        - items
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          description: Сертификаты текущей страницы
          items:
            $ref: '#/components/schemas/Certificate'
        nextCursor:
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
          description: Курсор следующей страницы; null, если страниц больше нет
          example: eyJ2YWxpZEZyb20iOiIyMDI2LTAxLTE1VDAwOjAwOjAwWiJ9
    RevocationInitiator:
      type: object
      description: |
        Инициатор операции отзыва. Значения определяются сервисом по токену;
        инициатор не передаётся в теле запроса.
      required:
        - type
        - id
      properties:
        type:
          $ref: '#/components/schemas/RevocationInitiatorType'
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
          description: |
            Псевдонимный идентификатор инициатора: `sub` клиентского токена,
            идентификатор сотрудника или `client_id` системы партнёра.
          example: client-8f3a2c
        displayName:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: |
            Отображаемое имя инициатора в маскированном виде; может
            отсутствовать для клиента и системного инициатора.
          example: null
    RevocationError:
      type: object
      description: |
        Ошибка выполнения операции отзыва. Не является HTTP-ошибкой: операция
        уже создана, а ошибка отражает результат её выполнения или сверки.
      required:
        - code
        - message
        - retryable
        - occurredAt
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Машиночитаемый код ошибки операции:

            - `CERTIFICATE_NOT_ACTIVE` — сертификат не допускает отзыв по сроку действия;
            - `CERTIFICATE_ALREADY_REVOKED` — сертификат уже отозван;
            - `CERTIFICATE_STATUS_UNKNOWN` — состояние сертификата не подтверждено;
            - `UC_CERTIFICATE_NOT_FOUND` — сертификат не найден в УЦ;
            - `UC_REVOCATION_REFUSED` — УЦ отказал в отзыве;
            - `UC_UNAVAILABLE` — УЦ недоступен;
            - `UC_TIMEOUT` — УЦ не ответил за отведённое время;
            - `UC_INVALID_RESPONSE` — УЦ вернул некорректный или неоднозначный ответ;
            - `INTERNAL_ERROR` — внутренняя ошибка сервиса;
            - `RECONCILIATION_FAILED` — не удалось установить результат сверкой.
          enum:
            - CERTIFICATE_NOT_ACTIVE
            - CERTIFICATE_ALREADY_REVOKED
            - CERTIFICATE_STATUS_UNKNOWN
            - UC_CERTIFICATE_NOT_FOUND
            - UC_REVOCATION_REFUSED
            - UC_UNAVAILABLE
            - UC_TIMEOUT
            - UC_INVALID_RESPONSE
            - INTERNAL_ERROR
            - RECONCILIATION_FAILED
          example: UC_TIMEOUT
        message:
          type: string
          minLength: 1
          maxLength: 1000
          description: Описание ошибки для журнала и поддержки
          example: УЦ не ответил за отведённое время; результат запроса неизвестен
        retryable:
          type: boolean
          description: |
            Допустим ли повтор операции после устранения причины. Для
            состояния `UNKNOWN` значение всегда `false` до завершения сверки.
          example: false
        occurredAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 35
          description: Время возникновения ошибки
          example: '2026-10-29T18:29:00Z'
    CertificateRevocation:
      type: object
      description: |
        Операция отзыва сертификата. Содержит состояние операции, состояние
        сертификата и сведения о взаимодействии с УЦ.
      required:
        - revocationId
        - certificate
        - status
        - reason
        - initiator
        - createdAt
        - updatedAt
        - attemptCount
      properties:
        revocationId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          description: Идентификатор операции отзыва
