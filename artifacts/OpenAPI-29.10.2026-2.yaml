        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /certificates/{certificateId}:
    parameters:
      - $ref: '#/components/parameters/CertificateId'
    get:
      tags:
        - certificates
      operationId: getCertificate
      summary: Получить сертификат и его состояние
      description: |
        Возвращает карточку сертификата: идентификаторы, субъект, издателя,
        отпечаток, статус отзыва, срок действия и сведения о текущей или
        последней операции отзыва.

        Статус отзыва отражает последнее подтверждённое состояние. Время
        последней проверки — `statusCheckedAt`. Если состояние не подтверждено
        УЦ, возвращается `status: UNKNOWN`.

        Сертификат другого клиента или партнёра неотличим от отсутствующего:
        возвращается `404 CERTIFICATE_NOT_FOUND`.
      security:
        - partnerOAuth:
            - certificates:read
        - partnerEmployeeOAuth:
            - certificates:read
        - clientOAuth:
            - certificates:read
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Карточка сертификата
          headers:
