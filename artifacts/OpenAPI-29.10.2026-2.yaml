          example: Обращение клиента в поддержку партнёра
    ValidationIssue:
      type: object
      description: Замечание валидации по конкретному полю
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 256
          description: Путь к полю запроса
          example: reasonDetails
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Машиночитаемый код замечания
          example: REQUIRED
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: Описание замечания
          example: Укажите описание причины отзыва
    Problem:
      type: object
      description: |
        Единая модель ошибки API. `retryable` показывает, допустим ли повтор
        того же запроса без изменения данных.
      required:
        - type
        - title
        - status
        - code
        - traceId
        - timestamp
        - retryable
      properties:
        type:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: URI типа проблемы
          example: https://api.podpis-online.example/problems/validation-error
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Краткое описание проблемы
          example: Ошибка валидации запроса
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP-код ответа
          example: 400
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Машиночитаемый код ошибки. Полный перечень и правила обработки —
            в `x-error-catalog`.
          enum:
            - MALFORMED_REQUEST
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - ACCESS_DENIED
            - IDEMPOTENCY_KEY_REQUIRED
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_KEY_IN_PROGRESS
            - INVALID_CURSOR
            - UNSUPPORTED_MEDIA_TYPE
            - CERTIFICATE_NOT_FOUND
            - REVOCATION_NOT_FOUND
            - CERTIFICATE_ALREADY_REVOKED
            - REVOCATION_ALREADY_IN_PROGRESS
            - REVOCATION_RESULT_UNKNOWN
            - CERTIFICATE_NOT_ACTIVE
            - CERTIFICATE_STATUS_UNKNOWN
            - RATE_LIMIT_EXCEEDED
            - INTERNAL_ERROR
            - BAD_GATEWAY
            - SERVICE_UNAVAILABLE
            - GATEWAY_TIMEOUT
          example: VALIDATION_ERROR
        detail:
          type: string
          minLength: 1
          maxLength: 2000
          description: Уточняющее описание причины ошибки
          example: Поле reasonDetails обязательно при reason=OTHER
        traceId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор запроса для обращения в поддержку
          example: req-20261029-001201
        timestamp:
          type: string
          format: date-time
          minLength: 20
          maxLength: 35
          description: Время формирования ответа об ошибке
          example: '2026-10-29T18:25:00Z'
        retryable:
          type: boolean
          description: Допустим ли автоматический повтор того же запроса
          example: false
        issues:
          type: array
          maxItems: 50
          description: Замечания валидации по полям запроса
          items:
            $ref: '#/components/schemas/ValidationIssue'
