  /signing-packages/{packageId}/documents/{documentId}/signatures:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Traceparent'
    post:
      tags:
        - Подписание
      summary: Подтвердить и подписать документ
      description: |
        Выполняет подписание документа по явному подтверждению клиента (AC-02, AC-03).

        Требования к запросу:
        * `confirmed: true` — обязательное явное подтверждение намерения подписать
          документ. Значение `false` или отсутствие поля завершается
          `422 CONFIRMATION_REQUIRED`; криптографическая операция не выполняется.
        * `contentSha256` — хеш содержимого, которое клиент просмотрел. Если хеш
          не совпадает с текущей версией документа, возвращается
          `409 DOCUMENT_CONTENT_MISMATCH` (AC-02, BR-DOC-03).

        Предусловия: пакет в статусе `PENDING_SIGNATURE`, `IN_PROGRESS` или
        `PARTIALLY_SIGNED` и срок подписания не истёк; документ в статусе
        `PENDING_SIGNATURE` или `SIGNING_FAILED` (повторная попытка).

        Сервис проверяет, что сертификат принадлежит клиенту (`403
        CERTIFICATE_OWNER_MISMATCH`), действует (`409 CERTIFICATE_NOT_ACTIVE`,
        `409 CERTIFICATE_EXPIRED`) и доступен механизму подписания
        (`503 SIGNING_PROVIDER_UNAVAILABLE`), затем фиксирует подтверждение
        и запускает криптографическую операцию. Документ переходит в `SIGNING`,
        пакет — в `IN_PROGRESS`.

        Ответ `202` возвращает операцию в статусе `IN_PROGRESS`; результат
        доступен через `GET /signatures/{signatureId}`. При успехе документ
        переходит в `SIGNED`, фиксируется время подписания; пакет переходит
        в `PARTIALLY_SIGNED` или `SIGNED` (AC-04, AC-05). При ошибке документ
        переходит в `SIGNING_FAILED`, повторная попытка допускается.

        Повтор с тем же `Idempotency-Key` и тем же телом возвращает ранее созданную
        операцию с заголовком `Idempotent-Replayed: true`. Повторное подтверждение
        уже подписанного документа завершается `409 SIGNATURE_ALREADY_EXISTS`
        и не создаёт вторую подпись.
      operationId: createDocumentSignature
      security:
        - partnerClientOAuth:
            - signing-documents:perform
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignatureRequest'
            example:
              confirmed: true
              confirmationMethod: SMS_OTP
              contentSha256: f869f13f6a55ecabda9257bfacce3c93ea9e1690f0e3e826625091cea86c9b7f
              comment: Подтверждаю условия кредитного договора
      responses:
        '202':
          description: Подтверждение принято, криптографическая операция выполняется
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signature'
              example:
                signatureId: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
                packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                status: IN_PROGRESS
                documentContentSha256: f869f13f6a55ecabda9257bfacce3c93ea9e1690f0e3e826625091cea86c9b7f
                confirmationMethod: SMS_OTP
                createdAt: '2026-10-31T10:12:38Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Конфликт состояния: недопустимый переход, расхождение содержимого,
            недоступный сертификат или уже существующая подпись.
          headers:
