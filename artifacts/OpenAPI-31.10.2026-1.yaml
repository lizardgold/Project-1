            status: 503
            detail: Криптографический компонент недоступен; результат операции не подтверждён.
            instance: /v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01/documents/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d/signatures
            code: SIGNING_PROVIDER_UNAVAILABLE
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
