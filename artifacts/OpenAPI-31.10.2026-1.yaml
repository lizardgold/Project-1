openapi: 3.1.0

info:
  title: ПодписьОнлайн — API подписания пакета документов
  summary: Приём пакета от партнёра, просмотр клиентом и подтверждённое подписание документов УКЭП
  version: '2.0.0'
  description: |
    API сервиса «ПодписьОнлайн» для передачи пакета документов от системы партнёра,
    просмотра пакета клиентом, подтверждённого подписания документов усиленной
    квалифицированной электронной подписью (УКЭП) и получения результата обработки.

    Источник требований — Jira [SCRUM-2140](https://javacode.atlassian.net/browse/SCRUM-2140),
    эпик [SCRUM-2139](https://javacode.atlassian.net/browse/SCRUM-2139). Бизнес-модель
    статусов и правил — `knowledge/business rules.md`, терминология — `knowledge/glossary.md`,
    допущения и открытые вопросы — `knowledge/assumptions.md`.

    ## Границы контракта

    В контракт входят только операции сценария подписания пакета документов:

    | Назначение | Операция |
    |---|---|
    | Передача пакета от партнёра | `POST /signing-packages` |
    | Передача содержимого документа | `PUT /signing-packages/{packageId}/documents/{documentId}/content` |
    | Отправка пакета на подписание | `POST /signing-packages/{packageId}/submissions` |
    | Получение информации о пакете и статусов документов | `GET /signing-packages/{packageId}` |
    | Просмотр содержимого документа до подписания | `GET /signing-packages/{packageId}/documents/{documentId}/content` |
    | Подтверждение и подписание документа | `POST /signing-packages/{packageId}/documents/{documentId}/signatures` |
    | Результат криптографической операции | `GET /signatures/{signatureId}` |
    | Отказ клиента от подписания | `POST /signing-packages/{packageId}/rejections` |
    | Результат обработки пакета | `GET /signing-packages/{packageId}/result` |
    | Уведомления партнёра | webhook `signingPackageStatusChanged` |

    Вне границ: выпуск и отзыв сертификата, аутентификация клиента в приложении партнёра,
    независимая проверка подписи как отдельная операция, отмена пакета партнёром,
    хранение документов сверх согласованного срока, администрирование и биллинг.

    ## Участники и авторизация

    * Система партнёра — OAuth 2.0 Client Credentials, scope `signing-packages:write`
      и `signing-packages:read`.
    * Приложение партнёра, действующее от имени клиента — OAuth 2.0 Authorization Code
      с PKCE, scope `signing-packages:read` и `signing-documents:perform`; субъект токена
      сопоставлен клиенту (`clientId`). Клиент получает доступ только к назначенным
      ему пакетам, для остальных возвращается `404` (AC-01).

    ## Основной сценарий

    1. Партнёр создаёт пакет в статусе `DRAFT` (`POST /signing-packages`).
    2. Партнёр передаёт содержимое каждого документа (`PUT .../content`); документ
       переходит в `READY_FOR_SIGNATURE` или `VALIDATION_FAILED`.
    3. Партнёр отправляет пакет на подписание и задаёт срок подписания
       (`POST .../submissions`); пакет переходит в `PENDING_SIGNATURE`.
    4. Клиент открывает пакет и документы; просмотр не является подписанием (AC-03).
    5. Клиент подтверждает подписание документа (`POST .../signatures`) — сервис проверяет
       сертификат, целостность содержимого и выполняет криптографическую операцию.
    6. При подписании части обязательных документов пакет переходит в `PARTIALLY_SIGNED`,
       после подписания всех обязательных — в `SIGNED` (AC-04, AC-05).
    7. Клиент может отказаться от подписания (`POST .../rejections`) — пакет переходит
       в `REJECTED`, уже подписанные документы не изменяются (AC-06).
    8. По истечении `expiresAt` пакет переходит в `EXPIRED`, дальнейшее подписание
       запрещается (AC-07).
    9. Партнёр получает уведомления webhook и/или результат опросом
       (`GET .../result`).

    ## Статусы и ошибки

    Статусы пакета и документа соответствуют модели `knowledge/business rules.md`
    (см. `x-state-machine`). Ошибки возвращаются в формате RFC 7807
    (`application/problem+json`) с машиночитаемым `code`, признаком `retryable`
    и идентификатором трассировки; каталог кодов — `x-error-catalog`.
    Повторная обработка защищена `Idempotency-Key` (`x-idempotency`).
