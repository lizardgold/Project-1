  VALIDATION_ERROR:
    httpStatus: 400
    retryable: false
    description: Нарушен формат запроса или обязательные поля; подробности в issues
  UNAUTHENTICATED:
    httpStatus: 401
    retryable: false
    description: Токен отсутствует, просрочен или недействителен
  INSUFFICIENT_SCOPE:
    httpStatus: 403
    retryable: false
    description: Токену не выдан требуемый scope
  PARTNER_NOT_ALLOWED:
    httpStatus: 403
    retryable: false
    description: Партнёр не имеет права выполнять операцию
  CLIENT_ACCESS_DENIED:
    httpStatus: 403
    retryable: false
    description: Клиент не имеет полномочий на операцию с пакетом
  CERTIFICATE_OWNER_MISMATCH:
    httpStatus: 403
    retryable: false
    description: Сертификат не принадлежит клиенту, выполняющему подписание (CERT-02)
  PACKAGE_NOT_FOUND:
    httpStatus: 404
    retryable: false
    description: Пакет не существует или не доступен субъекту запроса
  DOCUMENT_NOT_FOUND:
