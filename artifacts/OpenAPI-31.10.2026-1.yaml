            retryable: true
    GatewayTimeout:
      description: Истёк тайм-аут ожидания ответа зависимости; результат операции неизвестен
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://podpis-online.example/problems/dependency-timeout
            title: Истёк тайм-аут зависимости
            status: 504
            detail: Ответ криптографического компонента не получен. Проверьте состояние операции перед повтором.
            instance: /v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01/documents/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d/signatures
            code: DEPENDENCY_TIMEOUT
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            occurredAt: '2026-10-31T09:00:00Z'
            retryable: true
  schemas:
    PackageId:
      type: string
      format: uuid
      description: Идентификатор пакета документов, присваиваемый сервисом
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
    DocumentId:
      type: string
      format: uuid
      description: Идентификатор документа в пакете, присваиваемый сервисом
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
    SignatureId:
      type: string
      format: uuid
      description: Идентификатор операции подписания документа
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
    RejectionId:
      type: string
      format: uuid
      description: Идентификатор зафиксированного отказа клиента
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70
    EventId:
      type: string
      format: uuid
      description: Идентификатор события для дедупликации на стороне получателя
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: e5f6a7b8-c9d0-4e1f-a2b3-c4d5e6f70819
    Sha256Hex:
      type: string
      description: SHA-256 в шестнадцатеричном представлении, 64 символа в нижнем регистре
      minLength: 64
      maxLength: 64
      pattern: '^[0-9a-f]{64}$'
      example: f869f13f6a55ecabda9257bfacce3c93ea9e1690f0e3e826625091cea86c9b7f
    PackageStatus:
      type: string
      description: |
        Статус пакета документов по модели жизненного цикла. Терминальные статусы:
        `SIGNED`, `REJECTED`, `EXPIRED`, `CANCELLED`, `FAILED` — переходы из них
        запрещены (PKG-06).
      enum:
        - DRAFT
        - VALIDATING
        - PENDING_SIGNATURE
        - IN_PROGRESS
        - PARTIALLY_SIGNED
        - SIGNED
        - REJECTED
        - EXPIRED
        - CANCELLED
        - FAILED
      example: PARTIALLY_SIGNED
    DocumentStatus:
      type: string
      description: |
        Статус документа в пакете по модели жизненного цикла. `SIGNED`, `REJECTED`,
        `EXPIRED`, `CANCELLED` являются конечными статусами документа.
      enum:
        - RECEIVED
        - VALIDATING
        - READY_FOR_SIGNATURE
        - PENDING_SIGNATURE
        - SIGNING
        - SIGNED
        - REJECTED
        - EXPIRED
        - CANCELLED
        - VALIDATION_FAILED
        - SIGNING_FAILED
      example: PENDING_SIGNATURE
    SignatureStatus:
      type: string
      description: |
        Технический статус криптографической операции подписания. Не заменяет статус
        документа: `COMPLETED` соответствует `SIGNED`, `FAILED` — `SIGNING_FAILED`,
        `IN_PROGRESS` — `SIGNING`. Неопределённый результат остаётся `IN_PROGRESS`.
      enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
      example: COMPLETED
    SignatureFormat:
      type: string
      description: Формат сформированной электронной подписи
      enum:
        - CADES_BES
        - CADES_X_LONG_TYPE_1
        - PADES_BASELINE_LT
      example: CADES_BES
    ConfirmationMethod:
      type: string
      description: Механизм подтверждения намерения клиента, использованный при подписании
      enum:
        - SMS_OTP
        - PUSH_APP
        - BIOMETRICS
        - APP_PIN
      example: SMS_OTP
    RejectionReason:
      type: string
      description: Причина отказа клиента от подписания пакета
      enum:
        - TERMS_NOT_ACCEPTED
        - INCORRECT_PERSONAL_DATA
        - SIGNATURE_NOT_POSSIBLE
        - OTHER
      example: TERMS_NOT_ACCEPTED
    DocumentVariant:
      type: string
      description: Версия содержимого документа
      enum:
        - ORIGINAL
        - SIGNED
      example: ORIGINAL
    PackageEventType:
      type: string
      description: |
        Тип события об изменении статуса пакета. События `PACKAGE_PARTIALLY_SIGNED`
        и `PACKAGE_FAILED` отражают частичное подписание и критическую ошибку обработки.
      enum:
        - PACKAGE_PENDING_SIGNATURE
        - PACKAGE_PARTIALLY_SIGNED
        - PACKAGE_SIGNED
        - PACKAGE_REJECTED
        - PACKAGE_EXPIRED
        - PACKAGE_FAILED
      example: PACKAGE_SIGNED
    SigningPackageSummary:
      type: object
      description: Агрегированные счётчики документов пакета
      additionalProperties: false
      required:
        - documentsTotal
        - documentsRequired
        - documentsSigned
        - documentsFailed
        - documentsPending
      properties:
        documentsTotal:
          type: integer
          format: int32
          description: Общее число документов в пакете
          minimum: 1
          maximum: 20
          example: 2
        documentsRequired:
          type: integer
          format: int32
          description: Число документов, требующих обязательного подписания
          minimum: 0
          maximum: 20
          example: 2
        documentsSigned:
          type: integer
          format: int32
          description: Число подписанных документов
          minimum: 0
          maximum: 20
          example: 1
        documentsFailed:
          type: integer
          format: int32
          description: Число документов с ошибкой подписания или проверки
          minimum: 0
          maximum: 20
          example: 0
        documentsPending:
          type: integer
          format: int32
          description: Число документов, ожидающих подписания
          minimum: 0
          maximum: 20
          example: 1
    ValidationIssue:
      type: object
      description: Нарушение, выявленное при валидации запроса или документа
      additionalProperties: false
      required:
        - pointer
        - code
        - message
      properties:
        pointer:
          type: string
          description: JSON Pointer на поле запроса или имя проверяемого атрибута
          minLength: 1
          maxLength: 500
          example: /documents/0/contentSha256
        code:
          type: string
          description: Машиночитаемый код нарушения
          minLength: 3
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          example: PATTERN_MISMATCH
        message:
          type: string
          description: Описание нарушения для разработчика
          minLength: 1
          maxLength: 500
          example: Ожидается 64 шестнадцатеричных символа
    Problem:
      type: object
      description: |
        Описание ошибки по RFC 7807. Содержит машиночитаемый `code` для бизнес-логики
        и `retryable` для решения о повторной попытке. Бизнес-ошибки и технические
        ошибки различаются по коду и коду ответа (GEN-08).
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - traceId
        - occurredAt
      properties:
        type:
          type: string
          format: uri
          description: URI типа ошибки из каталога `x-error-catalog`
          minLength: 10
          maxLength: 200
          example: https://podpis-online.example/problems/package-state-conflict
        title:
          type: string
          description: Краткое описание класса ошибки
          minLength: 1
          maxLength: 200
          example: Недопустимый переход состояния
        status:
          type: integer
          format: int32
          description: HTTP-код ответа
          minimum: 400
          maximum: 599
          example: 409
        detail:
          type: string
          description: Пояснение причины ошибки для разработчика
          minLength: 1
          maxLength: 2000
          example: Пакет находится в статусе SIGNED и не может быть изменён.
        instance:
          type: string
          description: URI запроса, к которому относится ошибка
          minLength: 1
          maxLength: 500
          example: /v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01/submissions
        code:
          type: string
          description: Машиночитаемый код ошибки из каталога `x-error-catalog`
          minLength: 3
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          example: PACKAGE_STATE_CONFLICT
        traceId:
          type: string
          description: Идентификатор трассировки запроса
          minLength: 16
          maxLength: 64
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        occurredAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          description: Время фиксации ошибки
          example: '2026-10-31T09:00:00Z'
        retryable:
          type: boolean
          description: Признак допустимости повторного выполнения запроса
          example: false
        issues:
          type: array
          description: Список нарушений при ошибке валидации
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ValidationIssue'
          example:
            - pointer: /documents/0/contentSha256
              code: PATTERN_MISMATCH
              message: Ожидается 64 шестнадцатеричных символа
    PackageDocument:
      type: object
      description: Документ в составе пакета и его текущий статус
      additionalProperties: false
      required:
        - documentId
        - partnerDocumentId
        - sequence
        - fileName
        - mimeType
        - sizeBytes
        - contentSha256
        - signatureRequired
        - status
      properties:
        documentId:
          description: Идентификатор документа в пакете
          $ref: '#/components/schemas/DocumentId'
        partnerDocumentId:
          type: string
          description: Идентификатор документа в системе партнёра
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
          example: DOC-458-01
        sequence:
          type: integer
          format: int32
          description: Порядковый номер документа в пакете
          minimum: 1
          maximum: 20
          example: 1
        fileName:
          type: string
          description: Имя файла документа
          minLength: 1
          maxLength: 255
          pattern: '^[^/\\:*?"<>|]{1,255}$'
          example: Кредитный договор № 458.pdf
        mimeType:
          type: string
          description: MIME-тип содержимого документа
          enum:
            - application/pdf
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          description: Размер содержимого в байтах
          minimum: 1
          maximum: 26214400
          example: 245760
        contentSha256:
          description: SHA-256 содержимого документа
          $ref: '#/components/schemas/Sha256Hex'
        signatureRequired:
          type: boolean
          description: Признак обязательного подписания документа для завершения пакета
          example: true
        status:
          description: Текущий статус документа
          $ref: '#/components/schemas/DocumentStatus'
        statusReason:
          type: string
          description: Пояснение текущего статуса для отображения клиенту и партнёру
          minLength: 1
          maxLength: 500
          example: Документ ожидает подписания клиентом
        uploadedAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          description: Время успешной передачи и проверки содержимого
          example: '2026-10-31T09:02:10Z'
        signedAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          description: Время подписания документа
          example: '2026-10-31T10:12:40Z'
        signatureId:
          description: Идентификатор операции подписания документа
          $ref: '#/components/schemas/SignatureId'
        validationIssues:
          type: array
          description: Нарушения, выявленные при проверке документа
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ValidationIssue'
          example:
            - pointer: /content
              code: UNSUPPORTED_FORMAT
              message: Файл не является корректным PDF
    SigningPackage:
      type: object
      description: Пакет документов, назначенный клиенту, с составом и статусами документов
      additionalProperties: false
      required:
        - packageId
        - externalRequestId
        - clientId
        - status
        - createdAt
        - updatedAt
        - summary
        - documents
      properties:
        packageId:
          description: Идентификатор пакета
          $ref: '#/components/schemas/PackageId'
        externalRequestId:
          type: string
          description: Идентификатор пакета в системе партнёра, уникальный в пределах партнёра
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
          example: BNK-2026-000458
        clientId:
          type: string
          description: Идентификатор клиента, которому назначен пакет
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
          example: cl-8f3a2c91
        title:
          type: string
          description: Заголовок пакета для отображения клиенту
          minLength: 1
          maxLength: 200
          example: Кредитный пакет № 458
        status:
          description: Текущий статус пакета
          $ref: '#/components/schemas/PackageStatus'
        statusReason:
          type: string
          description: Пояснение текущего статуса пакета
          minLength: 1
          maxLength: 500
          example: Подписана часть обязательных документов
        createdAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          description: Время создания пакета
          example: '2026-10-31T09:00:00Z'
        updatedAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          description: Время последнего изменения пакета или его документов
          example: '2026-10-31T10:15:00Z'
        submittedAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          description: Время отправки пакета на подписание
          example: '2026-10-31T09:04:00Z'
        expiresAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          description: Срок, до которого клиент может подписать пакет
          example: '2026-11-07T09:00:00Z'
        completedAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          description: Время завершения подписания всех обязательных документов
          example: '2026-10-31T10:30:00Z'
        rejectedAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          description: Время фиксации отказа клиента
          example: '2026-10-31T10:20:00Z'
        expiredAt:
          type: string
          format: date-time
          minLength: 20
          maxLength: 30
          description: Время истечения срока подписания
          example: '2026-11-07T09:00:00Z'
        summary:
          description: Агрегированные счётчики документов
          $ref: '#/components/schemas/SigningPackageSummary'
        documents:
          type: array
          description: Состав пакета в порядке, заданном партнёром
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/PackageDocument'
          example:
            - documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
              partnerDocumentId: DOC-458-01
              sequence: 1
              fileName: Кредитный договор № 458.pdf
              mimeType: application/pdf
              sizeBytes: 245760
              contentSha256: f869f13f6a55ecabda9257bfacce3c93ea9e1690f0e3e826625091cea86c9b7f
              signatureRequired: true
              status: PENDING_SIGNATURE
    CreateSigningPackageDocument:
      type: object
      description: Документ, включаемый в создаваемый пакет
      additionalProperties: false
      required:
        - partnerDocumentId
        - fileName
        - mimeType
        - sizeBytes
        - contentSha256
      properties:
        partnerDocumentId:
          type: string
          description: Идентификатор документа в системе партнёра, уникальный в пределах пакета
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
          example: DOC-458-01
        fileName:
          type: string
          description: Имя файла документа, отображаемое клиенту
          minLength: 1
          maxLength: 255
          pattern: '^[^/\\:*?"<>|]{1,255}$'
          example: Кредитный договор № 458.pdf
        mimeType:
          type: string
          description: MIME-тип содержимого; на первом этапе поддерживается только PDF
          enum:
            - application/pdf
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          description: Ожидаемый размер содержимого в байтах
          minimum: 1
          maximum: 26214400
          example: 245760
        contentSha256:
          description: Ожидаемый SHA-256 содержимого документа
          $ref: '#/components/schemas/Sha256Hex'
        signatureRequired:
          type: boolean
          description: |
            Требуется ли обязательное подписание документа для завершения пакета.
            По умолчанию `true` (PKG-02).
          default: true
          example: true
    CreateSigningPackageRequest:
      type: object
      description: Запрос на создание пакета документов
      additionalProperties: false
      required:
        - externalRequestId
        - clientId
        - documents
      properties:
        externalRequestId:
          type: string
          description: Идентификатор пакета в системе партнёра, уникальный в пределах партнёра
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
          example: BNK-2026-000458
        clientId:
          type: string
          description: Идентификатор клиента, которому назначается пакет
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
          example: cl-8f3a2c91
        title:
          type: string
          description: Заголовок пакета для отображения клиенту
          minLength: 1
          maxLength: 200
          example: Кредитный пакет № 458
        webhookUrl:
          type: string
          format: uri
          description: |
            Адрес доставки webhook-уведомлений по этому пакету. При отсутствии
            уведомления не доставляются, партнёр использует опрос состояния.
          minLength: 10
          maxLength: 2048
          pattern: '^https://'
          example: https://bank-partner.example/hooks/signing-packages
        documents:
          type: array
          description: Состав пакета; от 1 до 20 документов
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CreateSigningPackageDocument'
          example:
            - partnerDocumentId: DOC-458-01
              fileName: Кредитный договор № 458.pdf
              mimeType: application/pdf
              sizeBytes: 245760
              contentSha256: f869f13f6a55ecabda9257bfacce3c93ea9e1690f0e3e826625091cea86c9b7f
              signatureRequired: true
