  /signatures/{signatureId}:
    parameters:
      - $ref: '#/components/parameters/SignatureId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Traceparent'
    get:
      tags:
        - Результаты
      summary: Получить результат подписания документа
      description: |
        Возвращает состояние и результат криптографической операции подписания
        документа (AC-02, AC-05).

        Пока операция выполняется, статус — `IN_PROGRESS`; после завершения —
        `COMPLETED` (сведения о сертификате, формате подписи и времени подписания)
        или `FAILED` (код и описание ошибки, признак `retryable`).

        Неопределённый результат не выдаётся за успех или окончательную ошибку:
        если сервис ещё не получил достоверный результат от криптографического
        компонента, операция остаётся `IN_PROGRESS` (BR 4.4). Повторная попытка
        подписания выполняется отдельным подтверждением; уже созданная подпись
        не дублируется.

        Клиент получает только операции по назначенным ему пакетам; партнёр —
        только по пакетам своего партнёра. Иначе возвращается `404 SIGNATURE_NOT_FOUND`.
      operationId: getSignature
      security:
        - partnerSystemOAuth:
            - signing-packages:read
        - partnerClientOAuth:
            - signing-packages:read
      responses:
        '200':
          description: Состояние и результат криптографической операции
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signature'
              example:
                signatureId: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
                packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                status: COMPLETED
                documentContentSha256: f869f13f6a55ecabda9257bfacce3c93ea9e1690f0e3e826625091cea86c9b7f
                confirmationMethod: SMS_OTP
                signatureFormat: CADES_BES
                createdAt: '2026-10-31T10:12:38Z'
                completedAt: '2026-10-31T10:12:40Z'
                certificate:
                  serialNumber: 01A2B3C4D5E6F708
                  subjectCommonName: Иванов Иван Иванович
                  issuerName: УЦ Аккредитованный АО
                  validFrom: '2026-02-01T00:00:00Z'
                  validTo: '2027-02-01T00:00:00Z'
                  fingerprint: 7d44484059aac69c63e19b6ba5c0b7b0e9f5f1f2a3b4c5d6e7f8091a2b3c4d5e
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        - UNAUTHENTICATED
        - CLIENT_ACCESS_DENIED
        - INSUFFICIENT_SCOPE
        - SIGNATURE_NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE

webhooks:
  signingPackageStatusChanged:
    post:
      tags:
        - События
      summary: Уведомление об изменении статуса пакета
      description: |
        Уведомляет партнёра об изменении статуса пакета (AC-05, AC-06, AC-07).
        Адрес доставки — `webhookUrl`, указанный при создании пакета. Если адрес
        не указан, партнёр получает состояние опросом
        (`GET /signing-packages/{packageId}` и `GET .../result`).

        Событие отправляется при переходе пакета в `PENDING_SIGNATURE`,
        `PARTIALLY_SIGNED`, `SIGNED`, `REJECTED`, `EXPIRED`, `FAILED`.
        События `PARTIALLY_SIGNED` и `FAILED` предусмотрены моделью статусов
        и позволяют партнёру отслеживать частичное подписание и критическую
        ошибку обработки.

        Доставка выполняется методом POST с телом `PackageEvent` и заголовками
        `Webhook-Id`, `Webhook-Timestamp`, `Webhook-Signature`, `Webhook-Attempt`.
        Подпись — HMAC-SHA256 от строки `<Webhook-Timestamp>.<сырое тело запроса>`;
        получатель обязан проверить подпись и timestamp до обработки события.
        Допустимое расхождение времени — 300 секунд; событие старше окна
        отклоняется получателем без повторной обработки.

        Повторная доставка выполняется только при временных ошибках
        (`5xx`, `408`, `429`): до 8 попыток с экспоненциальной задержкой
        и общим сроком 24 часа. Ответы `4xx` (кроме `408` и `429`) считаются
        окончательной ошибкой и не повторяются. Доставка является
        «хотя бы один раз»: дубликаты возможны, получатель обязан обеспечивать
        идемпотентность по `eventId`. Порядок событий не гарантируется.
        Подробная политика — `x-webhook-delivery`.
      operationId: onSigningPackageStatusChanged
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookAttempt'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageEvent'
            example:
              eventId: e5f6a7b8-c9d0-4e1f-a2b3-c4d5e6f70819
              eventType: PACKAGE_SIGNED
              occurredAt: '2026-10-31T10:30:00Z'
              packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
              packageStatus: SIGNED
              expiresAt: '2026-11-07T09:00:00Z'
              summary:
                documentsTotal: 2
                documentsRequired: 2
                documentsSigned: 2
                documentsFailed: 0
                documentsPending: 0
              documents:
                - documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                  partnerDocumentId: DOC-458-01
                  status: SIGNED
                  contentSha256: f869f13f6a55ecabda9257bfacce3c93ea9e1690f0e3e826625091cea86c9b7f
                  signedAt: '2026-10-31T10:12:40Z'
                  signatureId: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
                  signedContentAvailable: true
                - documentId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                  partnerDocumentId: DOC-458-02
                  status: SIGNED
                  contentSha256: 1faa7cf8e603fff429bfddcdbc045c40796aa194e1a311337263b1c68fc4598d
                  signedAt: '2026-10-31T10:29:50Z'
                  signatureId: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f70819203
                  signedContentAvailable: true
      responses:
        '204':
          description: |
            Событие принято получателем. Повторная доставка не выполняется.
        '400':
          description: |
            Некорректное тело события или подпись. Повторная доставка не выполняется.
        '401':
          description: |
            Подпись или timestamp не прошли проверку. Повторная доставка не выполняется.
        '429':
          description: |
            Получатель ограничил частоту. Доставка повторяется с учётом `Retry-After`.
        '500':
          description: |
            Временная ошибка получателя. Доставка повторяется в пределах срока доставки.

components:
  securitySchemes:
    partnerSystemOAuth:
      type: oauth2
      description: |
        Машинная аутентификация системы партнёра по OAuth 2.0 Client Credentials.
        Токен выпускается на `client_id` партнёра; `client_id` однозначно сопоставлен
        партнёру и определяет доступные ему пакеты. Рекомендуется mTLS.
      flows:
        clientCredentials:
          tokenUrl: https://auth.podpis-online.example/oauth2/token
          scopes:
            signing-packages:write: Создание пакета, передача содержимого и отправка на подписание
            signing-packages:read: Просмотр пакета, содержимого документов и результата обработки
    partnerClientOAuth:
      type: oauth2
      description: |
        Аутентификация клиента в приложении партнёра по OAuth 2.0 Authorization Code
        с PKCE. Субъект токена (`sub`) сопоставлен клиенту сервиса; `clientId` пакета
        должен совпадать с субъектом токена, иначе пакет считается недоступным.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.podpis-online.example/oauth2/authorize
          tokenUrl: https://auth.podpis-online.example/oauth2/token
          scopes:
            signing-packages:read: Просмотр пакета, содержимого документов и результата обработки
            signing-documents:perform: Подтверждение подписания документа и отказ от подписания
  parameters:
    PackageId:
      name: packageId
      in: path
      required: true
      description: Идентификатор пакета документов
      schema:
        $ref: '#/components/schemas/PackageId'
      example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Идентификатор документа в пакете
      schema:
        $ref: '#/components/schemas/DocumentId'
      example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
    SignatureId:
      name: signatureId
      in: path
      required: true
      description: Идентификатор операции подписания документа
      schema:
        $ref: '#/components/schemas/SignatureId'
      example: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Уникальный ключ запроса для защиты от повторной обработки. Повтор с тем же
        ключом и тем же телом возвращает результат первой обработки; повтор с другим
        телом завершается `409 IDEMPOTENCY_KEY_REUSED`. Ключ хранится 24 часа.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    RequestId:
      name: Request-Id
      in: header
      required: false
      description: |
        Идентификатор запроса клиента для сквозной трассировки. Возвращается
        в ответе и в теле ошибки как `traceId`; при отсутствии генерируется сервисом.
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
        example: 4bf92f3577b34da6
      example: 4bf92f3577b34da6
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: Заголовок контекста трассировки W3C Trace Context
      schema:
        type: string
        minLength: 55
        maxLength: 55
        pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
        example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Значение `ETag` из последнего полученного представления пакета. Если
        представление изменилось, запрос завершается `412 PACKAGE_VERSION_MISMATCH`.
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: '^"[0-9]+"$'
        example: '"7"'
      example: '"7"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        Значение `ETag` из предыдущего ответа. Если представление не изменилось,
        возвращается `304 Not Modified` без тела.
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: '^"[0-9]+"$'
        example: '"7"'
      example: '"7"'
    DocumentVariant:
      name: variant
      in: query
      required: false
      description: |
        Версия содержимого: `ORIGINAL` — исходная версия, переданная партнёром;
        `SIGNED` — подписанная версия, доступная только для подписанного документа.
      schema:
        $ref: '#/components/schemas/DocumentVariant'
      example: ORIGINAL
    WebhookId:
      name: Webhook-Id
      in: header
      required: true
      description: Идентификатор доставки события; используется для дедупликации
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        example: e5f6a7b8-c9d0-4e1f-a2b3-c4d5e6f70819
      example: e5f6a7b8-c9d0-4e1f-a2b3-c4d5e6f70819
    WebhookTimestamp:
      name: Webhook-Timestamp
      in: header
      required: true
      description: |
        Unix-время формирования запроса в секундах. Получатель отклоняет событие,
        если расхождение с локальным временем превышает 300 секунд.
      schema:
        type: integer
        format: int64
        minimum: 1600000000
        maximum: 4102444800
        example: 1793442600
      example: 1793442600
    WebhookSignature:
      name: Webhook-Signature
      in: header
      required: true
      description: |
        Подпись запроса: `t=<Webhook-Timestamp>,v1=<HMAC-SHA256("<timestamp>.<сырое тело>")>`.
        Секрет подписи выдаётся партнёру при регистрации интеграции.
      schema:
        type: string
        minLength: 70
        maxLength: 200
        pattern: '^t=[0-9]{10},v1=[0-9a-f]{64}$'
        example: t=1793442600,v1=9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
      example: t=1793442600,v1=9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
    WebhookAttempt:
      name: Webhook-Attempt
      in: header
      required: true
      description: Номер попытки доставки события, начиная с 1
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 8
        example: 1
      example: 1
  headers:
    ETag:
      description: Версия представления ресурса для условных запросов
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: '^"[0-9]+"$'
        example: '"7"'
      example: '"7"'
    Location:
      description: Ссылка на созданный или изменённый ресурс
      required: false
      schema:
        type: string
        format: uri
        minLength: 10
        maxLength: 512
        example: https://api.podpis-online.example/v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
      example: https://api.podpis-online.example/v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
    RetryAfter:
      description: Рекомендуемая задержка перед повторным запросом в секундах
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 3600
        example: 2
      example: 2
    IdempotentReplayed:
      description: Признак возврата результата ранее обработанного запроса
      required: false
      schema:
        type: boolean
        example: true
      example: true
    CacheControl:
      description: Управление кэшированием; персональные данные не кэшируются
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: no-store
      example: no-store
    LastModified:
      description: Время последнего изменения представления пакета
      required: false
      schema:
        type: string
        minLength: 29
        maxLength: 29
        example: Thu, 31 Oct 2026 10:15:00 GMT
      example: Thu, 31 Oct 2026 10:15:00 GMT
    ContentDisposition:
      description: Способ отображения файла и имя файла документа
      required: false
      schema:
        type: string
        minLength: 10
        maxLength: 300
        example: attachment; filename="credit-agreement-458.pdf"
      example: attachment; filename="credit-agreement-458.pdf"
    ContentLength:
      description: Размер содержимого в байтах
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 26214400
        example: 245760
      example: 245760
    RateLimitLimit:
      description: Допустимое число запросов в текущем окне
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100000
        example: 600
      example: 600
    RateLimitRemaining:
      description: Остаток запросов в текущем окне
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
        example: 597
      example: 597
    RateLimitReset:
      description: Время до сброса окна ограничения в секундах
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 3600
        example: 42
      example: 42
    WWWAuthenticate:
      description: Схема аутентификации и причина отказа
      required: false
      schema:
        type: string
        minLength: 10
        maxLength: 300
        example: Bearer realm="podpis-online", error="invalid_token"
      example: Bearer realm="podpis-online", error="invalid_token"
  responses:
    BadRequest:
      description: Некорректный запрос — нарушен формат или обязательные поля
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://podpis-online.example/problems/validation-error
            title: Ошибка валидации запроса
            status: 400
            detail: Запрос содержит 2 нарушения обязательных полей.
            instance: /v1/signing-packages
            code: VALIDATION_ERROR
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            occurredAt: '2026-10-31T09:00:00Z'
            retryable: false
            issues:
              - pointer: /documents/0/contentSha256
                code: PATTERN_MISMATCH
                message: Ожидается 64 шестнадцатеричных символа
              - pointer: /documents
                code: MIN_ITEMS
                message: Требуется не менее 1 документа
    Unauthorized:
      description: Аутентификация не выполнена или токен недействителен
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://podpis-online.example/problems/unauthenticated
            title: Требуется аутентификация
            status: 401
            detail: Токен доступа отсутствует или недействителен.
            instance: /v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
            code: UNAUTHENTICATED
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            occurredAt: '2026-10-31T09:00:00Z'
            retryable: false
    Forbidden:
      description: Недостаточно прав — не хватает scope или проверка полномочий не пройдена
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://podpis-online.example/problems/insufficient-scope
            title: Недостаточно прав
            status: 403
            detail: Токену не выдан scope signing-packages:write.
            instance: /v1/signing-packages
            code: INSUFFICIENT_SCOPE
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            occurredAt: '2026-10-31T09:00:00Z'
            retryable: false
    NotFound:
      description: Ресурс не найден или недоступен субъекту запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://podpis-online.example/problems/package-not-found
            title: Пакет не найден
            status: 404
            detail: Пакет не существует или не назначен этому клиенту.
            instance: /v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
            code: PACKAGE_NOT_FOUND
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            occurredAt: '2026-10-31T09:00:00Z'
            retryable: false
    Conflict:
      description: |
        Конфликт состояния или идемпотентности: недопустимый переход, изменённое
        содержимое, повтор ключа идемпотентности или уже существующий результат.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://podpis-online.example/problems/package-state-conflict
            title: Недопустимый переход состояния
            status: 409
            detail: Пакет находится в статусе SIGNED и не может быть изменён.
            instance: /v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01/submissions
            code: PACKAGE_STATE_CONFLICT
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            occurredAt: '2026-10-31T09:00:00Z'
            retryable: false
    PreconditionFailed:
      description: Предусловие по ETag не выполнено — представление изменилось
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://podpis-online.example/problems/package-version-mismatch
            title: Версия пакета изменилась
            status: 412
            detail: Значение If-Match не соответствует текущей версии пакета.
