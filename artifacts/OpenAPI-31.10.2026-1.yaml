x-state-machine:
  source: knowledge/business rules.md (раздел «Жизненные циклы сущностей»)
  package:
    terminal:
      - SIGNED
      - REJECTED
      - EXPIRED
      - CANCELLED
      - FAILED
    states:
      DRAFT: Пакет создан, состав зафиксирован, содержимое документов передаётся.
      VALIDATING: Выполняется проверка состава и готовности документов после отправки.
      PENDING_SIGNATURE: Пакет доступен клиенту, срок подписания установлен.
      IN_PROGRESS: Клиент подтвердил подписание, криптографическая операция выполняется.
      PARTIALLY_SIGNED: Подписана часть обязательных документов.
      SIGNED: Все обязательные документы подписаны.
      REJECTED: Клиент отказался от подписания.
      EXPIRED: Истёк срок подписания.
      CANCELLED: Пакет отменён партнёром (вне границ этого контракта).
      FAILED: Критическая ошибка обработки, дальнейшая обработка невозможна.
    transitions:
      - from: DRAFT
        to: VALIDATING
        trigger: POST /signing-packages/{packageId}/submissions
        guard: Все документы в READY_FOR_SIGNATURE, есть обязательные документы
      - from: VALIDATING
        to: PENDING_SIGNATURE
        trigger: Завершение проверки состава
        guard: Все документы прошли проверку
      - from: VALIDATING
        to: FAILED
        trigger: Завершение проверки состава
        guard: Хотя бы один документ не прошёл проверку
      - from: PENDING_SIGNATURE
        to: IN_PROGRESS
        trigger: POST /signing-packages/{packageId}/documents/{documentId}/signatures
        guard: Документ в PENDING_SIGNATURE или SIGNING_FAILED, подтверждение получено
      - from: IN_PROGRESS
        to: PARTIALLY_SIGNED
        trigger: Завершение операции подписания
        guard: Подписана часть обязательных документов
      - from: IN_PROGRESS
        to: SIGNED
        trigger: Завершение операции подписания
        guard: Все обязательные документы в SIGNED
      - from: PARTIALLY_SIGNED
        to: SIGNED
        trigger: Завершение операции подписания
        guard: Все обязательные документы в SIGNED
      - from: PENDING_SIGNATURE
        to: PARTIALLY_SIGNED
        trigger: Завершение операции подписания
        guard: Подписана часть обязательных документов
      - from: PENDING_SIGNATURE
        to: REJECTED
        trigger: POST /signing-packages/{packageId}/rejections
        guard: Подтверждение отказа получено, нет документа в SIGNING
      - from: IN_PROGRESS
        to: REJECTED
        trigger: POST /signing-packages/{packageId}/rejections
        guard: Подтверждение отказа получено, нет документа в SIGNING
      - from: PARTIALLY_SIGNED
        to: REJECTED
        trigger: POST /signing-packages/{packageId}/rejections
        guard: Подтверждение отказа получено, нет документа в SIGNING
      - from: PENDING_SIGNATURE
        to: EXPIRED
        trigger: Наступление expiresAt
        guard: Пакет не подписан полностью
      - from: IN_PROGRESS
        to: EXPIRED
        trigger: Наступление expiresAt
        guard: Пакет не подписан полностью
      - from: PARTIALLY_SIGNED
        to: EXPIRED
        trigger: Наступление expiresAt
        guard: Пакет не подписан полностью
    invariants:
      - Из терминальных статусов переходы запрещены; повторный процесс требует нового пакета (PKG-06).
      - Статус пакета пересчитывается по фактическому состоянию документов (PKG-03).
      - Отказ, истечение срока и отмена не аннулируют уже созданные подписи (PKG-05).
      - Состав и содержимое пакета неизменны после перехода в PENDING_SIGNATURE (PKG-01).
      - Пакет получает SIGNED только при подписании всех документов с signatureRequired=true (PKG-02).
  document:
    terminal:
      - SIGNED
      - REJECTED
      - EXPIRED
      - CANCELLED
    states:
      RECEIVED: Документ создан по метаданным партнёра, содержимое ещё не передано.
      VALIDATING: Выполняется проверка формата, размера, хеша и структуры.
      READY_FOR_SIGNATURE: Проверки пройдены, документ готов к включению в подписание.
      PENDING_SIGNATURE: Документ доступен клиенту для подписания.
      SIGNING: Выполняется криптографическая операция подписания.
      SIGNED: Подпись сформирована и сохранена.
      REJECTED: Клиент отказался от подписания документа.
      EXPIRED: Истёк срок подписания документа.
      CANCELLED: Документ отменён партнёром (вне границ этого контракта).
      VALIDATION_FAILED: Документ не прошёл проверку.
      SIGNING_FAILED: Криптографическая операция завершилась ошибкой.
    transitions:
      - from: RECEIVED
        to: VALIDATING
        trigger: PUT .../documents/{documentId}/content
        guard: Содержимое получено, тип содержимого допустим
      - from: VALIDATING
        to: READY_FOR_SIGNATURE
        trigger: Завершение проверки содержимого
        guard: Размер и SHA-256 совпадают с метаданными, формат допустим
      - from: VALIDATING
        to: VALIDATION_FAILED
        trigger: Завершение проверки содержимого
        guard: Формат недопустим или содержимое не читается
      - from: READY_FOR_SIGNATURE
        to: PENDING_SIGNATURE
        trigger: Отправка пакета на подписание
        guard: Все проверки завершены
      - from: PENDING_SIGNATURE
        to: SIGNING
        trigger: Подтверждение подписания клиентом
        guard: Сертификат действителен, содержимое не изменилось
      - from: SIGNING_FAILED
        to: SIGNING
        trigger: Повторное подтверждение подписания
        guard: Повторная попытка разрешена (BR-DOC-05)
      - from: SIGNING
        to: SIGNED
        trigger: Успешное завершение криптографической операции
        guard: Результат подписания сохранён
      - from: SIGNING
        to: SIGNING_FAILED
        trigger: Ошибка или недоступность криптографического компонента
        guard: Результат операции достоверно известен как неуспешный
      - from: PENDING_SIGNATURE
        to: REJECTED
        trigger: Отказ клиента от подписания пакета
        guard: Подтверждение отказа получено
      - from: PENDING_SIGNATURE
        to: EXPIRED
        trigger: Наступление expiresAt
        guard: Документ не подписан
    invariants:
      - Подписанный документ не изменяется; изменение требует новой версии и нового подписания (BR-DOC-06, PKG-04).
      - Подпись относится к конкретной версии содержимого, проверяемой по SHA-256 (BR-DOC-03).
      - Возможность подписания определяется статусом сертификата на момент подписания (CERT-03, CERT-07).
  signature:
    mapping: |
      Статус операции подписания (SignatureStatus) является техническим и сопоставлен
      статусу документа: IN_PROGRESS → SIGNING, COMPLETED → SIGNED,
      FAILED → SIGNING_FAILED. Неопределённый результат остаётся IN_PROGRESS
      до получения достоверных сведений (BR 4.4).
    unknown_result: |
      При недоступности криптографического компонента после отправки запроса операция
      не считается неуспешной: статус остаётся IN_PROGRESS, повторное подписание
      выполняется только после проверки результата через GET /signatures/{signatureId}
      (BR 4.4, 5.4). Дублирование подписи исключается проверкой существующей операции.

x-authorization:
  principles:
    - Каждый запрос требует токен OAuth 2.0; анонимных операций нет.
    - Система партнёра действует в пределах своего client_id; чужие пакеты недоступны.
    - Клиент действует в пределах пакетов, назначенных ему (clientId совпадает с субъектом токена).
    - Отсутствие прав на объект не раскрывает его существование: возвращается 404, а не 403.
    - Недостаточный scope оформляется как 403 INSUFFICIENT_SCOPE.
  matrix:
    - operation: createSigningPackage
      subject: Система партнёра
      scope: signing-packages:write
      checks: Токен выдан партнёру; clientId относится к партнёру
    - operation: uploadDocumentContent
      subject: Система партнёра
      scope: signing-packages:write
      checks: Пакет принадлежит партнёру; пакет в DRAFT
    - operation: submitSigningPackage
      subject: Система партнёра
      scope: signing-packages:write
      checks: Пакет принадлежит партнёру; пакет в DRAFT
    - operation: getSigningPackage
      subject: Партнёр или клиент
      scope: signing-packages:read
      checks: Партнёр — владелец пакета; клиент — clientId пакета равен субъекту токена
    - operation: getDocumentContent
      subject: Партнёр или клиент
      scope: signing-packages:read
      checks: Те же проверки, что для пакета
    - operation: createDocumentSignature
      subject: Клиент
      scope: signing-documents:perform
      checks: Пакет назначен клиенту; сертификат принадлежит клиенту
    - operation: getSignature
      subject: Партнёр или клиент
      scope: signing-packages:read
      checks: Доступ к пакету операции подписания
    - operation: rejectSigningPackage
      subject: Клиент
      scope: signing-documents:perform
      checks: Пакет назначен клиенту; пакет в статусе, допускающем отказ
    - operation: getSigningPackageResult
      subject: Партнёр или клиент
      scope: signing-packages:read
      checks: Те же проверки, что для пакета

x-idempotency:
  header: Idempotency-Key
  requiredFor:
    - createSigningPackage
    - uploadDocumentContent
    - submitSigningPackage
    - createDocumentSignature
    - rejectSigningPackage
  keyFormat: 16–128 символов [A-Za-z0-9._:-]
  scope: client_id партнёра или субъект клиентского токена + операция
  retentionHours: 24
  bodyBinding: SHA-256 тела запроса
  behavior:
    replaySameBody: Результат первой обработки возвращается с заголовком Idempotent-Replayed true
    replayDifferentBody: 409 IDEMPOTENCY_KEY_REUSED
    concurrentSameKey: 409 IDEMPOTENCY_REQUEST_IN_PROGRESS с Retry-After
  notes:
    - Повторное подтверждение уже подписанного документа возвращает 409 SIGNATURE_ALREADY_EXISTS и не создаёт вторую подпись.
    - Для операций чтения ключ идемпотентности не требуется.
    - Повторная доставка webhook защищена eventId на стороне получателя.

x-webhook-delivery:
  registration: |
    Партнёр передаёт webhookUrl при создании пакета. Уведомления доставляются только
    по пакетам этого партнёра. Если webhookUrl не указан, уведомления не доставляются,
    партнёр получает состояние опросом.
  transport: POST с телом PackageEvent, Content-Type application/json
  atLeastOnce: true
  ordering: Порядок событий не гарантируется; актуальное состояние получается запросом пакета.
  headers:
    Webhook-Id: Идентификатор доставки, UUID, используется для дедупликации
    Webhook-Timestamp: Unix-время формирования запроса, секунды
    Webhook-Signature: t=<timestamp>,v1=<HMAC-SHA256("<timestamp>.<сырое тело>")>
    Webhook-Attempt: Номер попытки, от 1 до 8
  signatureSecret: Секрет HMAC-SHA256, выданный партнёру при регистрации интеграции
  timestamp:
    toleranceSeconds: 300
    rejectFuture: true
    rejectExpired: true
    replayProtection: Повтор события с тем же eventId и в пределах окна отклоняется получателем
  retries:
    maxAttempts: 8
    strategy: exponential-backoff
    initialDelaySeconds: 5
    maxDelaySeconds: 3600
    deliveryDeadlineHours: 24
    retryOnStatusCodes:
      - 408
      - 429
      - 500
      - 502
      - 503
      - 504
    noRetryOnStatusCodes:
      - 400
      - 401
      - 403
      - 404
      - 409
      - 422
    respectRetryAfter: true
    onExhausted: |
      Событие фиксируется как недоставленное; повторная доставка вручную не выполняется,
      партнёр получает актуальное состояние запросом GET /signing-packages/{packageId}
      и GET /signing-packages/{packageId}/result.
  receiverTimeoutSeconds: 5
  receiverMustBeIdempotent: true

x-limits:
  documentsPerPackage:
    minimum: 1
    maximum: 20
  documentSizeBytes:
    minimum: 1
    maximum: 26214400
  packageSizeBytes:
    maximum: 104857600
  supportedMimeTypes:
    - application/pdf
  signingDeadlineDays:
    maximum: 30
  uploadMode: Однократная передача файла целиком; частичная загрузка не поддерживается
  note: |
    Значения являются рабочими допущениями (A-05, A-06) и подлежат подтверждению;
    открытые вопросы — OQ-05.

x-rate-limits:
  partner:
    requestsPerMinute: 600
    scope: client_id партнёра
  client:
    requestsPerMinute: 120
    scope: субъект клиентского токена
  upload:
    requestsPerMinute: 60
    scope: client_id партнёра
  headers:
    - RateLimit-Limit
    - RateLimit-Remaining
    - RateLimit-Reset
    - Retry-After
  note: |
    Значения предварительные (A-12). При превышении возвращается `429 RATE_LIMITED`
    с `Retry-After` и заголовками `RateLimit-*`. Структурированный заголовок
    `RateLimit` (черновик IETF) и `RateLimit-Policy` не используются
    до согласования формата.

