            status: 500
            detail: Ошибка обработки запроса. Повторите запрос; если ошибка повторяется — обратитесь в поддержку.
            instance: /v1/signing-packages
            code: INTERNAL_ERROR
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
