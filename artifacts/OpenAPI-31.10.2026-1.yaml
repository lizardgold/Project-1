  /signing-packages/{packageId}/rejections:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Traceparent'
    post:
      tags:
        - Подписание
      summary: Отказаться от подписания пакета
      description: |
        Фиксирует явный отказ клиента от подписания пакета (AC-06).

        Требования: `confirmed: true` — явное подтверждение отказа, иначе
        `422 CONFIRMATION_REQUIRED`. Отказ допускается для пакета в статусе
        `PENDING_SIGNATURE`, `IN_PROGRESS` или `PARTIALLY_SIGNED`.

        Результат: пакет переходит в `REJECTED`, документы в статусе
        `PENDING_SIGNATURE` — в `REJECTED`; уже подписанные документы сохраняют
        статус `SIGNED`, их подписи и время подписания не изменяются (PKG-05).
        Партнёр получает уведомление `PACKAGE_REJECTED`.

        Отказ невозможен, пока выполняется криптографическая операция
        (документ в `SIGNING`): возвращается `409 SIGNING_IN_PROGRESS`.
        Отказ по пакету в терминальном статусе (`SIGNED`, `REJECTED`, `EXPIRED`,
        `CANCELLED`, `FAILED`) завершается `409 PACKAGE_STATE_CONFLICT`.
