    ServiceUnavailable:
      description: |
        Зависимость недоступна: удостоверяющий центр, криптографический компонент,
        хранилище документов или сервис проверки сертификатов. Бизнес-операция
        не выполнена либо результат неизвестен; перед повтором следует запросить
        состояние операции.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
