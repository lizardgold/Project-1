security:
  - partnerSystemOAuth:
      - signing-packages:read

paths:
  /signing-packages:
    post:
      tags:
        - Пакеты документов
      summary: Создать пакет документов
      description: |
        Принимает от системы партнёра пакет документов и создаёт его в статусе `DRAFT`.

        Состав пакета фиксируется в момент создания: после создания документы нельзя
        добавить или удалить. Содержимое каждого документа передаётся отдельным запросом
        `PUT /signing-packages/{packageId}/documents/{documentId}/content`.
        Клиент получает доступ к пакету только после успешной отправки на подписание
        (`POST /signing-packages/{packageId}/submissions`).

        `clientId` определяет клиента, которому назначается пакет. Пакет, назначенный
        другому клиенту, недоступен: запросы клиента по такому пакету завершаются `404`.

        Идемпотентность: повтор с тем же `Idempotency-Key` и тем же телом возвращает
        ранее созданный пакет с заголовком `Idempotent-Replayed: true`; повтор с другим
        телом завершается `409 IDEMPOTENCY_KEY_REUSED`; параллельный запрос с тем же
        ключом — `409 IDEMPOTENCY_REQUEST_IN_PROGRESS`. Повторное использование
        `externalRequestId` в пределах партнёра — `409 DUPLICATE_EXTERNAL_REQUEST_ID`.

        Ограничения состава: от 1 до 20 документов, суммарный размер не более 100 МиБ,
        `mimeType` — `application/pdf` (см. `x-limits`).
      operationId: createSigningPackage
      security:
        - partnerSystemOAuth:
            - signing-packages:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSigningPackageRequest'
            example:
              externalRequestId: BNK-2026-000458
              clientId: cl-8f3a2c91
              title: Кредитный пакет № 458
              webhookUrl: https://bank-partner.example/hooks/signing-packages
              documents:
                - partnerDocumentId: DOC-458-01
                  fileName: Кредитный договор № 458.pdf
                  mimeType: application/pdf
                  sizeBytes: 245760
                  contentSha256: f869f13f6a55ecabda9257bfacce3c93ea9e1690f0e3e826625091cea86c9b7f
                  signatureRequired: true
                - partnerDocumentId: DOC-458-02
                  fileName: График платежей.pdf
                  mimeType: application/pdf
                  sizeBytes: 81920
                  contentSha256: 1faa7cf8e603fff429bfddcdbc045c40796aa194e1a311337263b1c68fc4598d
                  signatureRequired: true
      responses:
        '201':
          description: Пакет создан; документы ожидают передачи содержимого
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningPackage'
              example:
                packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                externalRequestId: BNK-2026-000458
                clientId: cl-8f3a2c91
                title: Кредитный пакет № 458
                status: DRAFT
                createdAt: '2026-10-31T09:00:00Z'
                updatedAt: '2026-10-31T09:00:00Z'
                summary:
                  documentsTotal: 2
                  documentsRequired: 2
                  documentsSigned: 0
                  documentsFailed: 0
                  documentsPending: 2
                documents:
                  - documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    partnerDocumentId: DOC-458-01
                    sequence: 1
                    fileName: Кредитный договор № 458.pdf
                    mimeType: application/pdf
                    sizeBytes: 245760
                    contentSha256: f869f13f6a55ecabda9257bfacce3c93ea9e1690f0e3e826625091cea86c9b7f
                    signatureRequired: true
                    status: RECEIVED
                  - documentId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                    partnerDocumentId: DOC-458-02
                    sequence: 2
                    fileName: График платежей.pdf
                    mimeType: application/pdf
                    sizeBytes: 81920
                    contentSha256: 1faa7cf8e603fff429bfddcdbc045c40796aa194e1a311337263b1c68fc4598d
                    signatureRequired: true
                    status: RECEIVED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - PARTNER_NOT_ALLOWED
        - DUPLICATE_EXTERNAL_REQUEST_ID
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_REQUEST_IN_PROGRESS
        - PACKAGE_SIZE_EXCEEDED
        - UNSUPPORTED_MEDIA_TYPE
        - CLIENT_NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE

  /signing-packages/{packageId}/documents/{documentId}/content:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Traceparent'
    put:
      tags:
        - Пакеты документов
      summary: Передать содержимое документа
      description: |
        Принимает содержимое документа в бинарном виде и заменяет ранее переданное
        содержимое. После успешной проверки документ переходит в `READY_FOR_SIGNATURE`.

        Проверки: размер совпадает с `sizeBytes`, указанным при создании; SHA-256
        совпадает с `contentSha256`; файл является допустимым PDF; общий размер пакета
        не превышает 100 МиБ. При несовпадении размера или хеша содержимое не сохраняется
        и возвращается `409` (`DOCUMENT_SIZE_MISMATCH`, `DOCUMENT_CONTENT_MISMATCH`);
        при неподдерживаемом формате документ переходит в `VALIDATION_FAILED` и
        возвращается `422` (`UNSUPPORTED_DOCUMENT_FORMAT`).

        Замена содержимого разрешена, пока пакет находится в `DRAFT` и документ не
        отправлен клиенту. После перехода пакета в `PENDING_SIGNATURE` содержимое
        неизменно (PKG-01) — попытка замены завершается `409 PACKAGE_STATE_CONFLICT`.

        Частичная загрузка (`Content-Range`) не поддерживается. Запрос идемпотентен
        по содержимому: повторная передача того же файла возвращает `204` без повторной
        проверки криптографической операции.
      operationId: uploadDocumentContent
      security:
        - partnerSystemOAuth:
            - signing-packages:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Бинарное содержимое документа в формате PDF
        content:
          application/pdf:
            schema:
              type: string
              format: binary
              description: Содержимое файла документа
            example: '%PDF-1.7 (содержимое документа, переданное партнёром)'
      responses:
        '204':
          description: Содержимое принято и проверено; документ готов к подписанию
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - PARTNER_NOT_ALLOWED
        - PACKAGE_NOT_FOUND
        - DOCUMENT_NOT_FOUND
        - PACKAGE_STATE_CONFLICT
        - DOCUMENT_SIZE_MISMATCH
        - DOCUMENT_CONTENT_MISMATCH
        - PACKAGE_SIZE_EXCEEDED
        - UNSUPPORTED_MEDIA_TYPE
        - UNSUPPORTED_DOCUMENT_FORMAT
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE
    get:
      tags:
        - Документы
      summary: Получить содержимое документа
      description: |
        Возвращает содержимое документа: исходную версию, переданную партнёром
        (`variant=ORIGINAL`), или подписанную версию (`variant=SIGNED`).

        Клиент может просмотреть содержимое до подтверждения подписания (AC-01).
        Операция безопасна: она не выполняет криптографическую операцию, не изменяет
        статус документа и не считается подписанием (AC-03).

        Подписанная версия доступна только для документа в статусе `SIGNED`;
        в остальных случаях возвращается `409 DOCUMENT_NOT_SIGNED`. Если содержимое
        ещё не передано партнёром, возвращается `409 DOCUMENT_CONTENT_NOT_AVAILABLE`.

        Доступ клиента ограничен назначенным ему пакетом; для чужого пакета
        возвращается `404 PACKAGE_NOT_FOUND`. Партнёр получает содержимое только
        по пакетам своего партнёра.
      operationId: getDocumentContent
      security:
        - partnerSystemOAuth:
            - signing-packages:read
        - partnerClientOAuth:
            - signing-packages:read
      parameters:
        - $ref: '#/components/parameters/DocumentVariant'
      responses:
        '200':
          description: Содержимое документа в формате PDF
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                description: Содержимое документа
              example: '%PDF-1.7 (содержимое документа)'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - CLIENT_ACCESS_DENIED
        - INSUFFICIENT_SCOPE
        - PACKAGE_NOT_FOUND
        - DOCUMENT_NOT_FOUND
        - DOCUMENT_NOT_SIGNED
        - DOCUMENT_CONTENT_NOT_AVAILABLE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE

  /signing-packages/{packageId}/submissions:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Traceparent'
    post:
      tags:
        - Пакеты документов
      summary: Отправить пакет на подписание
      description: |
        Передаёт пакет на подписание клиенту и фиксирует срок подписания `expiresAt`.

        Предусловия: пакет в статусе `DRAFT`, у всех документов переданное содержимое
        прошло проверку (`READY_FOR_SIGNATURE`), имеется хотя бы один документ
        с `signatureRequired: true`. Пакет переходит в `VALIDATING`, затем
        в `PENDING_SIGNATURE`; документы переходят в `PENDING_SIGNATURE`.
        Ответ `202` возвращает текущий снимок пакета; состояние проверки доступно
        через `GET /signing-packages/{packageId}`.

        Если хотя бы один документ не прошёл проверку, пакет переходит в `FAILED`,
        документ — в `VALIDATION_FAILED`; повторная отправка того же пакета невозможна
        (терминальный статус), требуется новый пакет (PKG-06).

        `expiresAt` должен быть в будущем и не превышать 30 суток с момента отправки;
        иначе возвращается `422 EXPIRES_AT_INVALID`. Для защиты от параллельных
        изменений допускается `If-Match` со значением `ETag`; при несовпадении
        возвращается `412 PACKAGE_VERSION_MISMATCH`.
      operationId: submitSigningPackage
      security:
        - partnerSystemOAuth:
            - signing-packages:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSigningPackageRequest'
            example:
              expiresAt: '2026-11-07T09:00:00Z'
              comment: Пакет для подписания кредитной документации
      responses:
        '202':
          description: Пакет принят на подписание; выполняется проверка состава
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningPackage'
              example:
                packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                externalRequestId: BNK-2026-000458
                clientId: cl-8f3a2c91
                title: Кредитный пакет № 458
                status: VALIDATING
                createdAt: '2026-10-31T09:00:00Z'
                updatedAt: '2026-10-31T09:04:00Z'
                submittedAt: '2026-10-31T09:04:00Z'
                expiresAt: '2026-11-07T09:00:00Z'
                summary:
                  documentsTotal: 2
                  documentsRequired: 2
                  documentsSigned: 0
                  documentsFailed: 0
                  documentsPending: 2
                documents:
                  - documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    partnerDocumentId: DOC-458-01
                    sequence: 1
