    description: Тайм-аут криптографической операции; используется также как failureCode подписи

x-open-questions:
  - id: OQ-01
    question: |
      Какой механизм подтверждения намерения клиента является целевым (SMS-код,
      push в приложении партнёра, биометрия, PIN приложения) и достаточно ли одного
      фактора для юридически значимого подтверждения? Подтверждение единое для пакета
      или отдельное для каждого документа?
    impact: |
      Влияет на ConfirmationMethod, требования к доказательной базе подтверждения
      и на число операций подписания. В контракте подтверждение моделируется
      для каждого документа.
    status: OPEN
    owner: Владелец продукта, архитектор безопасности
  - id: OQ-02
    question: |
      Где выполняется криптографическая операция и какой формат УКЭП является целевым
      (CAdES-BES, CAdES-X Long Type 1, PAdES)? Кто предоставляет сертификат и ключ:
      удостоверяющий центр, криптопровайдер или приложение клиента?
    impact: |
      Влияет на SignatureFormat, состав CertificateSnapshot, коды ошибок
      криптографического компонента и требования к хранению ключей.
    status: OPEN
    owner: Архитектор, владелец интеграции с УЦ
  - id: OQ-03
    question: |
      Допускается ли частичное подписание пакета бизнесом и что происходит с уже
      подписанными документами при отказе или истечении срока?
    impact: |
      Влияет на статусы PARTIALLY_SIGNED и REJECTED, поведение уведомлений
      и требования партнёров. В контракте реализована модель AC-04: подписанные
      документы сохраняют SIGNED.
    status: OPEN
    owner: Владелец продукта
  - id: OQ-04
    question: |
      Как повторно подписывать документы после SIGNING_FAILED: в рамках того же пакета
      или требуется новый пакет? Сколько попыток допускается?
    impact: |
      Влияет на переход SIGNING_FAILED → SIGNING, ограничения частоты попыток
      и поведение при повторных ошибках.
    status: OPEN
    owner: Владелец продукта, архитектор
  - id: OQ-05
    question: |
      Подтверждаются ли лимиты: 20 документов, 25 МиБ на документ, 100 МиБ на пакет,
      только PDF, срок подписания не более 30 суток? Нужна ли частичная загрузка
      крупных документов?
    impact: |
      Влияет на валидацию, коды ошибок, лимиты API-шлюза и требования к хранилищу.
    status: OPEN
    owner: Архитектор, владелец интеграции
  - id: OQ-06
    question: |
      Кто выпускает клиентский токен и какие claims подтверждают личность клиента?
      Как сопоставляется clientId пакета с субъектом токена и внутренним клиентом сервиса?
    impact: |
      Влияет на partnerClientOAuth, проверку доступа к пакету и защиту от подмены клиента.
    status: OPEN
    owner: Архитектор безопасности, владелец интеграции с партнёром
  - id: OQ-07
    question: |
      Являются ли webhook-уведомления обязательными для партнёров или достаточно
      опроса? Как выдаётся и ротируется секрет подписи?
    impact: |
      Влияет на webhookUrl, контракт PackageEvent, инфраструктуру доставки.
    status: OPEN
    owner: Владелец продукта, владельцы интеграций
  - id: OQ-08
    question: |
      Каков предельный срок устранения неопределённого результата подписания
      при недоступности криптографического компонента и кто принимает решение
      о ручном разборе?
    impact: |
      Влияет на длительность IN_PROGRESS, регламент сверки, уведомления и поддержку.
    status: OPEN
    owner: Архитектор, служба эксплуатации
  - id: OQ-09
    question: |
      Нужна ли отдельная операция проверки подписи в этом API или достаточно сведений
      о подписи в результате обработки пакета?
    impact: |
      Влияет на состав операций и контракт проверки подписи (BR-DOC-07, BR-DOC-08).
    status: OPEN
    owner: Владелец продукта
  - id: OQ-10
    question: |
      Как обрабатывать отмену пакета партнёром и повторную отправку после FAILED:
      нужны ли отдельные операции и допустимо ли исправление пакета без создания нового?
    impact: |
      Влияет на статус CANCELLED, повторную отправку и состав операций контракта.
    status: OPEN
    owner: Владелец продукта, архитектор
  - id: OQ-11
    question: |
      Какой часовой пояс и источник времени используются для фиксации expiresAt
      и момента подписания? Допускается ли расхождение часов с системой партнёра?
    impact: |
      Влияет на расчёт срока подписания, статус EXPIRED и доказательную базу времени.
    status: OPEN
    owner: Архитектор, юридическая служба

x-assumptions:
  - id: A-01
    statement: |
      Система партнёра аутентифицируется по OAuth 2.0 Client Credentials; client_id
      однозначно сопоставлен партнёру. mTLS рекомендуется, но не обязателен
      до согласования.
    rationale: Соответствует модели машинной идентичности проекта.
    affected: partnerSystemOAuth, доступ к пакетам
  - id: A-02
    statement: |
      Клиентский токен выпускается для приложения партнёра после аутентификации
      клиента; субъект токена сопоставлен clientId, переданному партнёром.
    rationale: Позволяет проверять принадлежность пакета без передачи персональных данных.
    affected: partnerClientOAuth, CreateSigningPackageRequest.clientId
  - id: A-03
    statement: |
      Состав пакета фиксируется при создании; добавление и удаление документов
      не поддерживается, содержимое можно заменить до отправки пакета.
    rationale: Обеспечивает неизменность состава до начала подписания (PKG-01).
    affected: createSigningPackage, uploadDocumentContent
  - id: A-04
    statement: |
      Подтверждение подписания выполняется отдельной операцией на каждый документ
      и требует явного confirmed=true; просмотр содержимого подписанием не является.
    rationale: Прямое следствие AC-02 и AC-03.
    affected: createDocumentSignature, getDocumentContent
  - id: A-05
    statement: |
      На первом этапе поддерживается только PDF; лимиты 20 документов, 25 МиБ
      на документ и 100 МиБ на пакет предварительные.
    rationale: Упрощает криптографическую обработку и согласуется с типовыми ограничениями каналов.
    affected: mimeType, sizeBytes, x-limits
  - id: A-06
    statement: |
      Срок подписания задаётся партнёром при отправке пакета и не превышает 30 суток;
      по истечении срока пакет переходит в EXPIRED автоматически.
    rationale: Реализует AC-07 и PKG-07 без отдельной операции закрытия пакета.
    affected: SubmitSigningPackageRequest.expiresAt, PackageStatus
  - id: A-07
    statement: |
      Криптографическая операция выполняется асинхронно: подтверждение возвращает 202,
      результат доступен через GET /signatures/{signatureId}.
    rationale: Позволяет корректно обрабатывать неопределённый результат (BR 4.4) и тайм-ауты УЦ.
    affected: Signature, SignatureStatus, response 202
  - id: A-08
    statement: |
      Статус SignatureStatus (IN_PROGRESS, COMPLETED, FAILED) введён как технический
      статус операции подписания; бизнес-статусы пакета и документа не изменяются
      и берутся из модели `knowledge/business rules.md`.
    rationale: |
      Модель бизнес-статусов не описывает операцию подписания как отдельную сущность,
      но AC-02 и BR-DOC-05 требуют отслеживать результат и повторную попытку.
      Введение статуса обосновано и не подменяет статус документа.
    affected: SignatureStatus, x-state-machine.signature
  - id: A-09
    statement: |
      Идемпотентность хранится 24 часа; ключ обязателен для всех изменяющих операций.
    rationale: Снижает риск дублирования бизнес-операций при повторной доставке (GEN-06).
    affected: Idempotency-Key, x-idempotency
  - id: A-10
    statement: |
      Webhook-уведомления необязательны: при отсутствии webhookUrl партнёр использует
      опрос состояния. Доставка выполняется не более 8 попыток в течение 24 часов.
    rationale: Позволяет подключать партнёров с разным уровнем готовности и ограничивает нагрузку.
    affected: webhookUrl, PackageEvent, x-webhook-delivery
  - id: A-11
    statement: |
      Отмена пакета партнёром и независимая проверка подписи находятся вне границ
      контракта; статус CANCELLED и проверка подписи обеспечиваются внутренними
      процессами сервиса.
    rationale: DoD требует только операции сценария подписания пакета.
    affected: PackageStatus.CANCELLED, DocumentStatus.CANCELLED, OQ-09, OQ-10

  - id: A-12
    statement: |
      Ограничения частоты запросов: 600 запросов в минуту для системы партнёра,
      120 — для клиентского токена, 60 — для передачи содержимого. Значения
      предварительные и настраиваются на стороне шлюза.
    rationale: Ограничивает риск исчерпания ресурсов и согласуется с типовыми квотами партнёрских интеграций (OWASP API4).
    affected: x-rate-limits, ответ 429, заголовки RateLimit-*

x-requirements-traceability:
  source: Jira SCRUM-2140, критерии приёмки AC-01 — AC-07
  items:
    - id: AC-01
      requirement: Клиент получает доступ только к назначенному пакету, видит список документов, статус каждого документа и может просмотреть содержимое до подписания
      implementation:
        - GET /signing-packages/{packageId} — состав пакета и статус каждого документа
        - GET /signing-packages/{packageId}/documents/{documentId}/content — просмотр содержимого (variant=ORIGINAL)
        - Проверка clientId пакета против субъекта токена, иначе 404 PACKAGE_NOT_FOUND
      schemas:
        - SigningPackage
        - PackageDocument
        - DocumentStatus
    - id: AC-02
      requirement: Подписание документа при подтверждении клиента с проверкой сертификата и целостности, сохранением результата и фиксацией времени
      implementation:
        - POST /signing-packages/{packageId}/documents/{documentId}/signatures — проверки и запуск операции
        - GET /signatures/{signatureId} — результат операции, сертификат и время подписания
        - 403 CERTIFICATE_OWNER_MISMATCH, 409 CERTIFICATE_NOT_ACTIVE, 409 CERTIFICATE_EXPIRED, 409 DOCUMENT_CONTENT_MISMATCH
      schemas:
        - CreateSignatureRequest
        - Signature
        - CertificateSnapshot
        - SignatureStatus
    - id: AC-03
      requirement: Без явного подтверждения криптографическая операция не выполняется; просмотр документа подписанием не является
      implementation:
        - Обязательное поле confirmed=true в CreateSignatureRequest (const true), иначе 422 CONFIRMATION_REQUIRED
        - GET-операции просмотра не изменяют состояние и не создают подпись
        - contentSha256 в запросе связывает подпись с просмотренной версией содержимого
      schemas:
        - CreateSignatureRequest
    - id: AC-04
      requirement: При частичном подписании подписанные документы получают SIGNED, остальные сохраняют статусы, пакет получает PARTIALLY_SIGNED
      implementation:
        - Переход пакета IN_PROGRESS → PARTIALLY_SIGNED при подписании части обязательных документов
        - Счётчики SigningPackageSummary позволяют определить завершённые и незавершённые части
        - Событие PACKAGE_PARTIALLY_SIGNED
      schemas:
        - PackageStatus
        - SigningPackageSummary
        - PackageEventType
    - id: AC-05
      requirement: После подписания всех обязательных документов пакет получает SIGNED, фиксируется время завершения, партнёр уведомляется, клиент получает доступ к результатам
      implementation:
        - Переход IN_PROGRESS/PARTIALLY_SIGNED → SIGNED, фиксация completedAt
        - Webhook PACKAGE_SIGNED
        - GET /signing-packages/{packageId}/result и GET .../content?variant=SIGNED
      schemas:
        - PackageResult
        - PackageEvent
    - id: AC-06
      requirement: Явный отказ фиксируется, пакет получает REJECTED, неподписанные документы получают конечный статус, партнёр получает информацию об отказе; подписанные документы не изменяются
      implementation:
        - POST /signing-packages/{packageId}/rejections (confirmed=true, причина отказа)
        - Документы PENDING_SIGNATURE → REJECTED; документы SIGNED сохраняют подпись и время
        - Webhook PACKAGE_REJECTED, ответ Rejection.affectedDocuments
      schemas:
        - CreateRejectionRequest
        - Rejection
        - RejectionDocument
    - id: AC-07
      requirement: По истечении срока подписания пакет получает EXPIRED, дальнейшее подписание запрещено, время истечения фиксируется, партнёр уведомляется
      implementation:
        - expiresAt задаётся при отправке пакета (SubmitSigningPackageRequest)
        - Переходы в EXPIRED из PENDING_SIGNATURE, IN_PROGRESS, PARTIALLY_SIGNED; фиксация expiredAt
        - Подписание после истечения — 409 PACKAGE_EXPIRED; webhook PACKAGE_EXPIRED
      schemas:
        - SubmitSigningPackageRequest
        - PackageStatus
        - PackageResult

