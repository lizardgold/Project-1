  /signing-packages/{packageId}/documents/{documentId}/content:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/XRequestId'
    put:
      tags:
        - Документы
      summary: Загрузить содержимое документа
      description: |
        Загружает содержимое документа. Допускается только в состоянии пакета
        `DRAFT` и только для документов в состоянии `PENDING_UPLOAD` или
        `UPLOADED`; повторная загрузка заменяет содержимое и пересчитывает
        контрольную сумму.

        Сервис сверяет переданный `X-Content-SHA256` с фактической суммой
        содержимого. Несовпадение — `400 CHECKSUM_MISMATCH`; размер больше
        лимита — `413 PAYLOAD_TOO_LARGE`. После проверки документ переходит в
        `READY`.

        Частичная загрузка и возобновление (`Content-Range`) в первой версии
        не поддерживаются и зафиксированы как открытый вопрос.
      operationId: uploadDocumentContent
      security:
        - partnerOAuth:
            - signing-packages:write
      parameters:
        - name: X-Content-SHA256
          in: header
          required: true
          description: |
            SHA-256 содержимого в нижнем шестнадцатеричном регистре. Должен
            совпадать с `sha256`, указанным при создании пакета, и с фактически
            переданными байтами.
          schema:
