tags:
  - name: Пакеты документов
    description: Создание, просмотр, отправка на подписание и отмена пакета
  - name: Документы
    description: Загрузка и получение содержимого документов пакета
  - name: Подписание клиентом
    description: Инициирование, подтверждение и отклонение подписания
  - name: Результаты
    description: Получение состояния и результата обработки пакета
security:
  - partnerOAuth:
      - signing-packages:write
paths:
  /signing-packages:
    post:
      tags:
        - Пакеты документов
      summary: Создать пакет документов
      description: |
        Создаёт пакет в состоянии `DRAFT` с полным составом документов.
        Состав фиксируется в момент создания: добавление и удаление документов
        после создания не поддерживается — для изменения состава пакет
        отменяется и создаётся заново.

        Сервис присваивает `packageId` и `documentId` каждому документу.
        Содержимое документов загружается отдельными запросами, после чего
        пакет отправляется на подписание через `submit`.

        Повторный запрос с тем же `Idempotency-Key` и тем же телом возвращает
        ранее созданный пакет и заголовок `Idempotent-Replayed: true`.
        Повтор с другим телом завершается `409 IDEMPOTENCY_KEY_REUSED`.
        Повторное использование `externalRequestId` в пределах партнёра
        завершается `409 DUPLICATE_EXTERNAL_REQUEST_ID`.
      operationId: createSigningPackage
      security:
        - partnerOAuth:
            - signing-packages:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSigningPackageRequest'
            example:
              externalRequestId: BNK-2026-000458
              clientId: client-8f3a2c
              title: Кредитный пакет № 458
              callbackUrl: https://partner.example.com/hooks/podpis-online
              expiresAt: '2026-11-05T18:00:00Z'
              documents:
                - partnerDocumentId: DOC-458-01
                  fileName: Кредитный договор № 458.pdf
                  mimeType: application/pdf
                  sizeBytes: 245760
                  sha256: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
                - partnerDocumentId: DOC-458-02
                  fileName: График платежей.pdf
                  mimeType: application/pdf
                  sizeBytes: 81920
                  sha256: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809
      responses:
        '201':
          description: Пакет создан
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningPackage'
              example:
                packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                externalRequestId: BNK-2026-000458
                clientId: client-8f3a2c
                title: Кредитный пакет № 458
                status: DRAFT
                signatureType: UKEP
                version: 1
                createdAt: '2026-10-29T12:00:00Z'
                updatedAt: '2026-10-29T12:00:00Z'
                expiresAt: '2026-11-05T18:00:00Z'
                notificationsEnabled: true
                summary:
                  documentsTotal: 2
                  documentsSigned: 0
                  documentsFailed: 0
                documents:
                  - documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    partnerDocumentId: DOC-458-01
                    sequence: 1
                    fileName: Кредитный договор № 458.pdf
                    mimeType: application/pdf
                    sizeBytes: 245760
                    sha256: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
                    status: PENDING_UPLOAD
                  - documentId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                    partnerDocumentId: DOC-458-02
                    sequence: 2
                    fileName: График платежей.pdf
                    mimeType: application/pdf
                    sizeBytes: 81920
                    sha256: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809
                    status: PENDING_UPLOAD
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
        - Пакеты документов
      summary: Получить список пакетов
      description: |
        Возвращает пакеты, доступные системе партнёра, с постраничной
        пагинацией по курсору. Список не содержит содержимого документов.
        Сортировка — по `createdAt` по убыванию.
      operationId: listSigningPackages
      security:
        - partnerOAuth:
            - signing-packages:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          description: |
            Фильтр по статусу пакета. Если параметр не указан, возвращаются
            пакеты во всех статусах.
          schema:
            $ref: '#/components/schemas/PackageStatus'
        - name: externalRequestId
          in: query
          required: false
          description: Фильтр по внешнему идентификатору запроса партнёра
          schema:
            type: string
            maxLength: 64
            example: BNK-2026-000458
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Страница списка пакетов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningPackagePage'
              example:
                items:
                  - packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                    externalRequestId: BNK-2026-000458
                    clientId: client-8f3a2c
                    title: Кредитный пакет № 458
                    status: SIGNED
                    createdAt: '2026-10-29T12:00:00Z'
                    updatedAt: '2026-10-29T12:07:30Z'
                    completedAt: '2026-10-29T12:07:30Z'
                    documentsTotal: 2
                    documentsSigned: 2
                    documentsFailed: 0
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /signing-packages/{packageId}:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/XRequestId'
    get:
      tags:
        - Пакеты документов
      summary: Получить пакет документов
      description: |
        Возвращает пакет, состав документов и агрегированные счётчики.
        Ответ содержит `ETag`, который используется в `If-Match` при `submit`
        и `cancel`.

        Если пакет принадлежит другому партнёру, возвращается `404`, а не `403`,
        чтобы не раскрывать существование пакета.
      operationId: getSigningPackage
      security:
        - partnerOAuth:
            - signing-packages:read
        - clientOAuth:
            - signing-packages:read
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: |
            Значение `ETag` из предыдущего ответа. Если ресурс не изменился,
            возвращается `304 Not Modified` без тела.
          schema:
            type: string
            example: '"7"'
      responses:
        '200':
          description: Пакет документов
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningPackage'
              example:
                packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                externalRequestId: BNK-2026-000458
                clientId: client-8f3a2c
                title: Кредитный пакет № 458
                status: PENDING_CONFIRMATION
                statusReason: null
                signatureType: UKEP
                version: 3
                createdAt: '2026-10-29T12:00:00Z'
                updatedAt: '2026-10-29T12:01:10Z'
                submittedAt: '2026-10-29T12:01:10Z'
                expiresAt: '2026-11-05T18:00:00Z'
                completedAt: null
                activeSessionId: null
                notificationsEnabled: true
                summary:
                  documentsTotal: 2
                  documentsSigned: 0
                  documentsFailed: 0
                documents:
                  - documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    partnerDocumentId: DOC-458-01
                    sequence: 1
                    fileName: Кредитный договор № 458.pdf
                    mimeType: application/pdf
                    sizeBytes: 245760
                    sha256: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
                    status: READY
                    uploadedAt: '2026-10-29T12:00:40Z'
                  - documentId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                    partnerDocumentId: DOC-458-02
                    sequence: 2
                    fileName: График платежей.pdf
                    mimeType: application/pdf
                    sizeBytes: 81920
                    sha256: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809
                    status: READY
                    uploadedAt: '2026-10-29T12:00:52Z'
        '304':
          description: Ресурс не изменился с момента, указанного в `If-None-Match`
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /signing-packages/{packageId}/submit:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/XRequestId'
    post:
      tags:
        - Пакеты документов
      summary: Отправить пакет на подписание
      description: |
        Фиксирует состав пакета и переводит его из `DRAFT` в
        `PENDING_CONFIRMATION`. После успешного вызова состав изменить нельзя:
        допускается только подтверждение, отклонение или отмена пакета.

        Операция требует, чтобы все документы были загружены и проверены
        (`status = READY`). Если хотя бы один документ не готов, возвращается
        `422 DOCUMENTS_NOT_READY` со списком проблемных документов.

        Требуется заголовок `If-Match` с актуальным `ETag`: это защищает от
        отправки устаревшего состава. Несовпадение версии — `412 VERSION_MISMATCH`.
      operationId: submitSigningPackage
      security:
        - partnerOAuth:
            - signing-packages:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSigningPackageRequest'
            example:
              comment: Пакет сформирован для клиента branch MSK-12
      responses:
        '200':
          description: Пакет отправлен на подписание
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningPackage'
              example:
                packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                externalRequestId: BNK-2026-000458
                clientId: client-8f3a2c
                status: PENDING_CONFIRMATION
                signatureType: UKEP
                version: 4
                createdAt: '2026-10-29T12:00:00Z'
                updatedAt: '2026-10-29T12:03:00Z'
                submittedAt: '2026-10-29T12:03:00Z'
                expiresAt: '2026-11-05T18:00:00Z'
                notificationsEnabled: true
                summary:
                  documentsTotal: 2
                  documentsSigned: 0
                  documentsFailed: 0
                documents:
                  - documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    partnerDocumentId: DOC-458-01
                    sequence: 1
                    fileName: Кредитный договор № 458.pdf
                    mimeType: application/pdf
                    sizeBytes: 245760
                    sha256: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
                    status: READY
                    uploadedAt: '2026-10-29T12:00:40Z'
        '400':
          $ref: '#/components/responses/BadRequest'
