    ValidationIssue:
      type: object
      description: Замечание валидации по конкретному полю или документу
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: Путь к полю или элементу массива
          example: documents[1].sha256
        code:
          type: string
          description: Машиночитаемый код замечания
          example: PATTERN_MISMATCH
        message:
          type: string
          description: Описание замечания
          example: Ожидается 64 символа в нижнем шестнадцатеричном регистре
    Problem:
      type: object
      description: |
        Единая модель ошибки API. `retryable` показывает, допустим ли повтор
        того же запроса без изменения данных.
      required:
        - type
        - title
        - status
        - code
        - traceId
        - timestamp
        - retryable
      properties:
        type:
          type: string
          format: uri
          description: URI типа проблемы
          example: https://api.podpis-online.example/problems/validation-error
        title:
          type: string
          description: Краткое описание проблемы
          example: Ошибка валидации запроса
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP-код ответа
          example: 400
        code:
          type: string
          description: |
            Машиночитаемый код ошибки. Полный перечень и правила обработки —
            в `x-error-catalog`.
          enum:
            - MALFORMED_REQUEST
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - ACCESS_DENIED
            - IDEMPOTENCY_KEY_REQUIRED
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_KEY_IN_PROGRESS
            - DUPLICATE_EXTERNAL_REQUEST_ID
            - INVALID_CURSOR
            - PRECONDITION_REQUIRED
            - VERSION_MISMATCH
            - PACKAGE_NOT_FOUND
            - DOCUMENT_NOT_FOUND
            - SESSION_NOT_FOUND
            - PACKAGE_NOT_EDITABLE
            - INVALID_STATE_TRANSITION
            - PACKAGE_EXPIRED
            - DOCUMENTS_NOT_READY
            - DOCUMENT_LIMIT_EXCEEDED
            - PACKAGE_SIZE_EXCEEDED
            - UNSUPPORTED_DOCUMENT_FORMAT
            - EMPTY_DOCUMENT
            - CHECKSUM_MISMATCH
            - UNSUPPORTED_MEDIA_TYPE
            - PAYLOAD_TOO_LARGE
            - DOCUMENT_NOT_SIGNED
            - ACTIVE_SESSION_EXISTS
            - INVALID_CONFIRMATION_CODE
            - SESSION_EXPIRED
            - SESSION_BLOCKED
            - INVALID_SESSION_STATE
            - CLIENT_CERTIFICATE_NOT_FOUND
            - CLIENT_CERTIFICATE_REVOKED
            - CLIENT_CERTIFICATE_EXPIRED
            - RATE_LIMIT_EXCEEDED
            - INTERNAL_ERROR
            - SIGNING_PROVIDER_ERROR
            - SIGNING_PROVIDER_TIMEOUT
            - SERVICE_UNAVAILABLE
            - GATEWAY_TIMEOUT
          example: VALIDATION_ERROR
        detail:
          type: string
          minLength: 1
          maxLength: 2000
          description: Уточняющее описание причины ошибки
          example: Поле documents[1].sha256 не соответствует формату SHA-256
        traceId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор запроса для обращения в поддержку
          example: req-20261029-000458
        timestamp:
          type: string
          format: date-time
          description: Время формирования ответа об ошибке
          example: '2026-10-29T12:00:00Z'
        retryable:
          type: boolean
          description: Допустим ли автоматический повтор того же запроса
          example: false
        issues:
          type: array
          description: Замечания валидации по полям и документам
          items:
            $ref: '#/components/schemas/ValidationIssue'
