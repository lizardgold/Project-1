            pattern: '^[a-f0-9]{64}$'
            example: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
      requestBody:
        required: true
        description: Содержимое документа в формате PDF
