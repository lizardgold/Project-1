        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
        - Документы
      summary: Скачать содержимое документа
      description: |
        Возвращает исходное или подписанное содержимое документа. Вариант
        `SIGNED` доступен только для документов в состоянии `SIGNED`; для
        остальных возвращается `409 DOCUMENT_NOT_SIGNED`.

        Доступ к содержимому проверяется по тем же правилам, что и доступ к
        пакету: партнёр видит только свои пакеты, клиент — только пакеты со
        своим `clientId`.
      operationId: downloadDocumentContent
      security:
        - partnerOAuth:
            - signing-packages:read
        - clientOAuth:
            - signing-packages:read
      parameters:
        - name: variant
          in: query
          required: false
          description: |
            Вариант содержимого: `ORIGINAL` — исходный документ, `SIGNED` —
            документ с электронной подписью. По умолчанию `ORIGINAL`.
          schema:
            type: string
            enum:
              - ORIGINAL
              - SIGNED
            default: ORIGINAL
            example: SIGNED
      responses:
        '200':
          description: Содержимое документа
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            ETag:
              $ref: '#/components/headers/ETag'
