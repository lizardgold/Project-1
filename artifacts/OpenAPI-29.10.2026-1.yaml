openapi: 3.0.3
info:
  title: ПодписьОнлайн — API подписания пакета документов
  version: '1.1.0'
  description: |
    API сервиса «ПодписьОнлайн» для подписания пакета документов усиленной
    квалифицированной электронной подписью (УКЭП) с подтверждением клиента.

    Источник требований — Jira SCRUM-2140 (эпик SCRUM-2139).

    ## Назначение и границы

    Сервис принимает от системы партнёра пакет документов и метаданные клиента,
    хранит исходные документы, предъявляет их клиенту в приложении партнёра,
    принимает подтверждение клиента, организует криптографическую операцию
    подписания через удостоверяющий центр (УЦ) или согласованный
    криптографический компонент и возвращает партнёру результат по каждому
    документу.

    В границы этого API не входят: выпуск сертификата клиента, аутентификация
    клиента в приложении партнёра, отзыв сертификата, проверка подписи как
    отдельная операция и хранение документов сверх срока, согласованного
    отдельными требованиями.

    ## Участники

    | Участник | Роль в сценарии |
    |---|---|
    | Система партнёра | Создаёт пакет, загружает документы, отправляет пакет на подписание, получает статусы и результат |
    | Приложение партнёра | Аутентифицирует клиента, показывает документы, инициирует и подтверждает подписание |
    | Клиент | Физическое лицо или индивидуальный предприниматель, подписывающий пакет |
    | «ПодписьОнлайн» | Оркестрирует сценарий, хранит документы, управляет состояниями и результатом |
    | УЦ / криптографический компонент | Выполняет криптографическую операцию и предоставляет сведения о сертификате |

    ## Основной сценарий

    1. Партнёр создаёт пакет с полным составом документов
       (`POST /signing-packages`) и получает `packageId` и `documentId` для
       каждого документа.
    2. Партнёр загружает содержимое документов
       (`PUT /signing-packages/{packageId}/documents/{documentId}/content`).
    3. Партнёр фиксирует состав и отправляет пакет на подписание
       (`POST /signing-packages/{packageId}/submit`); пакет переходит в
       `PENDING_CONFIRMATION`.
    4. Клиент в приложении партнёра открывает пакет
       (`GET /signing-packages/{packageId}`) и инициирует подписание
       (`POST /signing-packages/{packageId}/signing-sessions`).
    5. Сервис возвращает параметры подтверждения: маскированный получатель,
       срок действия сессии и число оставшихся попыток.
    6. Клиент подтверждает намерение (`POST /signing-sessions/{sessionId}/confirm`).
       Пакет переходит в `SIGNING`, подписание выполняется асинхронно.
    7. Партнёр отслеживает состояние пакета (`GET /signing-packages/{packageId}`,
       `GET /signing-packages/{packageId}/result`) или получает
       callback-уведомления, если указал `callbackUrl`.
    8. После завершения партнёр получает результат по каждому документу и может
       скачать подписанный файл (`GET .../content?variant=SIGNED`).

    Клиент может отказаться от подписания до начала криптографической операции
    (`POST /signing-sessions/{sessionId}/reject`). Партнёр может отменить пакет
    до подтверждения клиентом (`POST /signing-packages/{packageId}/cancel`).

    ## Состояния

    Пакет: `DRAFT` → `PENDING_CONFIRMATION` → `SIGNING` → `SIGNED` |
    `PARTIALLY_SIGNED` | `FAILED`; из `DRAFT` и `PENDING_CONFIRMATION` возможны
    `CANCELLED`, из `PENDING_CONFIRMATION` — `REJECTED` и `EXPIRED`.

    Документ: `PENDING_UPLOAD` → `UPLOADED` → `READY` → `SIGNING` → `SIGNED` |
    `FAILED`.

    Сессия подтверждения: `PENDING` → `CONFIRMED` | `REJECTED` | `EXPIRED` |
    `FAILED`.

    Агрегированный статус пакета не заменяет статусы документов: при частичном
    успехе пакет получает `PARTIALLY_SIGNED`, а результаты документов сохраняются
    независимо.

    ## Авторизация

    * Система партнёра — OAuth 2.0 Client Credentials; партнёр определяется по
      `client_id` токена, передача `partnerId` в запросе не предусмотрена.
    * Клиент — токен приложения партнёра, выпущенный по Authorization Code с
      PKCE; `sub` токена должен совпадать с `clientId` пакета.
    * Доступ к пакету проверяется по принадлежности партнёру и по связи
      `clientId` с субъектом токена. Знание идентификатора не даёт прав.
    * Код подтверждения, содержимое документов и персональные данные не
      попадают в журналы; код подтверждения не возвращается в ответах.

    ## Идемпотентность и повторная обработка

    Все изменяющие состояние POST-запросы требуют `Idempotency-Key`. Сервер
    хранит ключ и отпечаток запроса 24 часа: повтор с тем же ключом и тем же
    телом возвращает сохранённый ответ с `Idempotent-Replayed: true`, повтор с
    другим телом — `409 IDEMPOTENCY_KEY_REUSED`, параллельный запрос с тем же
    ключом — `409 IDEMPOTENCY_KEY_IN_PROGRESS`. Для `submit` и `cancel`
    дополнительно используется `If-Match` с `ETag` пакета.

    Повторное подтверждение уже подтверждённой сессии не запускает повторную
    криптографическую операцию, а возвращает текущее состояние.

    ## Ошибки и повторные попытки

    Все ошибки возвращаются в модели `Problem`: машиночитаемый `code`,
    `traceId`, время, признак `retryable` и, для ошибок валидации, список
    `issues`. Бизнес-ошибки (недопустимый переход, отсутствие сертификата,
    истёкший срок) отличаются от технических (недоступность УЦ, тайм-аут).

    Автоматически повторять допускается только ответы с `retryable: true`, с
    учётом `Retry-After`. При тайм-ауте подтверждения или ошибке
    криптографического компонента результат считается неизвестным: необходимо
    запросить состояние пакета, а не повторять подтверждение вслепую.

    ## Ограничения (предварительные)

    * Формат документов на первом этапе — PDF (`application/pdf`).
    * В пакете от 1 до 20 документов.
    * Размер документа — до 25 МиБ (26 214 400 байт), пакета — до 100 МиБ.
    * Ожидание подтверждения — 7 дней по умолчанию, не более 30 дней.
    * Сессия подтверждения — 15 минут, попыток ввода кода — 3.

    Значения являются рабочими допущениями и требуют подтверждения
    (см. `x-open-questions` и `x-assumptions`).
