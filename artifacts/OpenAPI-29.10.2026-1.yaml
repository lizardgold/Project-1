servers:
  - url: https://sandbox.api.podpisonline.example/v1
    description: Тестовый контур (фактический домен уточняется при регистрации интеграции)
  - url: https://api.podpisonline.example/v1
    description: Продуктивный контур (фактический домен уточняется при регистрации интеграции)
tags:
  - name: Пакеты документов
    description: Создание, просмотр, отправка на подписание и отмена пакета
  - name: Документы
    description: Загрузка и получение содержимого документов пакета
  - name: Подписание клиентом
    description: Инициирование, подтверждение и отклонение подписания клиентом
  - name: Результаты
    description: Получение статуса и результата обработки пакета
paths:
  /signing-packages:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
    post:
      tags:
        - Пакеты документов
      summary: Создать пакет документов
      operationId: createSigningPackage
      description: |
        Создаёт пакет в состоянии `DRAFT` и фиксирует перечень документов.
        Содержимое документов загружается отдельными запросами; состав пакета
        определяется массивом `documents` и не может быть расширен после
        создания — для изменения состава пакет отменяется и создаётся заново.

        `externalRequestId` уникален в пределах партнёра и используется для
        распознавания повторного создания. Запрос требует `Idempotency-Key`.
        Повторное создание с тем же `externalRequestId`, но другим ключом
        идемпотентности возвращает `409 DUPLICATE_EXTERNAL_REQUEST_ID`; для
        получения ранее созданного пакета используется
        `GET /signing-packages?externalRequestId=...`.

        При создании можно указать `callbackUrl` — тогда партнёр будет получать
        уведомления об изменении состояния пакета. Если `callbackUrl` не указан,
        партнёр использует опрос `GET /signing-packages/{packageId}`.
      security:
        - partnerOAuth:
            - signing-packages:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSigningPackageRequest'
            examples:
              creditPackage:
                summary: Пакет из двух документов
                value:
                  externalRequestId: BNK-2026-000458
                  clientId: client-8f3a2c
                  title: Кредитный пакет № 458
                  documents:
                    - partnerDocumentId: DOC-458-01
                      fileName: Кредитный договор № 458.pdf
                      mimeType: application/pdf
                      sizeBytes: 245760
                      sha256: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
                    - partnerDocumentId: DOC-458-02
                      fileName: График платежей.pdf
                      mimeType: application/pdf
                      sizeBytes: 98304
                      sha256: b4d1e8f2a6c30597e1f4a7b0c3d6e9f21528374a6b9c0d3e6f9a2b5c8d1e4f70
                  callbackUrl: https://partner.example.com/hooks/podpis-online
                  expiresAt: '2026-11-05T18:00:00Z'
                  partnerMetadata:
                    branchId: MSK-12
                    productCode: CREDIT-2026
      responses:
        '201':
          description: Пакет создан
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningPackage'
              examples:
                draftPackage:
                  summary: Созданный пакет в состоянии DRAFT
                  value:
                    packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                    partnerId: partner-bank-01
                    externalRequestId: BNK-2026-000458
                    clientId: client-8f3a2c
                    title: Кредитный пакет № 458
                    status: DRAFT
                    signatureType: UKEP
                    documents:
                      - documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                        partnerDocumentId: DOC-458-01
                        sequence: 1
                        fileName: Кредитный договор № 458.pdf
                        mimeType: application/pdf
                        sizeBytes: 245760
                        sha256: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
                        status: PENDING
                        uploadedAt: null
                        signedAt: null
                      - documentId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                        partnerDocumentId: DOC-458-02
                        sequence: 2
                        fileName: График платежей.pdf
                        mimeType: application/pdf
                        sizeBytes: 98304
                        sha256: b4d1e8f2a6c30597e1f4a7b0c3d6e9f21528374a6b9c0d3e6f9a2b5c8d1e4f70
                        status: PENDING
                        uploadedAt: null
                        signedAt: null
                    summary:
                      documentsTotal: 2
                      documentsSigned: 0
                      documentsFailed: 0
                      documentsPending: 2
                      totalSizeBytes: 344064
                    createdAt: '2026-10-29T12:00:00Z'
                    updatedAt: '2026-10-29T12:00:00Z'
                    submittedAt: null
                    expiresAt: '2026-11-05T18:00:00Z'
                    completedAt: null
                    version: 1
                    activeSessionId: null
                    notificationsEnabled: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      callbacks:
        packageStatusChanged:
          '{$request.body#/callbackUrl}':
            post:
              tags:
                - Пакеты документов
              summary: Уведомление партнёра об изменении статуса пакета
              operationId: onPackageStatusChanged
              description: |
                Callback вызывается сервисом «ПодписьОнлайн» при переходе пакета
                в значимое состояние: `PENDING_CONFIRMATION`, `SIGNING`,
                `SIGNED`, `PARTIALLY_SIGNED`, `FAILED`, `REJECTED`, `EXPIRED`,
                `CANCELLED`.

                Уведомление не является заменой опроса: партнёр должен уметь
                восстановить состояние через `GET /signing-packages/{packageId}`.
                Повторная доставка возможна; партнёр обязан распознавать события
                по `X-Webhook-Event-Id` и обрабатывать их идемпотентно.

                Подпись уведомления: HMAC-SHA256 от строки
                `<X-Webhook-Timestamp>.<сырое тело>` с секретом партнёра,
                результат в `X-Webhook-Signature` в формате `t=<timestamp>,v1=<hex>`.
                Партнёр должен проверить подпись и отклонить уведомление с
                неверной подписью. Ответ партнёра — 2XX в течение 5 секунд.
                При 4XX/5XX или тайм-ауте выполняются повторные попытки:
                1 мин, 5 мин, 15 мин, 30 мин, 1 ч, 3 ч.
              parameters:
                - $ref: '#/components/parameters/WebhookEventId'
                - $ref: '#/components/parameters/WebhookTimestamp'
                - $ref: '#/components/parameters/WebhookSignature'
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/PackageEvent'
                    examples:
                      packageSigned:
                        summary: Все документы подписаны
                        value:
                          eventId: f6a7b8c9-d0e1-4f2a-9b3c-4d5e6f708192
                          eventType: package.signed
                          occurredAt: '2026-10-29T12:07:30Z'
                          packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                          packageStatus: SIGNED
                          externalRequestId: BNK-2026-000458
                          signatureType: UKEP
                          resultAvailable: true
                          documents:
                            - documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                              partnerDocumentId: DOC-458-01
                              status: SIGNED
                              errorCode: null
                            - documentId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                              partnerDocumentId: DOC-458-02
                              status: SIGNED
                              errorCode: null
                          summary:
                            documentsTotal: 2
                            documentsSigned: 2
                            documentsFailed: 0
                            documentsPending: 0
                            totalSizeBytes: 344064
              responses:
                '2XX':
                  description: Уведомление принято партнёром
                '4XX':
                  description: Уведомление отклонено; сервис выполнит повторную доставку
                '5XX':
                  description: Ошибка на стороне партнёра; сервис выполнит повторную доставку
    get:
      tags:
        - Пакеты документов
      summary: Получить список пакетов
      operationId: listSigningPackages
      description: |
        Возвращает пакеты текущего партнёра с курсорной пагинацией. Доступны
        фильтры по состоянию, внешнему идентификатору запроса, клиенту и дате
        создания. Список не содержит содержимого документов и предназначен для
        мониторинга и сверки.
      security:
        - partnerOAuth:
            - signing-packages:read
      parameters:
        - name: status
          in: query
          required: false
          description: Фильтр по одному или нескольким состояниям пакета
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PackageStatus'
          example:
            - PENDING_CONFIRMATION
            - SIGNING
        - name: externalRequestId
          in: query
          required: false
          description: Внешний идентификатор запроса партнёра
          schema:
            type: string
            maxLength: 64
        - name: clientId
          in: query
