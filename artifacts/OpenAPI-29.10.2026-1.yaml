    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/XRequestId'
    post:
      tags:
        - Подписание клиентом
      summary: Отклонить подписание пакета
      description: |
        Фиксирует отказ клиента от подписания. Сессия переходит в `REJECTED`,
        пакет — в `REJECTED`; криптографическая операция не выполняется.

        Отклонить можно только сессию в состоянии `PENDING`. Для сессии в
        `CONFIRMED` возвращается `409 INVALID_SESSION_STATE`: отмена уже
        запущенного подписания не поддерживается.
      operationId: rejectSigningSession
      security:
        - clientOAuth:
            - signing-sessions:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectSigningSessionRequest'
            example:
              reason: Клиент не согласен с условиями документа
      responses:
        '200':
          description: Подписание отклонено клиентом
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSession'
              example:
                sessionId: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
                packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                status: REJECTED
                packageStatus: REJECTED
                confirmationMethod: SMS_OTP
                createdAt: '2026-10-29T12:02:00Z'
                expiresAt: '2026-10-29T12:17:00Z'
                completedAt: '2026-10-29T12:04:10Z'
                version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    partnerOAuth:
      type: oauth2
      description: |
        Машинная авторизация системы партнёра по OAuth 2.0 Client Credentials.
        Партнёр определяется по `client_id` токена; передача `partnerId` в
        запросах не предусмотрена. Для межсистемного канала рекомендуется
        mTLS — обязательность согласуется отдельно.
      flows:
        clientCredentials:
          tokenUrl: https://auth.podpis-online.example/oauth2/token
          scopes:
            'signing-packages:read': Чтение пакетов, документов и результата
            'signing-packages:write': Создание, загрузка документов, отправка и отмена пакета
    clientOAuth:
      type: oauth2
      description: |
        Токен клиента выпускается приложением партнёра по Authorization Code с
        PKCE после аутентификации клиента. `sub` токена должен совпадать с
        `clientId` пакета. Сервис проверяет подпись, `iss`, `aud`, срок действия
        и scopes.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.podpis-online.example/oauth2/authorize
          tokenUrl: https://auth.podpis-online.example/oauth2/token
          scopes:
            'signing-packages:read': Просмотр пакета и документов клиентом
            'signing-sessions:read': Просмотр состояния сессии подписания
            'signing-sessions:write': Инициирование, подтверждение и отклонение подписания
  parameters:
    PackageId:
      name: packageId
      in: path
      required: true
      description: Идентификатор пакета документов
      schema:
        type: string
        format: uuid
        example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Идентификатор документа в составе пакета
      schema:
        type: string
        format: uuid
        example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Идентификатор сессии подтверждения подписания
      schema:
        type: string
        format: uuid
        example: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Ключ идемпотентности изменяющей операции. Уникален в пределах партнёра.
        Повтор с тем же ключом и телом возвращает сохранённый ответ, повтор с
        другим телом — `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
        example: 3f6b1c2d-8e9a-4b7c-9d1e-2f3a4b5c6d7e
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Идентификатор запроса для сквозной трассировки. Если не передан,
        сервис формирует значение самостоятельно и возвращает его в `traceId`
        ответа об ошибке.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        example: req-20261029-000458
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Значение `ETag`, полученное при чтении пакета. Защищает от изменения
        состояния по устаревшим данным. Несовпадение версии —
        `412 VERSION_MISMATCH`; отсутствие заголовка — `428 PRECONDITION_REQUIRED`.
      schema:
        type: string
        example: '"3"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Курсор следующей страницы, полученный в предыдущем ответе. Непрозрачная
        строка; при некорректном значении возвращается `400 INVALID_CURSOR`.
      schema:
        type: string
        maxLength: 512
        example: eyJjcmVhdGVkQXQiOiIyMDI2LTEwLTI5VDEyOjAwOjAwWiJ9
    Limit:
      name: limit
      in: query
      required: false
      description: Максимальное число элементов страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
  headers:
    Location:
      description: Абсолютный или относительный URL созданного ресурса
      schema:
        type: string
        format: uri-reference
        example: /v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
    ETag:
      description: |
        Версия ресурса в кавычках. Используется в `If-Match` и `If-None-Match`.
      schema:
        type: string
        example: '"3"'
    IdempotentReplayed:
      description: |
        `true`, если ответ повторно возвращён по ранее обработанному
        `Idempotency-Key`; в этом случае тело ответа сохранено без изменений.
      schema:
        type: boolean
        example: true
    ContentDisposition:
      description: Имя файла для сохранения содержимого документа
      schema:
        type: string
        example: attachment; filename="Kreditnyj dogovor 458.pdf"
  responses:
    BadRequest:
      description: |
        Некорректный запрос: нарушен синтаксис, отсутствует обязательный
        заголовок, не совпала контрольная сумма или указан неверный код
        подтверждения. Повтор без изменения запроса не поможет.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/validation-error
            title: Ошибка валидации запроса
            status: 400
            code: VALIDATION_ERROR
            detail: Поле documents[1].sha256 не соответствует формату SHA-256
            traceId: req-20261029-000458
            timestamp: '2026-10-29T12:00:00Z'
            retryable: false
            issues:
              - field: documents[1].sha256
                code: PATTERN_MISMATCH
                message: Ожидается 64 символа в нижнем шестнадцатеричном регистре
    Unauthorized:
      description: |
        Токен отсутствует, истёк или не прошёл проверку подписи. Требуется
        получить новый токен; повтор с тем же токеном не поможет.
      headers:
        WWW-Authenticate:
          description: Схема и параметры авторизации
          schema:
            type: string
            example: Bearer realm="podpis-online", error="invalid_token"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/unauthorized
            title: Не пройдена аутентификация
            status: 401
            code: UNAUTHENTICATED
            detail: Срок действия токена истёк
            traceId: req-20261029-000459
            timestamp: '2026-10-29T12:00:05Z'
            retryable: false
    Forbidden:
      description: |
        Аутентификация пройдена, но у инициатора нет прав на операцию с этим
        объектом: другой партнёр, чужой клиент или недостаточный scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/access-denied
            title: Операция запрещена
            status: 403
            code: ACCESS_DENIED
            detail: У токена отсутствует scope signing-packages:write
            traceId: req-20261029-000460
            timestamp: '2026-10-29T12:00:10Z'
            retryable: false
    NotFound:
      description: |
        Объект не найден или недоступен инициатору. Сервис не раскрывает
        существование чужих пакетов, документов и сессий.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/not-found
            title: Объект не найден
            status: 404
            code: PACKAGE_NOT_FOUND
            detail: Пакет с указанным идентификатором не найден
            traceId: req-20261029-000461
            timestamp: '2026-10-29T12:00:15Z'
            retryable: false
    Conflict:
      description: |
        Конфликт состояния или повторной обработки: недопустимый переход,
        активная сессия, повтор ключа идемпотентности, дублирование
        `externalRequestId`, истёкший срок или заблокированная сессия.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidTransition:
              summary: Недопустимый переход состояния
              value:
                type: https://api.podpis-online.example/problems/invalid-state
                title: Недопустимый переход состояния
                status: 409
                code: INVALID_STATE_TRANSITION
                detail: 'Отмена невозможна: пакет находится в состоянии SIGNING'
                traceId: req-20261029-000462
                timestamp: '2026-10-29T12:00:20Z'
                retryable: false
            idempotencyReused:
              summary: Ключ идемпотентности использован с другим телом
              value:
                type: https://api.podpis-online.example/problems/idempotency-reused
                title: Конфликт ключа идемпотентности
                status: 409
                code: IDEMPOTENCY_KEY_REUSED
                detail: Ключ уже использован с другим телом запроса
                traceId: req-20261029-000463
                timestamp: '2026-10-29T12:00:25Z'
                retryable: false
    PreconditionFailed:
      description: |
        `If-Match` не совпал с текущей версией ресурса: пакет изменён другим
        запросом. Требуется перечитать пакет и повторить операцию с актуальным
        `ETag`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/version-mismatch
            title: Версия ресурса устарела
            status: 412
            code: VERSION_MISMATCH
            detail: Ожидалась версия 4, текущая версия 5
            traceId: req-20261029-000464
            timestamp: '2026-10-29T12:00:30Z'
            retryable: false
    PreconditionRequired:
      description: |
        Для операции требуется заголовок `If-Match`: сервис не выполняет
        изменение состояния без проверки версии ресурса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/precondition-required
            title: Требуется проверка версии
            status: 428
            code: PRECONDITION_REQUIRED
            detail: Заголовок If-Match обязателен для этой операции
            traceId: req-20261029-000473
            timestamp: '2026-10-29T12:01:15Z'
            retryable: false
    BadGateway:
      description: |
        Внешняя система (УЦ, криптографический компонент, провайдер
        идентификации) вернула ошибку. Результат операции может быть
        неизвестен; перед повтором следует запросить состояние пакета.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/bad-gateway
            title: Ошибка внешней системы
            status: 502
            code: SIGNING_PROVIDER_ERROR
            detail: Криптографический компонент вернул ошибку 5xx
            traceId: req-20261029-000474
            timestamp: '2026-10-29T12:01:20Z'
            retryable: true
    PayloadTooLarge:
      description: |
        Размер содержимого или пакета превышает согласованный лимит. Требуется
        уменьшить документ; повтор того же запроса не поможет.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/payload-too-large
            title: Превышен размер документа
            status: 413
            code: PAYLOAD_TOO_LARGE
            detail: Размер документа 31457280 байт превышает лимит 26214400 байт
            traceId: req-20261029-000465
            timestamp: '2026-10-29T12:00:35Z'
            retryable: false
    UnsupportedMediaType:
      description: |
        Передан неподдерживаемый MIME-тип содержимого. На первом этапе
        поддерживается только `application/pdf`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/unsupported-media-type
            title: Неподдерживаемый тип содержимого
            status: 415
            code: UNSUPPORTED_MEDIA_TYPE
            detail: Ожидается application/pdf, получен application/msword
            traceId: req-20261029-000466
            timestamp: '2026-10-29T12:00:40Z'
            retryable: false
    UnprocessableEntity:
      description: |
        Запрос синтаксически корректен, но нарушает бизнес-правила: лимиты
        состава, готовность документов, состояние сертификата клиента.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            documentsNotReady:
              summary: Не все документы готовы к отправке
              value:
                type: https://api.podpis-online.example/problems/documents-not-ready
                title: Документы не готовы
                status: 422
                code: DOCUMENTS_NOT_READY
                detail: Два документа не загружены
                traceId: req-20261029-000467
                timestamp: '2026-10-29T12:00:45Z'
                retryable: false
                issues:
                  - field: documents[1]
                    code: PENDING_UPLOAD
                    message: Содержимое документа не загружено
            certificateRevoked:
              summary: Сертификат клиента отозван
              value:
                type: https://api.podpis-online.example/problems/certificate-revoked
                title: Сертификат непригоден
                status: 422
                code: CLIENT_CERTIFICATE_REVOKED
                detail: Сертификат клиента отозван 20.10.2026
                traceId: req-20261029-000468
                timestamp: '2026-10-29T12:00:50Z'
                retryable: false
    TooManyRequests:
      description: |
        Превышен согласованный лимит частоты запросов. Повтор возможен после
        задержки, указанной в `Retry-After`.
      headers:
        Retry-After:
          description: Задержка перед повтором в секундах
          schema:
            type: integer
            minimum: 1
            example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/rate-limit
            title: Превышен лимит запросов
            status: 429
            code: RATE_LIMIT_EXCEEDED
            detail: Превышено 600 запросов в минуту для client_id
            traceId: req-20261029-000469
            timestamp: '2026-10-29T12:00:55Z'
            retryable: true
    InternalServerError:
      description: |
        Внутренняя ошибка сервиса. Запрос может быть повторён с тем же
        `Idempotency-Key`; повторная бизнес-операция при этом не создаётся.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/internal-error
            title: Внутренняя ошибка
            status: 500
            code: INTERNAL_ERROR
            detail: Непредвиденная ошибка обработки запроса
            traceId: req-20261029-000470
            timestamp: '2026-10-29T12:01:00Z'
            retryable: true
    GatewayTimeout:
      description: |
        Криптографический компонент или УЦ не ответил за отведённое время.
        Результат операции неизвестен: необходимо запросить состояние пакета,
        а не повторять подтверждение вслепую.
      headers:
        Retry-After:
          description: Рекомендуемая задержка перед проверкой состояния
          schema:
            type: integer
            minimum: 1
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/gateway-timeout
            title: Тайм-аут внешней системы
            status: 504
            code: SIGNING_PROVIDER_TIMEOUT
            detail: УЦ не ответил за 30 секунд; результат подписания неизвестен
            traceId: req-20261029-000471
            timestamp: '2026-10-29T12:01:05Z'
            retryable: true
    ServiceUnavailable:
      description: |
        Сервис или его зависимость временно недоступны. Операция не выполнена;
        повтор возможен после задержки из `Retry-After`.
      headers:
        Retry-After:
          description: Задержка перед повтором в секундах
          schema:
            type: integer
            minimum: 1
            example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.podpis-online.example/problems/service-unavailable
            title: Сервис временно недоступен
            status: 503
            code: SERVICE_UNAVAILABLE
            detail: Криптографический компонент на плановом обслуживании
            traceId: req-20261029-000472
            timestamp: '2026-10-29T12:01:10Z'
            retryable: true
  schemas:
    PackageStatus:
      type: string
      description: |
        Состояние пакета документов. Терминальные состояния: `SIGNED`,
        `PARTIALLY_SIGNED`, `REJECTED`, `CANCELLED`, `EXPIRED`, `FAILED`.
      enum:
        - DRAFT
        - PENDING_CONFIRMATION
        - SIGNING
        - SIGNED
        - PARTIALLY_SIGNED
        - REJECTED
        - CANCELLED
        - EXPIRED
        - FAILED
      example: SIGNED
    DocumentStatus:
      type: string
      description: |
        Состояние отдельного документа. `SIGNED` и `FAILED` — терминальные;
        при частичном успехе пакета статусы документов различаются.
      enum:
        - PENDING_UPLOAD
        - UPLOADED
        - READY
        - SIGNING
        - SIGNED
        - FAILED
      example: SIGNED
    SessionStatus:
      type: string
      description: Состояние сессии подтверждения подписания
      enum:
        - PENDING
        - CONFIRMED
        - REJECTED
        - EXPIRED
        - FAILED
      example: CONFIRMED
    ConfirmationMethod:
      type: string
      description: |
        Канал подтверждения намерения клиента. `SMS_OTP` — одноразовый код по
        SMS, `PUSH_APP` — подтверждение в приложении партнёра. Целевой механизм
        требует согласования (OQ-01).
      enum:
        - SMS_OTP
        - PUSH_APP
      example: SMS_OTP
    SignatureType:
      type: string
      description: Вид электронной подписи, применяемый к документам пакета
      enum:
        - UKEP
      example: UKEP
    DocumentMetadata:
      type: object
      description: Описание документа при создании пакета
      required:
        - fileName
        - mimeType
        - sizeBytes
        - sha256
      properties:
        partnerDocumentId:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Идентификатор документа в системе партнёра. Уникален в пределах
            пакета; используется для сопоставления результата.
          example: DOC-458-01
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Имя файла для отображения клиенту; сервер не использует его как путь
          example: Кредитный договор № 458.pdf
        mimeType:
          type: string
          enum:
            - application/pdf
          description: MIME-тип содержимого документа
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
          description: Ожидаемый размер содержимого в байтах
          example: 245760
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Ожидаемая контрольная сумма содержимого
          example: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
    Document:
      type: object
      description: Документ в составе пакета и результат его обработки
      required:
        - documentId
        - sequence
        - fileName
        - mimeType
        - sizeBytes
        - sha256
        - status
      properties:
        documentId:
          type: string
          format: uuid
          description: Идентификатор документа, присвоенный сервисом
          example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        partnerDocumentId:
          type: string
          minLength: 1
          maxLength: 64
          nullable: true
          description: Идентификатор документа в системе партнёра
          example: DOC-458-01
        sequence:
          type: integer
          minimum: 1
          maximum: 20
          description: Порядковый номер документа в пакете
          example: 1
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Имя файла для отображения
          example: Кредитный договор № 458.pdf
        mimeType:
          type: string
          enum:
            - application/pdf
          description: MIME-тип содержимого
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
          description: Размер содержимого в байтах
          example: 245760
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Контрольная сумма исходного содержимого
          example: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
        status:
          $ref: '#/components/schemas/DocumentStatus'
        uploadedAt:
          type: string
          format: date-time
          nullable: true
          description: Время загрузки содержимого; null, если содержимое не загружено
          example: '2026-10-29T12:00:40Z'
        signedAt:
          type: string
          format: date-time
          nullable: true
          description: Время успешного подписания; null, если документ не подписан
          example: '2026-10-29T12:07:12Z'
        signature:
          allOf:
            - $ref: '#/components/schemas/DocumentSignature'
          description: Данные подписи; отсутствуют, если документ не подписан
        error:
          allOf:
            - $ref: '#/components/schemas/DocumentError'
          description: Ошибка обработки документа; отсутствует, если ошибки нет
    DocumentSignature:
      type: object
      description: Данные электронной подписи документа
      required:
        - signatureType
        - signatureFormat
        - signedAt
        - certificate
        - signedContentSha256
      properties:
        signatureType:
          $ref: '#/components/schemas/SignatureType'
        signatureFormat:
          type: string
          description: |
            Формат подписи. `PAdES-BES` — подпись встроена в PDF. Конкретный
            формат требует согласования с УЦ (OQ-02).
          enum:
            - PAdES-BES
            - CAdES-BES
          example: PAdES-BES
        signedAt:
          type: string
          format: date-time
          description: Время формирования подписи
          example: '2026-10-29T12:07:12Z'
        certificate:
          $ref: '#/components/schemas/CertificateInfo'
        signedContentSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Контрольная сумма подписанного содержимого
          example: 7d1e2f3a4b5c6d7e8f901a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f
    CertificateInfo:
      type: object
      description: Сведения о сертификате ключа проверки электронной подписи
      required:
        - serialNumber
        - subject
        - issuer
        - validFrom
        - validTo
      properties:
        serialNumber:
          type: string
          description: Серийный номер сертификата
          example: 01A2B3C4D5E6F7089A
        subject:
          type: string
          description: Владелец сертификата в формате RFC 4514
          example: CN=Иванов Иван Иванович, O=ООО «Клиент»
        issuer:
          type: string
          description: Издатель сертификата в формате RFC 4514
          example: CN=УЦ ПодписьОнлайн, O=АО «УЦ»
        validFrom:
          type: string
          format: date-time
          description: Начало срока действия сертификата
          example: '2025-12-01T00:00:00Z'
        validTo:
          type: string
          format: date-time
          description: Окончание срока действия сертификата
          example: '2026-12-01T00:00:00Z'
    DocumentError:
      type: object
      description: Ошибка обработки отдельного документа
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          description: Код ошибки из каталога `x-error-catalog`
          example: SIGNING_PROVIDER_TIMEOUT
        message:
          type: string
          description: Описание ошибки для журнала и поддержки
          example: Криптографический компонент не ответил за отведённое время
        retryable:
          type: boolean
          description: Признак допустимости повторной обработки документа
          example: true
        occurredAt:
          type: string
          format: date-time
          nullable: true
          description: Время возникновения ошибки
          example: '2026-10-29T12:07:30Z'
    PackageSummary:
      type: object
      description: Агрегированные счётчики обработки пакета
      required:
        - documentsTotal
        - documentsSigned
        - documentsFailed
      properties:
        documentsTotal:
          type: integer
          minimum: 1
          maximum: 20
          description: Общее число документов в пакете
          example: 2
        documentsSigned:
          type: integer
          minimum: 0
          maximum: 20
          description: Число успешно подписанных документов
          example: 2
        documentsFailed:
          type: integer
          minimum: 0
          maximum: 20
          description: Число документов, обработка которых завершилась ошибкой
          example: 0
    SigningPackage:
      type: object
      description: Пакет документов и его текущее состояние
      required:
        - packageId
        - clientId
        - status
        - signatureType
        - documents
        - summary
        - createdAt
        - updatedAt
        - version
        - notificationsEnabled
      properties:
        packageId:
          type: string
          format: uuid
          description: Идентификатор пакета
          example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
        externalRequestId:
          type: string
          minLength: 1
          maxLength: 64
          description: Внешний идентификатор запроса партнёра
          example: BNK-2026-000458
        clientId:
          type: string
          minLength: 1
          maxLength: 128
          description: Идентификатор клиента в системе партнёра
          example: client-8f3a2c
        title:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: Отображаемое название пакета
          example: Кредитный пакет № 458
        status:
          $ref: '#/components/schemas/PackageStatus'
        statusReason:
          type: string
          minLength: 1
          maxLength: 500
          nullable: true
          description: Пояснение причины текущего состояния (отказ, отмена, ошибка)
          example: Клиент не согласен с условиями документа
        signatureType:
          $ref: '#/components/schemas/SignatureType'
        version:
          type: integer
          minimum: 1
          description: Версия пакета; используется в `ETag` и `If-Match`
          example: 3
        createdAt:
          type: string
          format: date-time
          description: Время создания пакета
          example: '2026-10-29T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Время последнего изменения пакета
          example: '2026-10-29T12:01:10Z'
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: Время отправки пакета на подписание
          example: '2026-10-29T12:01:10Z'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Срок ожидания подтверждения клиентом
          example: '2026-11-05T18:00:00Z'
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Время достижения терминального состояния
          example: '2026-10-29T12:07:30Z'
        activeSessionId:
          type: string
          format: uuid
          nullable: true
          description: Идентификатор активной сессии подтверждения
          example: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
        notificationsEnabled:
          type: boolean
          description: Признак того, что партнёр получает callback-уведомления
          example: true
        summary:
          $ref: '#/components/schemas/PackageSummary'
        documents:
          type: array
          minItems: 1
          maxItems: 20
          description: Документы пакета в порядке подписания
          items:
            $ref: '#/components/schemas/Document'
        partnerMetadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          maxProperties: 20
          description: |
            Дополнительные атрибуты партнёра для корреляции. Не должны
            содержать персональные данные.
          example:
            branchId: MSK-12
            productCode: CREDIT-2026
    SigningPackageSummary:
      type: object
      description: Краткие сведения о пакете для списка
      required:
        - packageId
        - externalRequestId
        - clientId
        - status
        - createdAt
        - updatedAt
        - documentsTotal
        - documentsSigned
        - documentsFailed
      properties:
        packageId:
          type: string
          format: uuid
          description: Идентификатор пакета
          example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
        externalRequestId:
          type: string
          minLength: 1
          maxLength: 64
          description: Внешний идентификатор запроса партнёра
          example: BNK-2026-000458
        clientId:
          type: string
          minLength: 1
          maxLength: 128
          description: Идентификатор клиента в системе партнёра
          example: client-8f3a2c
        title:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: Отображаемое название пакета
          example: Кредитный пакет № 458
        status:
          $ref: '#/components/schemas/PackageStatus'
        createdAt:
          type: string
          format: date-time
          description: Время создания пакета
          example: '2026-10-29T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Время последнего изменения пакета
          example: '2026-10-29T12:07:30Z'
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: Время отправки пакета на подписание
          example: '2026-10-29T12:01:10Z'
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Время достижения терминального состояния
          example: '2026-10-29T12:07:30Z'
        documentsTotal:
          type: integer
          minimum: 1
          maximum: 20
          description: Общее число документов в пакете
          example: 2
        documentsSigned:
          type: integer
          minimum: 0
          maximum: 20
          description: Число подписанных документов
          example: 2
        documentsFailed:
          type: integer
          minimum: 0
          maximum: 20
          description: Число документов с ошибкой
          example: 0
    SigningPackagePage:
      type: object
      description: Страница списка пакетов
      required:
        - items
      properties:
        items:
          type: array
          description: Пакеты текущей страницы
          items:
            $ref: '#/components/schemas/SigningPackageSummary'
        nextCursor:
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
          description: Курсор следующей страницы; null, если страниц больше нет
          example: eyJjcmVhdGVkQXQiOiIyMDI2LTEwLTI5VDEyOjAwOjAwWiJ9
    CreateSigningPackageRequest:
      type: object
      description: Запрос на создание пакета документов
      required:
        - externalRequestId
        - clientId
        - documents
      properties:
        externalRequestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'
          description: |
            Внешний идентификатор запроса; уникален в пределах партнёра.
            Повторное использование завершается `409 DUPLICATE_EXTERNAL_REQUEST_ID`.
          example: BNK-2026-000458
        clientId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
          description: |
            Идентификатор клиента в системе партнёра. Должен совпадать с `sub`
            клиентского токена, предъявленного при подписании.
          example: client-8f3a2c
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Отображаемое название пакета
          example: Кредитный пакет № 458
        documents:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            Состав пакета. Порядок элементов определяет порядок документов.
            После создания состав не изменяется.
          items:
            $ref: '#/components/schemas/DocumentMetadata'
        callbackUrl:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^https://'
          description: |
            HTTPS-адрес для callback-уведомлений об изменении состояния пакета.
            Если не указан, партнёр использует опрос.
          example: https://partner.example.com/hooks/podpis-online
        expiresAt:
          type: string
          format: date-time
          description: |
            Желаемый срок ожидания подтверждения клиентом. Не более 30 дней от
            текущего момента. Если не указан, применяется значение по умолчанию
            (7 дней).
          example: '2026-11-05T18:00:00Z'
        partnerMetadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          maxProperties: 20
          description: |
            Дополнительные атрибуты партнёра для корреляции. Не должны
            содержать персональные данные.
          example:
            branchId: MSK-12
            productCode: CREDIT-2026
    SubmitSigningPackageRequest:
      type: object
      description: Необязательные параметры отправки пакета на подписание
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 500
          description: Комментарий партнёра для журнала операций
          example: Пакет сформирован для клиента branch MSK-12
    CancelSigningPackageRequest:
      type: object
      description: Запрос на отмену пакета документов
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Причина отмены; сохраняется в `statusReason` пакета
          example: Клиент отказался от сделки до подтверждения
    SigningResult:
      type: object
      description: |
        Результат обработки пакета. Для незавершённых пакетов содержит текущее
        состояние; `resultUnknown = true` означает, что результат подписания
        ещё не подтверждён криптографическим компонентом.
      required:
        - packageId
        - status
        - signatureType
        - summary
        - documents
        - resultUnknown
      properties:
        packageId:
          type: string
          format: uuid
          description: Идентификатор пакета
          example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
        status:
          $ref: '#/components/schemas/PackageStatus'
        signatureType:
          $ref: '#/components/schemas/SignatureType'
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Время завершения обработки; null, если обработка не завершена
          example: '2026-10-29T12:07:30Z'
        resultUnknown:
          type: boolean
          description: |
            Признак того, что результат подписания неизвестен из-за сбоя
            взаимодействия с криптографическим компонентом.
          example: false
        summary:
          $ref: '#/components/schemas/PackageSummary'
        documents:
          type: array
          minItems: 1
          maxItems: 20
          description: Результат по каждому документу пакета
          items:
            $ref: '#/components/schemas/Document'
    SigningSession:
      type: object
      description: Сессия подтверждения подписания
      required:
        - sessionId
        - packageId
        - status
        - packageStatus
        - confirmationMethod
        - createdAt
        - expiresAt
        - version
      properties:
        sessionId:
          type: string
          format: uuid
          description: Идентификатор сессии подтверждения
          example: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
        packageId:
          type: string
          format: uuid
          description: Идентификатор подписываемого пакета
          example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
        status:
          $ref: '#/components/schemas/SessionStatus'
        packageStatus:
          $ref: '#/components/schemas/PackageStatus'
        confirmationMethod:
          $ref: '#/components/schemas/ConfirmationMethod'
        challenge:
          allOf:
            - $ref: '#/components/schemas/ConfirmationChallenge'
          description: Параметры вызова подтверждения; отсутствуют после завершения сессии
        createdAt:
          type: string
          format: date-time
          description: Время создания сессии
          example: '2026-10-29T12:02:00Z'
        expiresAt:
          type: string
          format: date-time
          description: Срок действия сессии
          example: '2026-10-29T12:17:00Z'
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          description: Время подтверждения клиентом
          example: '2026-10-29T12:03:20Z'
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Время завершения сессии
          example: '2026-10-29T12:07:30Z'
        version:
          type: integer
          minimum: 1
          description: Версия сессии; используется в `ETag`
          example: 2
    ConfirmationChallenge:
      type: object
      description: Параметры вызова подтверждения, выданного клиенту
      required:
        - challengeId
        - method
        - recipientMasked
        - attemptsLeft
        - expiresAt
      properties:
        challengeId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор вызова подтверждения для последующего `confirm`
          example: ch-9f8e7d6c5b4a
        method:
          $ref: '#/components/schemas/ConfirmationMethod'
        recipientMasked:
          type: string
          minLength: 1
          maxLength: 64
          description: Маскированный получатель кода или устройства
          example: '+7 *** ***-12-34'
        attemptsLeft:
          type: integer
          minimum: 0
          maximum: 3
          description: Остаток попыток ввода кода подтверждения
          example: 3
        expiresAt:
          type: string
          format: date-time
          description: Срок действия вызова подтверждения
          example: '2026-10-29T12:17:00Z'
    CreateSigningSessionRequest:
      type: object
      description: Запрос на инициирование подписания клиентом
      required:
        - confirmationMethod
      properties:
        confirmationMethod:
          $ref: '#/components/schemas/ConfirmationMethod'
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Идентификатор устройства клиента для адресации push-подтверждения.
            Не должен содержать номер телефона и иные прямые идентификаторы.
          example: device-7c1e9a
    ConfirmSigningSessionRequest:
      type: object
      description: Подтверждение намерения подписать пакет
      required:
        - challengeId
        - confirmationCode
      properties:
        challengeId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор вызова подтверждения, полученный при создании сессии
          example: ch-9f8e7d6c5b4a
        confirmationCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: |
            Одноразовый код подтверждения. Не журналируется и не возвращается
            в ответах.
          example: '482913'
    RejectSigningSessionRequest:
      type: object
      description: Отказ клиента от подписания пакета
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Причина отказа; сохраняется в `statusReason` пакета
          example: Клиент не согласен с условиями документа
    PackageEvent:
      type: object
      description: |
        Событие изменения состояния пакета, доставляемое на `callbackUrl`.
        Доставка не гарантирует порядок; получатель обязан распознавать
        повторы по `eventId`.
      required:
        - eventId
        - eventType
        - occurredAt
        - packageId
        - status
      properties:
        eventId:
          type: string
          format: uuid
          description: Идентификатор события; используется для дедупликации
          example: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
        eventType:
          type: string
          description: Тип события
          enum:
            - signing-package.submitted
            - signing-package.signing-started
            - signing-package.completed
            - signing-package.partially-signed
            - signing-package.failed
            - signing-package.rejected
            - signing-package.cancelled
            - signing-package.expired
          example: signing-package.completed
        occurredAt:
          type: string
          format: date-time
          description: Время возникновения события
          example: '2026-10-29T12:07:30Z'
        packageId:
          type: string
          format: uuid
          description: Идентификатор пакета
          example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
        status:
          $ref: '#/components/schemas/PackageStatus'
        summary:
          $ref: '#/components/schemas/PackageSummary'
        documents:
          type: array
