openapi: 3.0.3
info:
  title: ПодписьОнлайн — API подписания пакета документов
  version: '1.0.0'
  description: |
    REST API сервиса «ПодписьОнлайн» для сценария подписания пакета документов
    усиленной квалифицированной электронной подписью (УКЭП).

    Источник требований: Jira SCRUM-2140 (дочерняя задача SCRUM-2139).
    Спецификация описывает взаимодействие с системами партнёров и внутренними
    компонентами сервиса в границах сценария подписания пакета документов.

    ## Границы сценария

    Сервис «ПодписьОнлайн»:

    * принимает от системы партнёра пакет документов и метаданные клиента;
    * обеспечивает хранение исходных документов и предъявление их клиенту;
    * инициирует и принимает подтверждение клиента;
    * организует криптографическую операцию подписания через согласованный
      криптографический компонент или удостоверяющий центр (УЦ);
    * фиксирует результат по каждому документу и по пакету в целом;
    * предоставляет партнёру результат и подписанные документы.

    Сервис не выпускает сертификат в рамках этого сценария, не выполняет
    аутентификацию клиента в приложении партнёра и не подменяет УЦ. Клиентский
    интерфейс предоставляет приложение банка или страховой организации.

    ## Участники

    | Участник | Роль в сценарии |
    |---|---|
    | Система партнёра (backend) | Создаёт пакет, загружает документы, отправляет пакет на подписание, получает статусы и результат |
    | Приложение партнёра | Аутентифицирует клиента, отображает документы, инициирует и подтверждает подписание |
    | Клиент | Физическое лицо или индивидуальный предприниматель, подписывающий пакет |
    | «ПодписьОнлайн» | Оркестрирует сценарий, хранит документы, управляет состояниями и результатом |
    | УЦ / криптографический компонент | Выполняет криптографическую операцию подписания и предоставляет сведения о сертификате |

    ## Основной сценарий

    1. Система партнёра создаёт пакет (`POST /signing-packages`) и получает
       `packageId`. Состав пакета фиксируется в момент создания.
    2. Система партнёра загружает содержимое каждого документа
       (`PUT /signing-packages/{packageId}/documents/{documentId}/content`).
    3. Система партнёра отправляет пакет на подписание
       (`POST /signing-packages/{packageId}/submit`). Пакет переходит в
       `PENDING_CONFIRMATION`, состав становится неизменяемым.
    4. Клиент в приложении партнёра открывает пакет
       (`GET /signing-packages/{packageId}`) и инициирует подписание
       (`POST /signing-packages/{packageId}/signing-sessions`).
    5. Сервис формирует одноразовый вызов подтверждения и возвращает его
       параметры (маскированный получатель, срок действия, число попыток).
    6. Клиент подтверждает намерение (`POST /signing-sessions/{sessionId}/confirm`).
       Пакет переходит в `SIGNING`; подписание выполняется асинхронно.
    7. Клиент или партнёр отслеживает состояние пакета
       (`GET /signing-packages/{packageId}` или `GET /signing-packages/{packageId}/result`).
       Партнёр может получать уведомления через callback.
    8. По завершении результат доступен по каждому документу; подписанные
       документы можно скачать (`GET .../content?variant=SIGNED`).

    Клиент может отказаться от подписания до начала криптографической операции
    (`POST /signing-sessions/{sessionId}/reject`), партнёр может отменить пакет
    до подтверждения клиентом (`POST /signing-packages/{packageId}/cancel`).

    ## Модель состояний пакета

    | Состояние | Значение | Допустимые переходы |
    |---|---|---|
    | `DRAFT` | Пакет создан; содержимое документов можно загружать и заменять; состав не изменяется | `PENDING_CONFIRMATION`, `CANCELLED` |
    | `PENDING_CONFIRMATION` | Состав зафиксирован, ожидается подтверждение клиента | `SIGNING`, `REJECTED`, `EXPIRED`, `CANCELLED` |
    | `SIGNING` | Клиент подтвердил, выполняется подписание; результат может быть ещё неизвестен | `SIGNED`, `PARTIALLY_SIGNED`, `FAILED` |
    | `SIGNED` | Все документы подписаны | — |
    | `PARTIALLY_SIGNED` | Часть документов подписана, часть завершилась ошибкой | — |
    | `REJECTED` | Клиент отказался от подписания | — |
    | `CANCELLED` | Пакет отменён партнёром до подтверждения | — |
    | `EXPIRED` | Истёк срок ожидания подтверждения | — |
    | `FAILED` | Ни один документ не подписан, обработка завершилась ошибкой | — |

    Состояния `SIGNED`, `PARTIALLY_SIGNED`, `REJECTED`, `CANCELLED`, `EXPIRED`
    и `FAILED` являются терминальными.

    ## Идентификация и авторизация

    * Система партнёра аутентифицируется по OAuth 2.0 Client Credentials.
      Партнёр определяется по `client_id` токена; передача `partnerId` в теле
      запроса не предусмотрена и не должна приниматься как основание доступа.
    * Клиентский токен выпускается для приложения партнёра после аутентификации
      клиента по Authorization Code с PKCE. `sub` токена должен соответствовать
      `clientId`, указанному партнёром при создании пакета; сервис проверяет
      подпись, `iss`, `aud`, срок действия и scopes.
    * Доступ к пакету проверяется по принадлежности партнёру и по связи
      `clientId` с аутентифицированным субъектом. Знание `packageId` не даёт прав
      на операцию.
    * Код подтверждения, содержимое документов и персональные данные не должны
      попадать в журналы; код подтверждения не возвращается в ответах API.
    * Для межсистемного канала рекомендуется mTLS; конкретный механизм
      согласуется с партнёром.

    ## Идемпотентность и защита от повторной обработки

    Все изменяющие состояние POST-операции требуют заголовок `Idempotency-Key`.
    Сервер хранит ключ и отпечаток запроса 24 часа. Повтор с тем же
    ключом и тем же телом возвращает сохранённый ответ с заголовком
    `Idempotent-Replayed: true`; повтор с тем же ключом и другим телом возвращает
    `409 IDEMPOTENCY_KEY_REUSED`; параллельный запрос с тем же ключом —
    `409 IDEMPOTENCY_KEY_IN_PROGRESS`.

    Для `submit` и `cancel` дополнительно используется `If-Match` с `ETag`
    пакета, что защищает от изменения состава и состояния по устаревшим данным.
    `externalRequestId` уникален в пределах партнёра и позволяет распознать
    повторное создание пакета.

    Повторное подтверждение подписания не должно приводить к повторной
    криптографической операции: при уже подтверждённой сессии возвращается
    текущее состояние, а не запускается новое подписание.

    ## Ошибки и повторные попытки

    Ошибки возвращаются в единой модели `Problem`: машиночитаемый `code`,
    сообщение, `traceId`, время, признак `retryable` и детали валидации.
    Бизнес-ошибки (недопустимый переход, отсутствие сертификата, истёкший срок)
    отличаются от технических ошибок (недоступность УЦ, тайм-аут).

    Повторять автоматически допускается только запросы, помеченные
    `retryable: true`, с учётом `Retry-After`. При тайм-ауте подтверждения или
    ошибке криптографического компонента результат считается неизвестным:
    необходимо запросить состояние пакета, а не повторять подтверждение вслепую.

    ## Ограничения (предварительные)

    * Формат документов на первом этапе: PDF (`application/pdf`).
    * Количество документов в пакете: от 1 до 20.
    * Размер одного документа: до 25 МиБ (26 214 400 байт).
    * Суммарный размер пакета: до 100 МиБ (104 857 600 байт).
    * Срок ожидания подтверждения клиентом: по умолчанию 7 календарных дней,
      но не более 30 дней с момента отправки пакета.
    * Срок жизни сессии подтверждения: 15 минут.
    * Количество попыток ввода кода подтверждения: 3.

    Перечисленные значения являются рабочими допущениями и требуют
    подтверждения (см. `x-open-questions`).

    ## Открытые вопросы

    Неопределённые контракты, бизнес-правила и технические зависимости
    зафиксированы в `x-open-questions`. Принятые рабочие допущения — в
    `x-assumptions`. До согласования этих вопросов соответствующие элементы
    спецификации не должны трактоваться как подтверждённые требования.

    Краткий перечень (полные формулировки и влияние — в `x-open-questions`):

    * OQ-01 — механизм подтверждения намерения клиента;
    * OQ-02 — формат УКЭП и место криптографической операции;
    * OQ-03 — допустимость частичного подписания;
    * OQ-04 — повторная обработка документов с ошибкой;
    * OQ-05 — сроки подтверждения, сессии и хранения;
    * OQ-06 — лимиты документов и размеров;
    * OQ-07 — выпуск клиентского токена и claims;
    * OQ-08 — обязательность callback-уведомлений;
    * OQ-09 — предельный срок устранения неизвестного результата;
    * OQ-10 — журналирование и юридическая значимость;
    * OQ-11 — отдельная операция проверки подписи.
