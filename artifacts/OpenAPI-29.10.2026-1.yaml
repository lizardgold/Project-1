  /signing-packages/{packageId}/result:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/XRequestId'
    get:
      tags:
        - Результаты
      summary: Получить результат обработки пакета
      operationId: getSigningResult
      description: |
        Возвращает результат по пакету и каждому документу: состояние, данные
        подписи и сертификата, доступность подписанного файла, ошибку документа.

        Метод можно вызывать в любом состоянии: до завершения он возвращает
        текущий статус и промежуточные результаты, после завершения — итоговый
        результат. Если пакет ещё не завершён, `completedAt` равен `null`, а
        документы могут находиться в состоянии `PENDING` или `SIGNING`.

        Результат по пакету не заменяет результаты документов: при частичном
        подписании `status` пакета равен `PARTIALLY_SIGNED`, а по каждому
        документу возвращается собственный статус и ошибка.

        Клиент получает доступ к результату только после отправки пакета
        партнёром (`PENDING_CONFIRMATION` и далее).
      security:
        - partnerOAuth:
            - signing-packages:read
        - clientOAuth:
            - signing:read
      responses:
        '200':
          description: Текущий результат обработки
          headers:
            Cache-Control:
              description: Результат содержит чувствительные данные и не кэшируется
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningResult'
              examples:
                signedResult:
