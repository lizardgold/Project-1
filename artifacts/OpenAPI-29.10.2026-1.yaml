    get:
      tags:
        - Документы
      summary: Скачать содержимое документа
      operationId: downloadDocumentContent
      description: |
        Возвращает исходное или подписанное содержимое документа.

        * `ORIGINAL` — исходный PDF, принятый от партнёра. Доступен партнёру и
          клиенту, которому адресован пакет.
        * `SIGNED` — PDF с внедрённой подписью. Доступен только после успешного
          подписания документа; иначе `409 DOCUMENT_NOT_SIGNED`.

        Клиент получает доступ к содержимому только после отправки пакета
        партнёром (`PENDING_CONFIRMATION` и далее).

        Сервис возвращает `X-Content-SHA256` с контрольной суммой выдаваемого
        файла и `ETag`. Для подписанного документа дополнительно возвращается
        `X-Signature-Id`.
      security:
        - partnerOAuth:
            - signing-packages:read
        - clientOAuth:
            - signing:read
      parameters:
        - name: variant
          in: query
          required: false
          description: Вариант содержимого документа
          schema:
            type: string
            enum:
              - ORIGINAL
              - SIGNED
            default: ORIGINAL
      responses:
        '200':
          description: Содержимое документа
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            X-Content-SHA256:
              $ref: '#/components/headers/XContentSha256Response'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Signature-Id:
              description: Идентификатор подписи; присутствует только для variant=SIGNED
              schema:
                type: string
                format: uuid
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                description: Бинарное содержимое PDF-документа
