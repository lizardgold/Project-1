  /signing-sessions/{sessionId}/confirm:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/XRequestId'
    post:
      tags:
        - Подписание клиентом
      summary: Подтвердить подписание пакета
      description: |
        Подтверждает намерение клиента подписать пакет. Успешный ответ
        означает, что подтверждение принято и подписание запущено, но не
        означает, что документы уже подписаны: результат формируется
        асинхронно и доступен через `GET /signing-packages/{packageId}/result`.

        Неверный код — `400 INVALID_CONFIRMATION_CODE`; после исчерпания
        попыток сессия блокируется (`409 SESSION_BLOCKED`); истёкшая сессия —
        `409 SESSION_EXPIRED`.

        Повторный вызов для уже подтверждённой сессии не запускает повторную
        криптографическую операцию: возвращается `202` с текущим состоянием
        сессии. Если результат подписания неизвестен, сервис не сообщает об
        успехе и сохраняет состояние `SIGNING`.
      operationId: confirmSigningSession
      security:
        - clientOAuth:
            - signing-sessions:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSigningSessionRequest'
            example:
              challengeId: ch-9f8e7d6c5b4a
              confirmationCode: '482913'
      responses:
        '202':
          description: Подтверждение принято, подписание запущено
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSession'
              example:
                sessionId: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
                packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                status: CONFIRMED
                packageStatus: SIGNING
                confirmationMethod: SMS_OTP
                createdAt: '2026-10-29T12:02:00Z'
                expiresAt: '2026-10-29T12:17:00Z'
                confirmedAt: '2026-10-29T12:03:20Z'
                version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
