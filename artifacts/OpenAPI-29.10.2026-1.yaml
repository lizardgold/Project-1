x-status-models:
  package:
    initial: DRAFT
    terminal:
      - SIGNED
      - PARTIALLY_SIGNED
      - REJECTED
      - CANCELLED
      - EXPIRED
      - FAILED
    transitions:
      - from: DRAFT
        event: submit
        to: PENDING_CONFIRMATION
        operationId: submitSigningPackage
      - from: DRAFT
        event: cancel
        to: CANCELLED
        operationId: cancelSigningPackage
      - from: PENDING_CONFIRMATION
        event: confirm
        to: SIGNING
        operationId: confirmSigningSession
      - from: PENDING_CONFIRMATION
        event: reject
        to: REJECTED
        operationId: rejectSigningSession
      - from: PENDING_CONFIRMATION
        event: expiresAt_reached
        to: EXPIRED
        operationId: null
      - from: PENDING_CONFIRMATION
        event: cancel
        to: CANCELLED
        operationId: cancelSigningPackage
      - from: SIGNING
        event: all_documents_signed
        to: SIGNED
        operationId: null
      - from: SIGNING
        event: some_documents_signed_some_failed
        to: PARTIALLY_SIGNED
        operationId: null
      - from: SIGNING
        event: no_documents_signed
        to: FAILED
        operationId: null
  document:
    initial: PENDING
    terminal:
      - SIGNED
      - FAILED
    transitions:
      - from: PENDING
        event: signing_started
        to: SIGNING
        operationId: confirmSigningSession
      - from: SIGNING
        event: signed
        to: SIGNED
        operationId: null
      - from: SIGNING
        event: signing_failed
        to: FAILED
        operationId: null
    notes: |
      Документ, не участвовавший в подписании из-за отказа клиента, истечения
      срока или отмены пакета, остаётся в состоянии PENDING. Состояние SIGNING
      также используется, когда результат криптографической операции ещё
      неизвестен; сервис выполняет сверку с криптографическим компонентом.
  signingSession:
    initial: CREATED
    terminal:
      - COMPLETED
      - REJECTED
      - EXPIRED
      - BLOCKED
    transitions:
      - from: CREATED
        event: confirm
        to: CONFIRMED
        operationId: confirmSigningSession
      - from: CREATED
        event: reject
        to: REJECTED
        operationId: rejectSigningSession
      - from: CREATED
        event: expiresAt_reached
        to: EXPIRED
        operationId: null
      - from: CREATED
        event: attempts_exhausted
        to: BLOCKED
        operationId: null
      - from: CONFIRMED
        event: package_terminal
        to: COMPLETED
        operationId: null
x-idempotency:
  header: Idempotency-Key
  requiredFor:
    - createSigningPackage
    - submitSigningPackage
    - cancelSigningPackage
    - createSigningSession
    - confirmSigningSession
    - rejectSigningSession
  ttlHours: 24
  scope: |
    Ключ уникален в пределах комбинации (тип субъекта, идентификатор субъекта,
    operationId). Для партнёра субъект определяется client_id токена, для клиента —
    subject токена.
  replayHeader: Idempotent-Replayed
  behavior: |
    Одинаковый ключ и одинаковое канонизированное тело запроса — возврат
    сохранённого HTTP-статуса и тела ответа. Одинаковый ключ и другое тело —
    409 IDEMPOTENCY_KEY_REUSED. Параллельный запрос с тем же ключом до завершения
    первого — 409 IDEMPOTENCY_KEY_IN_PROGRESS с Retry-After.
  conflictCodes:
    - IDEMPOTENCY_KEY_REUSED
    - IDEMPOTENCY_KEY_IN_PROGRESS
    - DUPLICATE_EXTERNAL_REQUEST_ID
x-webhooks:
  registration: |
    Адрес callback передаётся в CreateSigningPackageRequest.callbackUrl и
    действует в пределах пакета. Сервис принимает только HTTPS-адреса,
    проверяет отсутствие ссылок на внутренние и приватные адреса (защита от
    SSRF) и может требовать предварительной регистрации домена партнёра.
    Секрет для HMAC согласуется при подключении партнёра и может быть
    отозван и заменён без изменения бизнес-логики.
  events:
    - package.pending_confirmation
    - package.signing_started
    - package.signed
    - package.partially_signed
    - package.failed
    - package.rejected
    - package.expired
    - package.cancelled
  delivery: |
    Ожидаемый ответ — 2XX в течение 5 секунд. Повторные попытки при 4XX/5XX или
    тайм-ауте: 1 мин, 5 мин, 15 мин, 30 мин, 1 ч, 3 ч. Повторная доставка
    возможна; получатель обязан распознавать события по X-Webhook-Event-Id.
  signature: |
    X-Webhook-Signature: t=<X-Webhook-Timestamp>,v1=<hex HMAC-SHA256 от
    "<timestamp>.<сырое тело>" с секретом партнёра>. Получатель проверяет подпись
    до обработки события.
x-rate-limits:
  partner:
    requestsPerMinute: 600
    scope: client_id
  client:
    requestsPerMinute: 120
    scope: subject токена
  upload:
    requestsPerMinute: 60
    scope: client_id партнёра
  note: |
    Значения предварительные; при превышении возвращается 429 с Retry-After.
x-open-questions:
  - id: OQ-01
    question: |
      Какой механизм подтверждения намерения клиента является целевым: SMS-код,
      push-подтверждение в приложении партнёра, биометрия или их комбинация?
      Достаточно ли одного фактора для юридически значимого подтверждения?
      Подтверждение является единым для всего пакета или отдельным для каждого
      документа?
    impact: |
      Влияет на модель сессии, состав полей challenge, требования к интеграции
      с приложением партнёра и каналами доставки кода, а также на доказательную
      базу подтверждения. Гранулярность подтверждения влияет на число сессий и
      на допустимость частичного подтверждения состава пакета.
    status: OPEN
    owner: Владелец продукта, архитектор безопасности
  - id: OQ-02
    question: |
      Где выполняется криптографическая операция и в каком формате формируется
      УКЭП (PAdES-BES, CAdES-BES, иной)? Кто предоставляет сертификат и ключ:
      УЦ, отдельный криптопровайдер или приложение клиента?
    impact: |
      Влияет на signatureFormat, состав CertificateInfo, коды ошибок
      SIGNING_PROVIDER_*, требования к хранению ключей и проверке подписи.
    status: OPEN
    owner: Архитектор, владелец интеграции с УЦ
  - id: OQ-03
    question: |
      Допускается ли частичное подписание пакета бизнесом, или пакет должен
      подписываться атомарно? Что делать с уже подписанными документами при
      ошибке остальных?
    impact: |
      Влияет на статус PARTIALLY_SIGNED, поведение при ошибках, компенсацию и
      требования партнёров к повторной обработке.
    status: OPEN
    owner: Владелец продукта
  - id: OQ-04
    question: |
      Как повторно подписывать документы, завершившиеся ошибкой: в рамках новой
      сессии того же пакета, нового пакета или отдельной операции повторной
      обработки?
    impact: |
      Влияет на модель состояний документа и пакета, идемпотентность и контракт
      повторной обработки.
    status: OPEN
    owner: Владелец продукта, архитектор
  - id: OQ-05
    question: |
      Каковы согласованные сроки: срок жизни черновика, срок ожидания
      подтверждения, срок жизни сессии, срок хранения и доступности подписанных
      документов?
    impact: |
      Влияет на expiresAt, availableUntil, фоновые переходы в EXPIRED и
      требования к архивированию.
    status: OPEN
    owner: Владелец продукта, юридическая служба
  - id: OQ-06
    question: |
      Подтверждаются ли лимиты: 20 документов, 25 МиБ на документ, 100 МиБ на
      пакет, только PDF?
    impact: |
      Влияет на валидацию, коды ошибок, лимиты API-шлюза и требования к
      хранилищу.
    status: OPEN
    owner: Архитектор, владелец интеграции
  - id: OQ-07
    question: |
      Кто выпускает клиентский токен и какие claims подтверждают личность?
      Как сопоставляется clientId партнёра с субъектом токена и внутренним
      клиентом сервиса?
    impact: |
      Влияет на схему clientOAuth, проверку доступа к пакету и защиту от
      подмены клиента.
    status: OPEN
    owner: Архитектор безопасности, владелец интеграции с партнёром
  - id: OQ-08
    question: |
      Являются ли callback-уведомления обязательными для партнёров, или
      достаточно опроса? Нужна ли отдельная подписка на события вне пакета?
    impact: |
      Влияет на callbackUrl, контракт PackageEvent, инфраструктуру доставки и
      требования к партнёрам.
    status: OPEN
    owner: Владелец продукта, владельцы интеграций
  - id: OQ-09
    question: |
      Каков предельный срок устранения неизвестного результата при недоступности
      криптографического компонента? Допустимо ли долгое пребывание пакета в
      SIGNING и кто принимает решение о ручном разборе?
    impact: |
      Влияет на регламент сверки, статусы SIGNING/FAILED, уведомления и
      поддержку.
    status: OPEN
    owner: Архитектор, служба эксплуатации
  - id: OQ-10
    question: |
      Какие требования предъявляются к журналированию, срокам хранения
      аудиторских событий и юридической значимости подтверждения?
    impact: |
      Влияет на состав событий, хранение, доступ поддержки и доказательную базу.
    status: OPEN
    owner: Юридическая служба, архитектор безопасности
  - id: OQ-11
    question: |
      Нужна ли в этом API отдельная операция проверки подписи, или достаточно
      поля verificationStatus в результате?
    impact: |
      Влияет на состав операций и контракт проверки подписи.
    status: OPEN
    owner: Владелец продукта
x-assumptions:
  - id: A-01
    statement: |
      Система партнёра аутентифицируется по OAuth 2.0 Client Credentials;
      client_id однозначно сопоставлен партнёру. mTLS рекомендуется, но не
      делается обязательным до согласования.
    rationale: Соответствует модели машинной идентичности в базе знаний.
    affected: partnerOAuth, доступ к пакетам
  - id: A-02
    statement: |
      Клиентский токен выпускается приложением партнёра после аутентификации
      клиента; sub токена равен clientId, переданному партнёром.
    rationale: Позволяет проверять принадлежность пакета без передачи ПДн.
    affected: clientOAuth, CreateSigningPackageRequest.clientId
  - id: A-03
    statement: |
      Пакет создаётся с полным составом; добавление и удаление документов после
      создания не поддерживается. Для изменения состава пакет отменяется и
      создаётся заново.
    rationale: Обеспечивает неизменность состава до начала подписания.
    affected: createSigningPackage, submitSigningPackage
  - id: A-04
    statement: |
      Сессия подписания — отдельная сущность, идентифицирующая попытку
      подтверждения. Одновременно допускается одна активная сессия на пакет.
    rationale: Разделяет пакет, операцию подтверждения и результат документа.
    affected: SigningSession, PackageStatus
  - id: A-05
    statement: |
      При частичном успехе пакет получает PARTIALLY_SIGNED, а результаты
      документов сохраняются независимо; автоматическая компенсация уже
      выполненных подписей не выполняется.
    rationale: Соответствует бизнес-правилу 2.5 базы знаний.
    affected: PackageStatus, SigningResult
  - id: A-06
    statement: |
      Подтверждение выполняется одноразовым кодом; поддерживаются SMS_OTP и
      PUSH_APP, при этом конкретный механизм требует согласования.
    rationale: Даёт единый контракт подтверждения без привязки к каналу.
    affected: ConfirmationMethod, ConfirmSigningSessionRequest
  - id: A-07
    statement: |
      Callback-уведомления необязательны; при отсутствии callbackUrl партнёр
      использует опрос статуса.
