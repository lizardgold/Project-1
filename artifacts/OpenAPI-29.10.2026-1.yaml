  /signing-packages/{packageId}/signing-sessions:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/XRequestId'
    post:
      tags:
        - Подписание клиентом
      summary: Инициировать подписание пакета клиентом
      operationId: createSigningSession
      description: |
        Создаёт сессию подтверждения для клиента, которому адресован пакет.
        Допустимо только для пакета в состоянии `PENDING_CONFIRMATION` и только
        при наличии действующего сертификата клиента.

        В ответе возвращается вызов подтверждения: маскированный получатель,
        срок действия и число оставшихся попыток. Одноразовый код отправляется
        выбранным способом; код не возвращается в ответе API.

        Одновременно может существовать только одна активная сессия. Повторное
        создание при активной сессии возвращает `409 ACTIVE_SESSION_EXISTS` с
        идентификатором активной сессии. После истечения или блокировки сессии
        клиент может создать новую, пока пакет остаётся в `PENDING_CONFIRMATION`.
      security:
        - clientOAuth:
            - signing:confirm
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSigningSessionRequest'
            examples:
              smsOtp:
                summary: Подтверждение по одноразовому коду
                value:
                  confirmationMethod: SMS_OTP
                  deviceId: device-7c1e9a
      responses:
        '201':
          description: Сессия создана, вызов подтверждения сформирован
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Cache-Control:
              description: Параметры вызова подтверждения не кэшируются
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSession'
              examples:
                created:
                  summary: Сессия ожидает подтверждения
                  value:
                    sessionId: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
                    packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                    status: CREATED
                    packageStatus: PENDING_CONFIRMATION
                    confirmationMethod: SMS_OTP
                    challenge:
                      challengeId: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70
                      method: SMS_OTP
                      destinationMasked: '+7 *** *** 45-67'
                      expiresAt: '2026-10-29T12:15:00Z'
                      attemptsRemaining: 3
                    createdAt: '2026-10-29T12:00:00Z'
                    expiresAt: '2026-10-29T12:15:00Z'
                    confirmedAt: null
                    completedAt: null
                    version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /signing-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/XRequestId'
    get:
      tags:
        - Подписание клиентом
      summary: Получить состояние сессии подписания
      operationId: getSigningSession
      description: |
        Возвращает состояние сессии, параметры вызова подтверждения и
        агрегированное состояние пакета. Доступно только клиенту, которому
        принадлежит сессия.

        После подтверждения сессия находится в `CONFIRMED`, пока идёт
        подписание. Когда пакет достигает терминального состояния, сессия
        переходит в `COMPLETED`; итог по документам доступен в результате пакета.
      security:
        - clientOAuth:
            - signing:confirm
      responses:
        '200':
          description: Состояние сессии
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: Параметры вызова подтверждения не кэшируются
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSession'
              examples:
                confirmed:
                  summary: Сессия подтверждена, идёт подписание
                  value:
                    sessionId: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
                    packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                    status: CONFIRMED
                    packageStatus: SIGNING
                    confirmationMethod: SMS_OTP
                    createdAt: '2026-10-29T12:00:00Z'
                    expiresAt: '2026-10-29T12:15:00Z'
                    confirmedAt: '2026-10-29T12:03:20Z'
                    completedAt: null
                    version: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /signing-sessions/{sessionId}/confirm:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/XRequestId'
    post:
      tags:
        - Подписание клиентом
      summary: Подтвердить подписание пакета
      operationId: confirmSigningSession
      description: |
        Принимает одноразовый код подтверждения и запускает криптографическую
        операцию подписания. Пакет переходит в `SIGNING`, сессия — в `CONFIRMED`.
        Ответ `202` означает, что подтверждение принято и обработка продолжается;
        результат нужно получать через статус пакета или результат, а не считать
        ответ подтверждением успешного подписания.

        При неверном коде возвращается `422 INVALID_CONFIRMATION_CODE` с числом
        оставшихся попыток (в `details`, поле `attemptsRemaining`). После
        третьей неудачной попытки сессия блокируется
        (`409 SESSION_BLOCKED`), пакет остаётся в `PENDING_CONFIRMATION`.

        Повторный вызов с тем же `Idempotency-Key` возвращает сохранённый ответ и
        не запускает повторное подписание. Повтор с новым ключом при уже
        подтверждённой сессии возвращает `409 INVALID_SESSION_STATE`.

        При тайм-ауте или ошибке криптографического компонента результат может
        быть неизвестен: необходимо запросить состояние пакета и не повторять
        подтверждение вслепую.
      security:
        - clientOAuth:
            - signing:confirm
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSigningSessionRequest'
            examples:
              smsCode:
                summary: Код из SMS
                value:
                  challengeId: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70
                  code: '482915'
      responses:
        '202':
          description: Подтверждение принято, подписание выполняется
          headers:
            Location:
              description: Ссылка на результат обработки пакета
              schema:
                type: string
                format: uri-reference
                example: /v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01/result
            ETag:
              $ref: '#/components/headers/ETag'
            Retry-After:
              description: Рекомендуемая задержка перед запросом результата, секунды
              schema:
                type: integer
                example: 2
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSession'
              examples:
                confirmed:
                  summary: Сессия подтверждена
                  value:
                    sessionId: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
                    packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                    status: CONFIRMED
                    packageStatus: SIGNING
                    confirmationMethod: SMS_OTP
                    createdAt: '2026-10-29T12:00:00Z'
                    expiresAt: '2026-10-29T12:15:00Z'
                    confirmedAt: '2026-10-29T12:03:20Z'
                    completedAt: null
                    version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /signing-sessions/{sessionId}/reject:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/XRequestId'
    post:
      tags:
        - Подписание клиентом
      summary: Отклонить подписание пакета
      operationId: rejectSigningSession
      description: |
        Фиксирует отказ клиента от подписания. Допустимо только для сессии в
        состоянии `CREATED` и пакета в `PENDING_CONFIRMATION`; после начала
        подписания отказ невозможен (`409 INVALID_SESSION_STATE`).

        Пакет переходит в `REJECTED`, документы остаются неподписанными.
        Требует `Idempotency-Key`; повторная отправка того же отказа возвращает
        сохранённый ответ.
      security:
        - clientOAuth:
            - signing:confirm
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectSigningSessionRequest'
            examples:
              declined:
                summary: Клиент отказался от подписания
                value:
                  reasonCode: CLIENT_DECLINED
                  comment: Клиент не согласен с условиями документа
      responses:
        '200':
          description: Отказ зафиксирован
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSession'
              examples:
                rejected:
                  summary: Сессия и пакет отклонены
                  value:
                    sessionId: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
                    packageId: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
                    status: REJECTED
                    packageStatus: REJECTED
                    confirmationMethod: SMS_OTP
                    createdAt: '2026-10-29T12:00:00Z'
                    expiresAt: '2026-10-29T12:15:00Z'
                    confirmedAt: null
                    completedAt: '2026-10-29T12:04:00Z'
                    version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    partnerOAuth:
      type: oauth2
      description: |
        Машинная идентичность системы партнёра. Токен выдаётся по OAuth 2.0
        Client Credentials; `client_id` однозначно сопоставлен партнёру.
        Рекомендуется дополнительная аутентификация канала по mTLS.
      flows:
        clientCredentials:
          tokenUrl: https://auth.podpisonline.example/oauth2/token
          scopes:
            signing-packages:write: Создание пакетов, загрузка документов, отправка и отмена
            signing-packages:read: Просмотр пакетов, результатов и скачивание документов
    clientOAuth:
      type: oauth2
      description: |
        Пользовательская идентичность клиента. Токен выпускается для приложения
        партнёра после аутентификации клиента. `sub` токена должен совпадать с
        `clientId`, указанным партнёром при создании пакета.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.partner.example/oauth2/authorize
          tokenUrl: https://auth.partner.example/oauth2/token
          scopes:
            signing:read: Просмотр адресованных пакетов и скачивание документов
            signing:confirm: Инициирование, подтверждение и отклонение подписания
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Идентификатор запроса для сквозной корреляции; возвращается в ответе и в ошибках
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]+$'
      example: req-7f3a9c21
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Ключ идемпотентности изменяющей операции. Повтор с тем же ключом и тем
        же телом запроса возвращает сохранённый ответ; с другим телом —
        `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]+$'
      example: 7b2c4d6e-1f3a-4b5c-9d8e-0a1b2c3d4e5f
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Версия пакета в формате `"<version>"`, полученная из `ETag`. Защищает от
        изменения состояния по устаревшим данным.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      example: '"3"'
    PackageId:
      name: packageId
      in: path
      required: true
      description: Идентификатор пакета документов
      schema:
        type: string
        format: uuid
      example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Идентификатор документа в пакете
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Идентификатор сессии подписания
      schema:
        type: string
        format: uuid
      example: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
    XContentSha256Request:
      name: X-Content-SHA256
      in: header
      required: false
      description: |
        Ожидаемая контрольная сумма содержимого в hex-формате. Если передана,
        должна совпадать с вычисленной сервисом и с `sha256` метаданных
        документа.
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
      example: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
    WebhookEventId:
      name: X-Webhook-Event-Id
      in: header
      required: true
      description: Уникальный идентификатор события для защиты от повторной обработки
      schema:
        type: string
        format: uuid
    WebhookTimestamp:
      name: X-Webhook-Timestamp
      in: header
      required: true
      description: Время формирования уведомления, Unix-время в секундах
      schema:
        type: integer
        format: int64
    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      description: HMAC-SHA256 подписи уведомления в формате `t=<timestamp>,v1=<hex>`
      schema:
        type: string
  headers:
    Location:
      description: Ссылка на созданный ресурс или результат операции
      schema:
        type: string
        format: uri-reference
    ETag:
      description: Версия ресурса в формате `"<version>"`
      schema:
        type: string
        example: '"3"'
    IdempotentReplayed:
      description: Признак возврата сохранённого ответа по ключу идемпотентности
      schema:
        type: boolean
        example: true
    ContentDisposition:
      description: Имя файла для сохранения
      schema:
        type: string
        example: attachment; filename="document.pdf"
    XContentSha256Response:
      description: Контрольная сумма выданного содержимого в hex-формате
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
  responses:
    BadRequest:
      description: |
        Некорректный запрос: синтаксическая ошибка, отсутствующее обязательное
        поле, недопустимое значение или отсутствующий `Idempotency-Key`.
        Возможные коды: `MALFORMED_REQUEST`, `VALIDATION_ERROR`,
        `IDEMPOTENCY_KEY_REQUIRED`, `INVALID_PACKAGE_EXPIRY`,
        `INVALID_PAGINATION_CURSOR`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              summary: Ошибка валидации поля
              value:
                code: VALIDATION_ERROR
                message: Запрос не прошёл валидацию
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
                details:
                  - field: documents[0].sha256
                    code: INVALID_FORMAT
                    message: Ожидается 64 шестнадцатеричных символа в нижнем регистре
    Unauthorized:
      description: |
        Недействительный, истёкший или отсутствующий токен доступа.
        Код: `UNAUTHENTICATED`.
      headers:
        WWW-Authenticate:
          description: Схема и параметры аутентификации
          schema:
            type: string
            example: Bearer realm="podpis-online"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              summary: Токен недействителен
              value:
                code: UNAUTHENTICATED
                message: Требуется действительный токен доступа
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
    Forbidden:
      description: |
        Недостаточно прав или объект принадлежит другому партнёру/клиенту.
        Код: `ACCESS_DENIED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            accessDenied:
              summary: Пакет принадлежит другому клиенту
              value:
                code: ACCESS_DENIED
                message: Доступ к пакету запрещён
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
    NotFound:
      description: |
        Объект не найден. Коды: `PACKAGE_NOT_FOUND`, `DOCUMENT_NOT_FOUND`,
        `SESSION_NOT_FOUND`. Отсутствие доступа к чужому объекту может
        возвращаться как `404`, чтобы не раскрывать его существование.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            packageNotFound:
              summary: Пакет не найден
              value:
                code: PACKAGE_NOT_FOUND
                message: Пакет с указанным идентификатором не найден
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
    Conflict:
      description: |
        Конфликт состояния или идемпотентности. Возможные коды:
        `INVALID_STATE_TRANSITION`, `PACKAGE_NOT_EDITABLE`, `PACKAGE_EXPIRED`,
        `DOCUMENT_NOT_SIGNED`, `ACTIVE_SESSION_EXISTS`, `SESSION_EXPIRED`,
        `SESSION_BLOCKED`, `INVALID_SESSION_STATE`,
        `DUPLICATE_EXTERNAL_REQUEST_ID`, `IDEMPOTENCY_KEY_REUSED`,
        `IDEMPOTENCY_KEY_IN_PROGRESS`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidState:
              summary: Недопустимый переход состояния
              value:
                code: INVALID_STATE_TRANSITION
                message: Операция недопустима в текущем состоянии пакета
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
                details:
                  - field: status
                    code: CURRENT_STATUS
                    message: Текущее состояние — SIGNING; отмена после начала подписания невозможна
    PreconditionFailed:
      description: |
        Версия пакета в `If-Match` не совпадает с актуальной.
        Код: `VERSION_MISMATCH`. Необходимо получить пакет повторно и повторить
        операцию с актуальным `ETag`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            versionMismatch:
              summary: Устаревшая версия пакета
              value:
                code: VERSION_MISMATCH
                message: Версия пакета изменилась; обновите данные и повторите операцию
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
    PayloadTooLarge:
      description: |
        Размер документа или пакета превышает допустимый. Коды:
        `PAYLOAD_TOO_LARGE` (один документ), `PACKAGE_SIZE_EXCEEDED` (пакет).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooLarge:
              summary: Превышен размер документа
              value:
                code: PAYLOAD_TOO_LARGE
                message: Размер документа превышает 26 214 400 байт
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
    UnsupportedMediaType:
      description: |
        Тип содержимого не поддерживается. Код: `UNSUPPORTED_MEDIA_TYPE`.
        На первом этапе поддерживается только `application/pdf`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unsupportedMediaType:
              summary: Передан не PDF
              value:
                code: UNSUPPORTED_MEDIA_TYPE
                message: Поддерживается только application/pdf
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
    UnprocessableEntity:
      description: |
        Семантическая ошибка, которую можно устранить изменением запроса или
        состояния. Возможные коды: `DOCUMENT_LIMIT_EXCEEDED`,
        `UNSUPPORTED_DOCUMENT_FORMAT`, `EMPTY_DOCUMENT`, `CHECKSUM_MISMATCH`,
        `DOCUMENTS_NOT_READY`, `INVALID_CONFIRMATION_CODE`,
        `CLIENT_CERTIFICATE_NOT_FOUND`, `CLIENT_CERTIFICATE_REVOKED`,
        `CLIENT_CERTIFICATE_EXPIRED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            checksum:
              summary: Контрольная сумма не совпала
              value:
                code: CHECKSUM_MISMATCH
                message: Контрольная сумма содержимого не совпадает с метаданными
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
                details:
                  - field: sha256
                    code: MISMATCH
                    message: Ожидалась сумма 9f2c...5f60, получена 0a1b...9c2d
    TooManyRequests:
      description: |
        Превышен лимит запросов. Код: `RATE_LIMIT_EXCEEDED`. Необходимо
        повторить запрос после `Retry-After`.
      headers:
        Retry-After:
          description: Время ожидания перед повтором, секунды
          schema:
            type: integer
            example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rateLimit:
              summary: Превышен лимит
              value:
                code: RATE_LIMIT_EXCEEDED
                message: Превышен лимит запросов; повторите позже
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: true
    InternalServerError:
      description: |
        Внутренняя ошибка сервиса. Код: `INTERNAL_ERROR`. Для идемпотентных
        запросов и запросов чтения допускается ограниченный повтор с
        экспоненциальной задержкой.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              summary: Внутренняя ошибка
              value:
                code: INTERNAL_ERROR
                message: Внутренняя ошибка сервиса
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: true
    BadGateway:
      description: |
        Ошибка внешней зависимости. Коды: `SIGNING_PROVIDER_ERROR`,
        `IDENTITY_PROVIDER_ERROR`. При ошибке криптографического компонента
        результат подписания может быть неизвестен: необходимо запросить
        состояние пакета, а не повторять подтверждение автоматически.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            signingProvider:
              summary: Ошибка криптографического компонента
              value:
                code: SIGNING_PROVIDER_ERROR
                message: Криптографический компонент вернул ошибку; результат операции неизвестен
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
    ServiceUnavailable:
      description: |
        Сервис временно недоступен. Код: `SERVICE_UNAVAILABLE`. Необходимо
        повторить запрос после `Retry-After`.
      headers:
        Retry-After:
          description: Время ожидания перед повтором, секунды
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              summary: Сервис недоступен
              value:
                code: SERVICE_UNAVAILABLE
                message: Сервис временно недоступен
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: true
    GatewayTimeout:
      description: |
        Тайм-аут внешней зависимости. Код: `SIGNING_PROVIDER_TIMEOUT`.
        Результат подписания неизвестен; необходимо запросить состояние пакета.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            timeout:
              summary: Тайм-аут криптографического компонента
              value:
                code: SIGNING_PROVIDER_TIMEOUT
                message: Криптографический компонент не ответил вовремя; результат неизвестен
                traceId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                timestamp: '2026-10-29T12:00:00Z'
                retryable: false
  schemas:
    PackageStatus:
      type: string
      description: Состояние пакета документов
      enum:
        - DRAFT
        - PENDING_CONFIRMATION
        - SIGNING
        - SIGNED
        - PARTIALLY_SIGNED
        - REJECTED
        - CANCELLED
        - EXPIRED
        - FAILED
      x-enum-descriptions:
        DRAFT: Пакет создан; состав и содержимое можно изменять
        PENDING_CONFIRMATION: Состав зафиксирован; ожидается подтверждение клиента
        SIGNING: Подписание выполняется; результат может быть ещё неизвестен
        SIGNED: Все документы подписаны
        PARTIALLY_SIGNED: Часть документов подписана, часть завершилась ошибкой
        REJECTED: Клиент отказался от подписания
        CANCELLED: Пакет отменён партнёром до подтверждения
        EXPIRED: Истёк срок ожидания подтверждения
        FAILED: Ни один документ не подписан; обработка завершилась ошибкой
      example: PENDING_CONFIRMATION
    DocumentStatus:
      type: string
      description: Состояние документа в пакете
      enum:
        - PENDING
        - SIGNING
        - SIGNED
        - FAILED
      x-enum-descriptions:
        PENDING: Документ не подписан; ожидает обработки или остаётся неподписанным
        SIGNING: Для документа выполняется криптографическая операция
        SIGNED: Документ подписан, подпись сохранена
        FAILED: Подписание документа завершилось ошибкой
      example: SIGNED
    SessionStatus:
      type: string
      description: Состояние сессии подтверждения
      enum:
        - CREATED
        - CONFIRMED
        - COMPLETED
        - REJECTED
        - EXPIRED
        - BLOCKED
      x-enum-descriptions:
        CREATED: Вызов подтверждения сформирован; ожидается код
        CONFIRMED: Клиент подтвердил; подписание выполняется
        COMPLETED: Обработка завершена; итог доступен в результате пакета
        REJECTED: Клиент отказался от подписания
        EXPIRED: Истёк срок действия вызова подтверждения
        BLOCKED: Исчерпаны попытки ввода кода; требуется новая сессия
      example: CREATED
    ConfirmationMethod:
      type: string
      description: Способ подтверждения намерения клиента
      enum:
        - SMS_OTP
        - PUSH_APP
      x-enum-descriptions:
        SMS_OTP: Одноразовый код, доставленный на телефон клиента
        PUSH_APP: Подтверждение в приложении партнёра; код формируется приложением после локальной аутентификации
      example: SMS_OTP
    PackageSummary:
      type: object
      description: Агрегированные показатели пакета
      required:
        - documentsTotal
        - documentsSigned
        - documentsFailed
        - documentsPending
        - totalSizeBytes
      properties:
        documentsTotal:
          type: integer
          minimum: 1
          maximum: 20
          description: Общее количество документов в пакете
          example: 2
        documentsSigned:
          type: integer
          minimum: 0
          description: Количество успешно подписанных документов
          example: 2
        documentsFailed:
          type: integer
          minimum: 0
          description: Количество документов с ошибкой подписания
          example: 0
        documentsPending:
          type: integer
          minimum: 0
          description: Количество документов, ещё не завершивших обработку
          example: 0
        totalSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
          description: Суммарный размер документов в байтах
          example: 344064
    CertificateInfo:
      type: object
      description: Сведения о сертификате ключа проверки электронной подписи
      required:
        - certificateId
        - serialNumber
        - subject
        - issuer
        - validFrom
        - validTo
      properties:
        certificateId:
          type: string
          maxLength: 128
          description: Идентификатор сертификата в сервисе или УЦ
          example: cert-2026-000123
        serialNumber:
          type: string
          maxLength: 128
          description: Серийный номер сертификата
          example: 04A7B9C1D2E3F40506
        subject:
          type: string
          maxLength: 1024
          description: Субъект сертификата
          example: CN=Иванов Иван Иванович, INN=770912345678, O=ООО "Банк Пример"
        issuer:
          type: string
          maxLength: 1024
          description: Издатель сертификата
          example: CN=УЦ Пример, O=ООО "УЦ Пример"
        validFrom:
          type: string
          format: date-time
          description: Начало срока действия сертификата
          example: '2026-01-15T00:00:00Z'
        validTo:
          type: string
          format: date-time
          description: Окончание срока действия сертификата
          example: '2027-01-15T00:00:00Z'
        thumbprint:
          type: string
          maxLength: 128
          description: Отпечаток сертификата
          example: 3a7d1e5f9b2c4a6d8e0f1a3b5c7d9e1f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d
    DocumentSignature:
      type: object
      description: Данные сформированной электронной подписи документа
      required:
        - signatureId
        - signatureType
        - signatureFormat
        - signedAt
        - signedContentSha256
        - certificate
        - verificationStatus
      properties:
        signatureId:
          type: string
          format: uuid
          description: Идентификатор подписи
          example: e5f6a7b8-c9d0-4e1f-8a2b-3c4d5e6f7081
        signatureType:
          type: string
          enum:
            - UKEP
          description: Вид электронной подписи
          example: UKEP
        signatureFormat:
          type: string
          maxLength: 64
          description: |
            Формат подписи. Конкретный формат и способ встраивания в PDF
            согласуются с УЦ и криптографическим компонентом; значение
            `PAdES-BES` приведено как рабочее допущение.
          example: PAdES-BES
        signedAt:
          type: string
          format: date-time
          description: Время формирования подписи
          example: '2026-10-29T12:07:12Z'
        signedContentSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Контрольная сумма подписанного содержимого
          example: c8e5a2f9d6b34071f2a5c8e1b4d7a0f32639485b7c0e1d4f6a9b2c5d8e1f4073
        verificationStatus:
          type: string
          enum:
            - VALID
            - INVALID
            - UNKNOWN
          description: |
            Результат проверки подписи сервисом. `UNKNOWN` означает, что
            проверка ещё не завершена или недоступна; это не подтверждение
            действительности подписи.
          example: VALID
        certificate:
          $ref: '#/components/schemas/CertificateInfo'
    SignedContent:
      type: object
      description: Сведения о подписанном файле, доступном для скачивания
      required:
        - sha256
        - sizeBytes
        - availableUntil
        - downloadPath
      properties:
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Контрольная сумма подписанного файла
          example: c8e5a2f9d6b34071f2a5c8e1b4d7a0f32639485b7c0e1d4f6a9b2c5d8e1f4073
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: Размер подписанного файла в байтах
          example: 312450
        availableUntil:
          type: string
          format: date-time
          description: Срок доступности файла; конкретное значение определяется политикой хранения (OQ-05)
          example: '2031-10-29T12:07:30Z'
        downloadPath:
          type: string
          maxLength: 2048
          description: Путь от корня хоста API для скачивания подписанного файла
          example: /v1/signing-packages/5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01/documents/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d/content?variant=SIGNED
    DocumentError:
      type: object
      description: Ошибка обработки отдельного документа
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          maxLength: 64
          description: Машиночитаемый код ошибки документа
          example: SIGNING_PROVIDER_ERROR
        message:
          type: string
          maxLength: 1024
          description: Описание ошибки для журнала и поддержки
          example: Криптографический компонент не сформировал подпись
        retryable:
          type: boolean
          description: Допускает ли ошибка повторную обработку документа
          example: false
    Document:
      type: object
      description: Документ в составе пакета
      required:
        - documentId
        - sequence
        - fileName
        - mimeType
        - sizeBytes
        - sha256
        - status
      properties:
        documentId:
          type: string
          format: uuid
          description: Идентификатор документа
          example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        partnerDocumentId:
          type: string
          maxLength: 64
          nullable: true
          description: Идентификатор документа в системе партнёра; уникален в пределах пакета
          example: DOC-458-01
        sequence:
          type: integer
          minimum: 1
          maximum: 20
          description: Порядковый номер документа в пакете
          example: 1
        fileName:
          type: string
          maxLength: 255
          description: Имя файла для отображения; сервер не использует его как путь
          example: Кредитный договор № 458.pdf
        mimeType:
          type: string
          enum:
            - application/pdf
          description: MIME-тип содержимого
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
          description: Размер содержимого в байтах
          example: 245760
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Контрольная сумма исходного содержимого
          example: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
        status:
          $ref: '#/components/schemas/DocumentStatus'
        uploadedAt:
          type: string
          format: date-time
          nullable: true
          description: Время загрузки содержимого
          example: '2026-10-29T12:00:40Z'
        signedAt:
          type: string
          format: date-time
          nullable: true
          description: Время успешного подписания
          example: '2026-10-29T12:07:12Z'
        signature:
          description: Данные подписи; отсутствует, если документ не подписан
          allOf:
            - $ref: '#/components/schemas/DocumentSignature'
        signedContent:
          description: Сведения о подписанном файле; отсутствует, если документ не подписан
          allOf:
            - $ref: '#/components/schemas/SignedContent'
        error:
          description: Ошибка обработки документа; отсутствует, если ошибки нет
          allOf:
            - $ref: '#/components/schemas/DocumentError'
    SigningPackage:
      type: object
      description: Пакет документов и его текущее состояние
      required:
        - packageId
        - clientId
        - status
        - signatureType
        - documents
        - summary
        - createdAt
        - updatedAt
        - version
        - notificationsEnabled
      properties:
        packageId:
          type: string
          format: uuid
          description: Идентификатор пакета
          example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
        partnerId:
          type: string
          maxLength: 128
          description: Идентификатор партнёра; не возвращается клиенту
          example: partner-bank-01
        externalRequestId:
          type: string
          maxLength: 64
          description: Внешний идентификатор запроса партнёра; не возвращается клиенту
          example: BNK-2026-000458
        clientId:
          type: string
          maxLength: 128
          description: Идентификатор клиента в системе партнёра
          example: client-8f3a2c
        title:
          type: string
          maxLength: 255
          nullable: true
          description: Отображаемое название пакета
          example: Кредитный пакет № 458
        status:
          $ref: '#/components/schemas/PackageStatus'
        statusReason:
          type: string
          maxLength: 500
          nullable: true
          description: Пояснение причины текущего состояния (отказ, отмена, ошибка)
          example: Клиент не согласен с условиями документа
        signatureType:
          type: string
          enum:
            - UKEP
          description: Вид электронной подписи, применяемый к пакету
          example: UKEP
        documents:
          type: array
          minItems: 1
          maxItems: 20
          description: Документы пакета в порядке подписания
          items:
            $ref: '#/components/schemas/Document'
        summary:
          $ref: '#/components/schemas/PackageSummary'
        createdAt:
          type: string
          format: date-time
          description: Время создания пакета
          example: '2026-10-29T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Время последнего изменения пакета
          example: '2026-10-29T12:01:10Z'
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: Время отправки пакета на подписание
          example: '2026-10-29T12:01:10Z'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Срок ожидания подтверждения клиентом
          example: '2026-11-05T18:00:00Z'
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Время достижения терминального состояния
          example: '2026-10-29T12:07:30Z'
        version:
          type: integer
          minimum: 1
          description: Версия пакета; используется в ETag и If-Match
          example: 3
        activeSessionId:
          type: string
          format: uuid
          nullable: true
          description: Идентификатор активной сессии подтверждения
          example: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
        notificationsEnabled:
          type: boolean
          description: Признак того, что партнёр получает callback-уведомления
          example: true
        partnerMetadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          maxProperties: 20
          description: |
            Дополнительные атрибуты партнёра для корреляции. Не должны содержать
            персональные данные; клиенту не возвращаются.
          example:
            branchId: MSK-12
            productCode: CREDIT-2026
    SigningResult:
      type: object
      description: Результат обработки пакета и документов
      required:
        - packageId
        - status
        - signatureType
        - summary
        - documents
      properties:
        packageId:
          type: string
          format: uuid
          description: Идентификатор пакета
          example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
        status:
          $ref: '#/components/schemas/PackageStatus'
        signatureType:
          type: string
          enum:
            - UKEP
          description: Вид электронной подписи
          example: UKEP
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Время завершения обработки; null, если обработка не завершена
          example: '2026-10-29T12:07:30Z'
        summary:
          $ref: '#/components/schemas/PackageSummary'
        documents:
          type: array
          minItems: 1
          maxItems: 20
          description: Результат по каждому документу
          items:
            $ref: '#/components/schemas/Document'
    SigningPackageSummary:
      type: object
      description: Краткие сведения о пакете для списка
      required:
        - packageId
        - externalRequestId
        - clientId
        - status
        - createdAt
        - updatedAt
        - documentsTotal
        - documentsSigned
        - documentsFailed
      properties:
        packageId:
          type: string
          format: uuid
          example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
        externalRequestId:
          type: string
          maxLength: 64
          example: BNK-2026-000458
        clientId:
          type: string
          maxLength: 128
          example: client-8f3a2c
        title:
          type: string
          maxLength: 255
          nullable: true
          example: Кредитный пакет № 458
        status:
          $ref: '#/components/schemas/PackageStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-29T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-29T12:07:30Z'
        submittedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-29T12:01:10Z'
        completedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-29T12:07:30Z'
        documentsTotal:
          type: integer
          minimum: 1
          maximum: 20
          example: 2
        documentsSigned:
          type: integer
          minimum: 0
          example: 2
        documentsFailed:
          type: integer
          minimum: 0
          example: 0
    SigningPackagePage:
      type: object
      description: Страница списка пакетов
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SigningPackageSummary'
        nextCursor:
          type: string
          maxLength: 512
          nullable: true
          description: Курсор следующей страницы; null, если страниц больше нет
          example: eyJjcmVhdGVkQXQiOiIyMDI2LTEwLTI5VDEyOjAwOjAwWiIsImlkIjoiNWYwYzJkN2UifQ
    DocumentMetadata:
      type: object
      description: Метаданные документа при создании пакета
      required:
        - fileName
        - mimeType
        - sizeBytes
        - sha256
      properties:
        partnerDocumentId:
          type: string
          maxLength: 64
          description: Идентификатор документа в системе партнёра; уникален в пределах пакета
          example: DOC-458-01
        fileName:
          type: string
          maxLength: 255
          description: Имя файла, отображаемое клиенту; сервер не использует его как путь
          example: Кредитный договор № 458.pdf
        mimeType:
          type: string
          enum:
            - application/pdf
          description: MIME-тип содержимого; на первом этапе поддерживается только PDF
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
          description: Ожидаемый размер содержимого в байтах
          example: 245760
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Ожидаемая контрольная сумма содержимого
          example: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
    CreateSigningPackageRequest:
      type: object
      description: Запрос на создание пакета документов
      required:
        - externalRequestId
        - clientId
        - documents
      properties:
        externalRequestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'
          description: Внешний идентификатор запроса; уникален в пределах партнёра
          example: BNK-2026-000458
        clientId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
          description: |
            Идентификатор клиента в системе партнёра. Должен совпадать с `sub`
            клиентского токена, предъявленного при подписании.
          example: client-8f3a2c
        title:
          type: string
          maxLength: 255
          description: Отображаемое название пакета
          example: Кредитный пакет № 458
        documents:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            Состав пакета. Порядок элементов определяет порядок документов.
            После создания состав не изменяется; для изменения пакет отменяется
            и создаётся заново.
          items:
            $ref: '#/components/schemas/DocumentMetadata'
        callbackUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          description: |
            HTTPS-адрес для callback-уведомлений об изменении состояния пакета.
            Если не указан, партнёр использует опрос.
          example: https://partner.example.com/hooks/podpis-online
        expiresAt:
          type: string
          format: date-time
          description: |
            Желаемый срок ожидания подтверждения клиентом. Не более 30 дней от
            текущего момента. Если не указан, применяется значение по умолчанию
            (7 дней).
          example: '2026-11-05T18:00:00Z'
        partnerMetadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          maxProperties: 20
          description: |
            Дополнительные атрибуты партнёра для корреляции. Не должны содержать
            персональные данные.
          example:
            branchId: MSK-12
            productCode: CREDIT-2026
    CancelSigningPackageRequest:
      type: object
      description: Запрос на отмену пакета
      required:
        - reasonCode
      properties:
        reasonCode:
          type: string
          enum:
            - PARTNER_REQUEST
            - DUPLICATE_REQUEST
            - CLIENT_REQUEST
            - OTHER
          description: Причина отмены
          example: PARTNER_REQUEST
        comment:
          type: string
          maxLength: 500
          description: Комментарий к отмене
          example: Пакет сформирован повторно в новой операции
    CreateSigningSessionRequest:
      type: object
      description: Запрос на инициирование подписания клиентом
      required:
        - confirmationMethod
      properties:
        confirmationMethod:
          $ref: '#/components/schemas/ConfirmationMethod'
        deviceId:
          type: string
          maxLength: 128
          description: |
            Идентификатор устройства клиента для адресации push-подтверждения.
            Не является персональными данными и не должен содержать номер
            телефона или иные прямые идентификаторы.
          example: device-7c1e9a
    ConfirmationChallenge:
      type: object
      description: Параметры вызова подтверждения
      required:
        - challengeId
        - method
        - destinationMasked
        - expiresAt
        - attemptsRemaining
      properties:
        challengeId:
          type: string
          format: uuid
          description: Идентификатор вызова подтверждения
          example: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70
        method:
          $ref: '#/components/schemas/ConfirmationMethod'
        destinationMasked:
          type: string
          maxLength: 64
          description: Маскированный получатель кода или push-уведомления
          example: '+7 *** *** 45-67'
        expiresAt:
          type: string
          format: date-time
          description: Срок действия вызова подтверждения
          example: '2026-10-29T12:15:00Z'
        attemptsRemaining:
          type: integer
          minimum: 0
          maximum: 3
          description: Количество оставшихся попыток ввода кода
          example: 3
    SigningSession:
      type: object
      description: Сессия подтверждения подписания
      required:
        - sessionId
        - packageId
        - status
        - packageStatus
        - confirmationMethod
        - createdAt
        - expiresAt
        - version
      properties:
        sessionId:
          type: string
          format: uuid
          description: Идентификатор сессии
          example: c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f
        packageId:
          type: string
          format: uuid
          description: Идентификатор пакета
          example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
        status:
          $ref: '#/components/schemas/SessionStatus'
        packageStatus:
          $ref: '#/components/schemas/PackageStatus'
        confirmationMethod:
          $ref: '#/components/schemas/ConfirmationMethod'
        challenge:
          description: Параметры вызова подтверждения; отсутствуют после подтверждения или завершения сессии
          allOf:
            - $ref: '#/components/schemas/ConfirmationChallenge'
        createdAt:
          type: string
          format: date-time
          description: Время создания сессии
          example: '2026-10-29T12:00:00Z'
        expiresAt:
          type: string
          format: date-time
          description: Срок действия сессии
          example: '2026-10-29T12:15:00Z'
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          description: Время подтверждения клиентом
          example: '2026-10-29T12:03:20Z'
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Время завершения сессии
          example: '2026-10-29T12:07:30Z'
        version:
          type: integer
          minimum: 1
          description: Версия сессии; используется в ETag
          example: 2
    ConfirmSigningSessionRequest:
      type: object
      description: Запрос на подтверждение подписания
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
          format: uuid
          description: Идентификатор вызова подтверждения из сессии
          example: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70
        code:
          type: string
          minLength: 4
          maxLength: 12
          pattern: '^[0-9A-Za-z-]{4,12}$'
          description: |
            Одноразовый код подтверждения. Для `SMS_OTP` — код из SMS; для
            `PUSH_APP` — код, сформированный приложением партнёра после
            локальной аутентификации клиента.
          example: '482915'
    RejectSigningSessionRequest:
      type: object
      description: Запрос на отказ клиента от подписания
      required:
        - reasonCode
      properties:
        reasonCode:
          type: string
          enum:
            - CLIENT_DECLINED
            - WRONG_DOCUMENTS
            - OTHER
          description: Причина отказа
          example: CLIENT_DECLINED
        comment:
          type: string
          maxLength: 500
          description: Комментарий клиента или сотрудника поддержки
          example: Клиент не согласен с условиями документа
    DocumentStatusItem:
      type: object
      description: Статус документа в callback-уведомлении
      required:
        - documentId
        - status
      properties:
        documentId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        partnerDocumentId:
          type: string
          maxLength: 64
          nullable: true
          example: DOC-458-01
        status:
          $ref: '#/components/schemas/DocumentStatus'
        errorCode:
          type: string
          maxLength: 64
          nullable: true
          description: Код ошибки документа, если статус FAILED
          example: SIGNING_PROVIDER_ERROR
    PackageEvent:
      type: object
      description: Уведомление партнёра об изменении состояния пакета
      required:
        - eventId
        - eventType
        - occurredAt
        - packageId
        - packageStatus
        - externalRequestId
        - documents
        - summary
      properties:
        eventId:
          type: string
          format: uuid
          description: Уникальный идентификатор события
          example: f6a7b8c9-d0e1-4f2a-9b3c-4d5e6f708192
        eventType:
          type: string
          enum:
            - package.pending_confirmation
            - package.signing_started
            - package.signed
            - package.partially_signed
            - package.failed
            - package.rejected
            - package.expired
            - package.cancelled
          description: Тип события
          example: package.signed
        occurredAt:
          type: string
          format: date-time
          description: Время события
          example: '2026-10-29T12:07:30Z'
        packageId:
          type: string
          format: uuid
          description: Идентификатор пакета
          example: 5f0c2d7e-8a41-4b6c-9d2e-1f3a5b7c9e01
        packageStatus:
          $ref: '#/components/schemas/PackageStatus'
        externalRequestId:
          type: string
          maxLength: 64
          description: Внешний идентификатор запроса партнёра
          example: BNK-2026-000458
        signatureType:
          type: string
          enum:
            - UKEP
          description: Вид электронной подписи
          example: UKEP
        resultAvailable:
          type: boolean
          description: Доступен ли итоговый результат по пакету
          example: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentStatusItem'
        summary:
          $ref: '#/components/schemas/PackageSummary'
    ProblemDetail:
      type: object
      description: Детализация ошибки по конкретному полю или условию
      required:
        - code
        - message
      properties:
        field:
          type: string
          maxLength: 256
          description: Путь к полю или параметру запроса
          example: documents[0].sha256
        code:
          type: string
          maxLength: 64
          description: Код детализации
          example: INVALID_FORMAT
        message:
          type: string
          maxLength: 1024
          description: Описание детализации
          example: Ожидается 64 шестнадцатеричных символа в нижнем регистре
    Problem:
      type: object
      description: Единая модель ошибки API
      required:
        - code
        - message
        - traceId
        - timestamp
        - retryable
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          enum:
            - MALFORMED_REQUEST
            - VALIDATION_ERROR
            - IDEMPOTENCY_KEY_REQUIRED
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_KEY_IN_PROGRESS
            - INVALID_PACKAGE_EXPIRY
            - INVALID_PAGINATION_CURSOR
            - DOCUMENT_LIMIT_EXCEEDED
            - UNSUPPORTED_DOCUMENT_FORMAT
            - EMPTY_DOCUMENT
            - CHECKSUM_MISMATCH
            - DOCUMENTS_NOT_READY
            - PACKAGE_SIZE_EXCEEDED
            - INVALID_CONFIRMATION_CODE
            - CLIENT_CERTIFICATE_NOT_FOUND
            - CLIENT_CERTIFICATE_REVOKED
            - CLIENT_CERTIFICATE_EXPIRED
            - UNAUTHENTICATED
            - ACCESS_DENIED
            - PACKAGE_NOT_FOUND
            - DOCUMENT_NOT_FOUND
            - SESSION_NOT_FOUND
            - INVALID_STATE_TRANSITION
            - PACKAGE_NOT_EDITABLE
            - PACKAGE_EXPIRED
            - DOCUMENT_NOT_SIGNED
            - ACTIVE_SESSION_EXISTS
            - SESSION_EXPIRED
            - SESSION_BLOCKED
            - INVALID_SESSION_STATE
            - DUPLICATE_EXTERNAL_REQUEST_ID
            - VERSION_MISMATCH
            - UNSUPPORTED_MEDIA_TYPE
            - PAYLOAD_TOO_LARGE
            - RATE_LIMIT_EXCEEDED
            - INTERNAL_ERROR
            - SIGNING_PROVIDER_ERROR
            - SIGNING_PROVIDER_TIMEOUT
            - IDENTITY_PROVIDER_ERROR
            - SERVICE_UNAVAILABLE
          example: VALIDATION_ERROR
        message:
          type: string
          maxLength: 1024
          description: Человекочитаемое описание ошибки
          example: Запрос не прошёл валидацию
        traceId:
          type: string
          maxLength: 64
          description: Идентификатор трассировки для обращения в поддержку
          example: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
        timestamp:
          type: string
          format: date-time
          description: Время формирования ошибки
          example: '2026-10-29T12:00:00Z'
        retryable:
          type: boolean
          description: |
            Допускает ли ошибка автоматический повтор того же запроса. При
            неизвестном результате криптографической операции значение `false`.
          example: false
        details:
          type: array
          maxItems: 20
          description: Детализация ошибки
          items:
            $ref: '#/components/schemas/ProblemDetail'
