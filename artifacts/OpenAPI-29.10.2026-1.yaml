      description: |
        Создаёт сессию подтверждения для клиента. Пакет должен находиться в
        `PENDING_CONFIRMATION`; одновременно допускается одна активная сессия
        на пакет, повторный вызов возвращает `409 ACTIVE_SESSION_EXISTS` с
        идентификатором действующей сессии.

        Сервис проверяет наличие и действительность сертификата клиента до
        выдачи вызова подтверждения: отсутствие сертификата, отзыв или
        истечение срока — `422` с соответствующим кодом. Код подтверждения в
        ответе не возвращается: доставка выполняется по каналу, определённому
        `confirmationMethod`.
      operationId: createSigningSession
      security:
        - clientOAuth:
            - signing-sessions:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
