  /signing-packages/{packageId}/documents/{documentId}/content:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/XRequestId'
    put:
      tags:
        - Документы
      summary: Загрузить содержимое документа
      operationId: uploadDocumentContent
      description: |
        Загружает содержимое документа в формате PDF. Допустимо только для
        пакета в состоянии `DRAFT`; для каждого документа содержимое может быть
        загружено повторно, при этом предыдущая версия заменяется.

        Сервис вычисляет SHA-256 полученного содержимого и сравнивает его с
        `sha256`, указанным при создании пакета. При несовпадении содержимое не
        принимается (`422 CHECKSUM_MISMATCH`). Если передан заголовок
        `X-Content-SHA256`, он также должен совпасть с вычисленным значением.

        Загрузка идемпотентна по содержимому: повторная передача тех же байтов
        возвращает `200` и не изменяет версию пакета. Загрузка другого
        содержимого в `DRAFT` заменяет предыдущую версию и увеличивает версию
        пакета; содержимое должно соответствовать `sha256` из метаданных.
      security:
        - partnerOAuth:
            - signing-packages:write
      parameters:
        - $ref: '#/components/parameters/XContentSha256Request'
      requestBody:
        required: true
        description: Содержимое документа в формате PDF
        content:
          application/pdf:
            schema:
              type: string
              format: binary
              description: Бинарное содержимое PDF-документа
      responses:
        '200':
          description: Содержимое принято
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              examples:
                uploaded:
                  summary: Документ загружен
                  value:
                    documentId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    partnerDocumentId: DOC-458-01
                    sequence: 1
                    fileName: Кредитный договор № 458.pdf
                    mimeType: application/pdf
                    sizeBytes: 245760
                    sha256: 9f2c4a7e1b3d5f6089a0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60
                    status: PENDING
