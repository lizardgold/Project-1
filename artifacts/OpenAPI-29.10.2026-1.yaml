x-idempotency:
  header: Idempotency-Key
  requiredFor:
    - createSigningPackage
    - submitSigningPackage
    - cancelSigningPackage
    - createSigningSession
    - confirmSigningSession
    - rejectSigningSession
  ttlHours: 24
  scope: |
    Ключ уникален в пределах партнёра и операции. Отпечаток запроса включает
    метод, путь, параметры и тело.
  replayHeader: Idempotent-Replayed
  behavior: |
    Повтор с тем же ключом и тем же отпечатком возвращает сохранённый ответ
    с заголовком Idempotent-Replayed: true. Повтор с другим отпечатком —
    409 IDEMPOTENCY_KEY_REUSED. Параллельный запрос с тем же ключом —
    409 IDEMPOTENCY_KEY_IN_PROGRESS (допустим повтор после задержки).
  conflictCodes:
    - IDEMPOTENCY_KEY_REQUIRED
    - IDEMPOTENCY_KEY_REUSED
    - IDEMPOTENCY_KEY_IN_PROGRESS
x-webhooks:
  registration: |
    Партнёр указывает callbackUrl при создании пакета. Уведомления доставляются
    только по пакетам этого партнёра. Отсутствие callbackUrl означает, что
    партнёр получает состояние опросом.
  events:
    - signing-package.submitted
    - signing-package.signing-started
    - signing-package.completed
    - signing-package.partially-signed
    - signing-package.failed
    - signing-package.rejected
    - signing-package.cancelled
    - signing-package.expired
  timestampToleranceSeconds: 300
  delivery: |
    Доставка выполняется методом POST с телом PackageEvent и заголовками
    X-Webhook-Event-Id и X-Webhook-Timestamp. Получатель обязан отвечать 2xx
    в течение 5 секунд. Подпись и timestamp проверяются получателем до
    обработки события; событие с timestamp старше 5 минут отклоняется.
    Доставка не гарантирует порядок событий.
  retryPolicy:
    maxAttempts: 8
    windowHours: 24
    backoff: 1 мин, 5 мин, 15 мин, 30 мин, 1 ч, 3 ч
    onClientError: |
      Ответы 4xx, кроме 408 и 429, считаются окончательной ошибкой: повторная
      доставка прекращается, событие фиксируется как недоставленное, партнёр
      получает состояние опросом.
    onServerError: |
      Ответы 5xx, 408 и 429 считаются временной ошибкой и повторяются в
      пределах окна доставки; после исчерпания попыток событие фиксируется
      как недоставленное.
  signature: |
    X-Webhook-Signature: t=<X-Webhook-Timestamp>,v1=<HMAC-SHA256 от
    "<timestamp>.<сырое тело>" с секретом партнёра>. Получатель проверяет
    подпись до обработки события.
x-rate-limits:
  partner:
    requestsPerMinute: 600
    scope: client_id партнёра
  client:
    requestsPerMinute: 120
    scope: subject клиентского токена
  upload:
    requestsPerMinute: 60
    scope: client_id партнёра
  note: |
    Значения предварительные; при превышении возвращается 429 с Retry-After.
x-open-questions:
  - id: OQ-01
    question: |
      Какой механизм подтверждения намерения клиента является целевым: SMS-код,
      push-подтверждение в приложении партнёра, биометрия или их комбинация?
      Достаточно ли одного фактора для юридически значимого подтверждения?
      Подтверждение единое для пакета или отдельное для каждого документа?
    impact: |
      Влияет на модель сессии, состав ConfirmationChallenge, требования к
      интеграции с приложением партнёра и доказательную базу подтверждения.
      Гранулярность подтверждения определяет число сессий на пакет.
    status: OPEN
    owner: Владелец продукта, архитектор безопасности
  - id: OQ-02
    question: |
      Где выполняется криптографическая операция и в каком формате формируется
      УКЭП (PAdES-BES, CAdES-BES, иной)? Кто предоставляет сертификат и ключ:
      УЦ, отдельный криптопровайдер или приложение клиента?
    impact: |
      Влияет на SignatureType, состав DocumentSignature и CertificateInfo,
      коды ошибок SIGNING_PROVIDER_*, требования к хранению ключей.
    status: OPEN
    owner: Архитектор, владелец интеграции с УЦ
  - id: OQ-03
    question: |
      Допускается ли частичное подписание пакета бизнесом, или пакет должен
      подписываться атомарно? Что делать с уже подписанными документами при
      ошибке остальных?
    impact: |
      Влияет на статус PARTIALLY_SIGNED, поведение при ошибках и требования
      партнёров к повторной обработке.
    status: OPEN
    owner: Владелец продукта
  - id: OQ-04
    question: |
      Как повторно подписывать документы, завершившиеся ошибкой: в рамках новой
      сессии того же пакета, нового пакета или отдельной операции повторной
      обработки?
    impact: |
      Влияет на модель состояний документа и пакета, идемпотентность и контракт
      повторной обработки. В текущей версии повторная обработка не описана.
    status: OPEN
    owner: Владелец продукта, архитектор
  - id: OQ-05
    question: |
      Каковы согласованные сроки: срок жизни черновика, срок ожидания
      подтверждения, срок жизни сессии, срок хранения и доступности подписанных
      документов?
    impact: |
      Влияет на expiresAt, фоновые переходы в EXPIRED и требования к
      архивированию.
    status: OPEN
    owner: Владелец продукта, юридическая служба
  - id: OQ-06
    question: |
      Подтверждаются ли лимиты: 20 документов, 25 МиБ на документ, 100 МиБ на
      пакет, только PDF? Нужна ли частичная загрузка крупных документов?
    impact: |
      Влияет на валидацию, коды ошибок, лимиты API-шлюза и требования к
      хранилищу. Частичная загрузка (Content-Range) в текущей версии не
      поддерживается.
    status: OPEN
    owner: Архитектор, владелец интеграции
  - id: OQ-07
    question: |
      Кто выпускает клиентский токен и какие claims подтверждают личность?
      Как сопоставляется clientId партнёра с субъектом токена и внутренним
      клиентом сервиса?
    impact: |
      Влияет на clientOAuth, проверку доступа к пакету и защиту от подмены
      клиента.
    status: OPEN
    owner: Архитектор безопасности, владелец интеграции с партнёром
  - id: OQ-08
    question: |
      Являются ли callback-уведомления обязательными для партнёров, или
      достаточно опроса? Нужна ли отдельная подписка на события вне пакета?
    impact: |
      Влияет на callbackUrl, контракт PackageEvent, инфраструктуру доставки и
      требования к партнёрам.
    status: OPEN
    owner: Владелец продукта, владельцы интеграций
  - id: OQ-09
    question: |
      Каков предельный срок устранения неизвестного результата при недоступности
      криптографического компонента? Допустимо ли долгое пребывание пакета в
      SIGNING и кто принимает решение о ручном разборе?
    impact: |
      Влияет на регламент сверки, статусы SIGNING и FAILED, уведомления и
      поддержку.
    status: OPEN
    owner: Архитектор, служба эксплуатации
  - id: OQ-10
    question: |
      Нужна ли отдельная операция проверки подписи в этом API, или достаточно
      сведений о подписи в результате обработки пакета?
    impact: |
      Влияет на состав операций и контракт проверки подписи.
    status: OPEN
    owner: Владелец продукта
x-assumptions:
  - id: A-01
    statement: |
      Система партнёра аутентифицируется по OAuth 2.0 Client Credentials;
      client_id однозначно сопоставлен партнёру. mTLS рекомендуется, но не
      делается обязательным до согласования.
    rationale: Соответствует модели машинной идентичности в базе знаний проекта.
    affected: partnerOAuth, доступ к пакетам
  - id: A-02
    statement: |
      Клиентский токен выпускается приложением партнёра после аутентификации
      клиента; sub токена равен clientId, переданному партнёром.
    rationale: Позволяет проверять принадлежность пакета без передачи персональных данных.
    affected: clientOAuth, CreateSigningPackageRequest.clientId
  - id: A-03
    statement: |
      Пакет создаётся с полным составом документов; добавление и удаление
      документов после создания не поддерживается.
    rationale: Обеспечивает неизменность состава до начала подписания.
    affected: createSigningPackage, submitSigningPackage
  - id: A-04
    statement: |
      Сессия подписания — отдельная сущность, идентифицирующая попытку
      подтверждения. Одновременно допускается одна активная сессия на пакет.
    rationale: Разделяет пакет, операцию подтверждения и результат документа.
    affected: SigningSession, PackageStatus
  - id: A-05
    statement: |
      При частичном успехе пакет получает PARTIALLY_SIGNED, результаты
      документов сохраняются независимо; автоматическая компенсация уже
      выполненных подписей не выполняется.
    rationale: Соответствует бизнес-правилу 2.4 базы знаний о сохранении результатов отдельных подписаний.
    affected: PackageStatus, SigningResult
  - id: A-06
    statement: |
      Подтверждение выполняется одноразовым кодом; поддерживаются SMS_OTP и
      PUSH_APP, конкретный механизм требует согласования.
    rationale: Даёт единый контракт подтверждения без привязки к каналу.
    affected: ConfirmationMethod, ConfirmSigningSessionRequest
  - id: A-07
    statement: |
      Callback-уведомления необязательны; при отсутствии callbackUrl партнёр
      использует опрос статуса.
    rationale: Позволяет подключать партнёров с разным уровнем готовности.
    affected: callbackUrl, PackageEvent
  - id: A-08
    statement: |
      Идемпотентность хранится 24 часа; ключ обязателен для всех изменяющих
      POST-операций.
    rationale: Снижает риск дублирования бизнес-операций при повторной доставке.
    affected: Idempotency-Key, все POST-операции
  - id: A-09
    statement: |
      На первом этапе поддерживается только PDF; лимиты 20 документов, 25 МиБ
      на документ и 100 МиБ на пакет предварительные.
    rationale: Упрощает криптографическую обработку и согласуется с типовыми ограничениями каналов.
    affected: DocumentMetadata, Document, ошибки валидации
  - id: A-10
    statement: |
      Срок ожидания подтверждения по умолчанию — 7 дней, максимум 30 дней;
      сессия подтверждения — 15 минут; попыток ввода кода — 3.
    rationale: Обеспечивает предсказуемое поведение и ограничивает окно риска.
    affected: expiresAt, SigningSession, ConfirmationChallenge
  - id: A-11
    statement: |
      При неизвестном результате подписания пакет остаётся в SIGNING, документ —
      в SIGNING; сервис выполняет сверку с криптографическим компонентом.
    rationale: Соответствует правилу 4.4 базы знаний о неопределённом результате.
    affected: PackageStatus, DocumentStatus, SigningResult.resultUnknown
