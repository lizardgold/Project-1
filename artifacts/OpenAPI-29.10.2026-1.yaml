  /signing-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/XRequestId'
    get:
      tags:
        - Подписание клиентом
      summary: Получить состояние сессии подписания
      description: |
        Возвращает состояние сессии подтверждения и состояние связанного пакета.
        Используется клиентом для восстановления сценария после перезапуска
        приложения и партнёром для диагностики.

        Параметры вызова подтверждения (`challenge`) возвращаются только пока
        сессия в состоянии `PENDING`.
