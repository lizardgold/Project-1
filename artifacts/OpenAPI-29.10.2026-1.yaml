  /signing-packages/{packageId}/submit:
    parameters:
      - $ref: '#/components/parameters/PackageId'
      - $ref: '#/components/parameters/XRequestId'
    post:
      tags:
        - Пакеты документов
      summary: Зафиксировать состав и отправить пакет на подписание
      operationId: submitSigningPackage
      description: |
        Переводит пакет из `DRAFT` в `PENDING_CONFIRMATION` и фиксирует состав.
        Перед переходом сервис проверяет, что для каждого документа загружено
        содержимое, контрольные суммы совпадают с метаданными, формат и размеры
        допустимы. После успешного вызова изменение состава невозможно.

        Требует `If-Match` с актуальным `ETag` пакета: при расхождении
        возвращается `412 VERSION_MISMATCH`. Требует `Idempotency-Key`.

        Срок `expiresAt` устанавливается сервисом, если не был задан при
        создании; после его истечения пакет переходит в `EXPIRED`. Если
        запрошенный `expiresAt` уже истёк к моменту отправки, пакет остаётся в
        `DRAFT`, а запрос завершается `409 PACKAGE_EXPIRED`.
      security:
        - partnerOAuth:
            - signing-packages:write
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Пакет отправлен на подписание
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
